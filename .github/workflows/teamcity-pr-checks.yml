name: TeamCity Configuration Tests

permissions: read-all

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/teamcity-pr-checks.yml'
      - 'mmv1/third_party/terraform/.teamcity/**'


jobs:
  teamcity-config-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: zulu
          java-version: 21
          java-package: jdk

      # Maven 3.10.0 (default on newer runner images) breaks TeamCity DSL generation with JDOM NoSuchMethodError
      - name: Setup Maven
        env:
          MAVEN_VERSION: 3.9.16
        run: |
          curl -fsSL "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Cache Maven files
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download TeamCity Tools
        run : |
          cd mmv1/third_party/terraform/.teamcity
          make tools

      # Running the tests twice ensures that the tests are discovered and run
      - name: Run TeamCity Tests
        run : |
          cd mmv1/third_party/terraform/.teamcity
          make test
          make test
