name: unit-test-tools

permissions:
  contents: read


on:
  pull_request:
    paths:
      - 'docs/content/breaking-changes/breaking-changes.md'
      - 'tools/**'
      - '.github/workflows/unit-test-tools.yml'

jobs:
  diff-processor:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        repo:
          - terraform-provider-google
          - terraform-provider-google-beta
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            tools/diff-processor/go.sum
            mmv1/third_party/terraform/go.sum

      - name: Prepare diff-processor with ${{ matrix.repo }}
        run: |
          cd tools/diff-processor
          make clone OWNER_REPO="hashicorp/${REPO}" DEPTH=1
          make copy-provider OLD_REF=main NEW_REF=main
        env:
          REPO: ${{ matrix.repo }}

      - name: Test diff-processor with ${{ matrix.repo }}
        run: |
          cd tools/diff-processor
          go test ./...
        env:
          # detector.KnownUnreadableTests is maintained against the beta
          # provider, so only check it there.
          SERVICES_DIR: ${{ matrix.repo == 'terraform-provider-google-beta' && format('{0}/tools/diff-processor/new/google/services', github.workspace) || '' }}

  go-changelog:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            tools/go-changelog/go.sum

      - name: Test go-changelog
        run: |
          cd tools/go-changelog
          go test ./...

  issue-labeler:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            tools/issue-labeler/go.sum

      - name: Test issue-labeler
        run: |
          cd tools/issue-labeler
          go test ./...

  template-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            tools/template-check/go.sum

      - name: Test template-check
        run: |
          cd tools/template-check
          go test ./...

  test-reader:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            tools/test-reader/go.sum

      - name: Test test-reader
        run: |
          cd tools/test-reader
          go test ./...
