name: unit-test-tpg

permissions:
  contents: read


on:
  workflow_call:
    inputs:
      repo:
        description: 'Repository for the matrix'
        required: true
        type: string

jobs:
  compile-and-unit-tests:
    name: unit-test-${{ inputs.repo }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifact-${{ inputs.repo }}
          path: artifacts

      - name: Unzip the artifacts and delete the zip
        run: |
          unzip artifacts/output.zip -d ./
          rm artifacts/output.zip

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'
          cache: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.3'
          terraform_wrapper: false

      - name: Restore Go cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: github.event_name != 'push'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ inputs.repo }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.repo }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-go-${{ inputs.repo }}-

      - name: Cache Go on main
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: github.event_name == 'push'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ inputs.repo }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.repo }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-go-${{ inputs.repo }}-

      - name: Get dependencies
        run: |
          go mod download


      # `make testnolint` compiles all provider and unit test packages into the
      # Go build cache without linking an unused root binary via `go build`, so
      # `make lint` (`fmtcheck` + `go vet ./...`) can reuse the cached artifacts.
      - name: Run Unit Tests
        run: |
          make testnolint

      - name: Full Build & Lint Check
        run: |
          make lint

      - name: Documentation Check
        run: |
          make docscheck
