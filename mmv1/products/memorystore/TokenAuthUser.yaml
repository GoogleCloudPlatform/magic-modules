---
name: TokenAuthUser
description: |
  A user of a Memorystore for Valkey instance that uses token-based authentication.
references:
  guides:
    Official Documentation: https://docs.cloud.google.com/memorystore/docs/valkey
  api: https://docs.cloud.google.com/memorystore/docs/valkey/reference/rest/v1/projects.locations.instances.tokenAuthUsers
docs:
base_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}/tokenAuthUsers
self_link: projects/{{project}}/locations/{{location}}/instances/{{instance}}/tokenAuthUsers/{{user_id}}
create_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}:addTokenAuthUser
# A new user always has an auth token, and the API won't delete a user with tokens unless force is set.
delete_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}/tokenAuthUsers/{{user_id}}?force=true
immutable: true
id_format: projects/{{project}}/locations/{{location}}/instances/{{instance}}/tokenAuthUsers/{{user_id}}
import_format:
  - projects/{{project}}/locations/{{location}}/instances/{{instance}}/tokenAuthUsers/{{user_id}}
mutex: memorystore/instance/projects/{{project}}/locations/{{location}}/instances/{{instance}}
timeouts:
  insert_minutes: 20
  delete_minutes: 20
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: [create, delete]
  result:
    resource_inside_response: false
autogen_async: true
custom_code:
  encoder: templates/terraform/encoders/memorystore_token_auth_user.go.tmpl
samples:
  - name: memorystore_token_auth_user_basic
    primary_resource_id: user
    steps:
      - name: memorystore_token_auth_user_basic
        resource_id_vars:
          instance_name: token-auth-instance
          user_name: my-user
parameters:
  - name: location
    type: String
    description: The location of the Memorystore instance, for example `us-central1`.
    required: true
    immutable: true
    url_param_only: true
  - name: instance
    type: String
    description: |
      The ID of the Memorystore instance to add the user to. The instance must have
      `authorization_mode` set to `TOKEN_AUTH`.
    required: true
    immutable: true
    url_param_only: true
  - name: userId
    type: String
    description: The name of the token auth user. This is the username used to authenticate to the instance.
    required: true
    immutable: true
    url_param_only: true
properties:
  - name: name
    type: String
    description: |
      The full resource name of the token auth user, in the format
      `projects/{project}/locations/{location}/instances/{instance}/tokenAuthUsers/{token_auth_user}`.
    output: true
  - name: state
    type: String
    description: |
      The current state of the token auth user. Possible values are listed in the
      [API documentation](https://docs.cloud.google.com/memorystore/docs/valkey/reference/rest/v1/projects.locations.instances.tokenAuthUsers#State).
    output: true
