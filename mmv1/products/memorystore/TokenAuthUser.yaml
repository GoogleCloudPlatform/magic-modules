---
name: "TokenAuthUser"
description: "Represents a Token Auth User for a Google Cloud Memorystore (Valkey) Instance."
immutable: true
base_url: "{{instance}}/tokenAuthUsers"
self_link: "{{instance}}/tokenAuthUsers/{{user_id}}"
create_url: "{{instance}}:addTokenAuthUser"
id_format: "{{instance}}/tokenAuthUsers/{{user_id}}"
import_format:
  - "{{instance}}/tokenAuthUsers/{{user_id}}"
async:
  type: OpAsync
  include_project: true
  operation:
    base_url: '{{op_id}}'
custom_code:
  encoder: templates/terraform/encoders/memorystore_token_auth_user.go.tmpl
properties:
  - name: "instance"
    type: "ResourceRef"
    resource: "Instance"
    imports: "name"
    description: "The full name of the Memorystore instance."
    required: true
    url_param_only: true
  - name: "user_id"
    type: "String"
    description: "The unique ID (username) of the Token Auth User."
    required: true
    url_param_only: true
  - name: "name"
    type: "String"
    description: "The full resource name of the Token Auth User."
    output: true
  - name: "state"
    type: "String"
    description: "The current state of the Token Auth User."
    output: true
