---
name: 'ApplicationTemplate'
base_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates'
create_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates?applicationTemplateId={{application_template_id}}'
self_link: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates/{{application_template_id}}'
update_verb: 'PATCH'
update_mask: true
async:
  actions: []
description: |
  Application template in Application Design Center.
import_format:
  - 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates/{{application_template_id}}'
samples:
  - name: 'designcenter_application_template_basic'
    primary_resource_id: 'example'
    steps:
      - name: 'designcenter_application_template_basic'
        resource_id_vars:
          application_template_id: 'example-template'
        vars:
          project: 'my-project-name'
          space: 'example-space'
        test_vars_overrides:
          project: 'BootstrapDesignCenterProject(t)'
          space: 'BootstrapDesignCenterSpace(t)'
      - name: 'designcenter_application_template_update'
        resource_id_vars:
          application_template_id: 'example-template'
        vars:
          project: 'my-project-name'
          space: 'example-space'
        test_vars_overrides:
          project: 'BootstrapDesignCenterProject(t)'
          space: 'BootstrapDesignCenterSpace(t)'

parameters:
  - type: String
    name: 'location'
    description: |
      The location of the application template.
    required: true
    url_param_only: true
    immutable: true
  - type: String
    name: 'space'
    description: |
      The space of the application template.
    required: true
    url_param_only: true
    immutable: true
  - type: String
    name: 'application_template_id'
    description: |
      The ID of the application template.
    required: true
    url_param_only: true
    immutable: true
properties:
  - type: String
    name: 'name'
    description: |
      Identifier. The resource name of the ApplicationTemplate. Format: `projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template_id}`
    output: true
  - type: String
    name: 'displayName'
    description: |
      Optional. User-defined display name.
  - type: String
    name: 'description'
    description: |
      Optional. User-defined description.
  - type: Array
    name: 'applicationParameters'
    description: |
      Optional. Parameters to apply to all components in an application, such
      as the project ID and region.
    item_type:
      type: NestedObject
      properties:
        - type: String
          name: 'key'
          description: 'The key of the parameter.'
          required: true
        - type: String
          name: 'value'
          description: 'The value of the parameter, as a JSON-encoded string. Use `jsonencode()` to set it.'
          send_empty_value: true
          state_func: 'func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }'
          custom_flatten: 'templates/terraform/custom_flatten/json_schema.tmpl'
          custom_expand: 'templates/terraform/custom_expand/json_value.tmpl'
          validation:
            function: 'validation.StringIsJSON'
  - type: Enum
    name: 'compositionType'
    default_from_api: true
    description: |
      Optional. Composition type of the template.
    immutable: true
    enum_values:
      - 'STANDARD'
      - 'COMPOSITE'
  - type: Array
    name: 'rootInputVariables'
    default_from_api: true
    description: |
      Optional. Root level input variables of the application template. For
      `STANDARD` templates, the API fills these in from the components.
    item_type:
      type: NestedObject
      properties:
        - type: String
          name: 'variable'
          description: 'The name of the variable.'
          required: true
        - type: String
          name: 'componentUri'
          description: 'The URI of the component that the variable belongs to.'
          required: true
  - type: Array
    name: 'rootOutputVariables'
    default_from_api: true
    description: |
      Optional. Root level output variables of the application template. For
      `STANDARD` templates, the API fills these in from the components.
    item_type:
      type: NestedObject
      properties:
        - type: String
          name: 'variable'
          description: 'The name of the variable.'
          required: true
        - type: String
          name: 'componentUri'
          description: 'The URI of the component that the variable belongs to.'
          required: true
  - type: NestedObject
    name: 'saasRuntimeContext'
    description: |
      Optional. SaaS runtime context for the application template.
    properties:
      - type: Array
        name: 'saasNames'
        description: |
          The SaaS names, in the format
          `projects/{project}/locations/{location}/saas/{saas}`.
        item_type:
          type: String
  - type: Boolean
    name: 'inputsAsRootModuleVariables'
    default_from_api: true
    description: |
      Optional. Inputs as root module variables.
  - type: String
    name: 'iacFormat'
    output: true
    description: |
      Output only. IaC format.
  - type: String
    name: 'serializedApplicationTemplate'
    output: true
    ignore_read: true
    description: |
      Output only. Serialized application template.
  - type: String
    name: 'latestRevision'
    output: true
    description: |
      Output only. Latest revision.
  - type: String
    name: 'artifactLocation'
    output: true
    ignore_read: true
    description: |
      Output only. Artifact location.
  - type: Time
    name: 'createTime'
    output: true
    description: |
      Output only. The time the resource was created.
  - type: Time
    name: 'updateTime'
    output: true
    description: |
      Output only. The time the resource was last updated.
