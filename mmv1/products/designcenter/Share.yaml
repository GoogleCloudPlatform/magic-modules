---
name: 'Share'
description: |
  A Share in Application Design Center.
references:
  guides:
    'Application Design Center': 'https://cloud.google.com/designcenter/docs'
  api: 'https://cloud.google.com/designcenter/docs/reference/rest'
id_format: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog}}/shares/{{share_id}}'
base_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog}}/shares'
create_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog}}/shares?shareId={{share_id}}'
self_link: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog}}/shares/{{share_id}}'
immutable: true
import_format:
  - 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog}}/shares/{{share_id}}'
  - '{{project}}/{{location}}/{{space}}/{{catalog}}/{{share_id}}'
  - '{{location}}/{{space}}/{{catalog}}/{{share_id}}'
autogen_async: true
timeouts:
  insert_minutes: 20
  delete_minutes: 20
parameters:
  - name: 'location'
    type: 'String'
    description: |
      The location of the share.
    required: true
    immutable: true
    url_param_only: true
  - name: 'space'
    type: 'String'
    description: |
      The space for the share.
    required: true
    immutable: true
    url_param_only: true
  - name: 'catalog'
    type: 'String'
    description: |
      The catalog for the share.
    required: true
    immutable: true
    url_param_only: true
  - name: 'share_id'
    type: 'String'
    description: |
      The ID of the share.
    required: true
    immutable: true
    url_param_only: true
properties:
  - name: 'name'
    type: 'String'
    description: |
      Identifier. The name of the share.
      Format: `projects/{project}/locations/{location}/spaces/{space}/catalogs/{catalog}/shares/{share}`
    output: true
  - name: 'destinationSpace'
    type: 'String'
    description: |
      The space to which the catalog is shared.
      Format: `projects/{project}/locations/{location}/spaces/{space}`
    required: true
    immutable: true
  - name: 'state'
    type: 'String'
    description: |
      The state of the share.
    output: true
  - name: 'createTime'
    type: 'Time'
    description: |
      Output only. [Output only] Create time stamp.
    output: true
  - name: 'updateTime'
    type: 'Time'
    description: |
      Output only. [Output only] Update time stamp.
    output: true
