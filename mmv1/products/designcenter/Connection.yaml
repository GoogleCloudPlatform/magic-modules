---
name: 'Connection'
base_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates/{{application_template}}/components/{{component}}/connections'
create_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates/{{application_template}}/components/{{component}}/connections?connectionId={{connection_id}}'
update_verb: 'PATCH'
update_mask: true
description: |
  A connection between two components in an Application Design Center Application Template.
import_format:
  - 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates/{{application_template}}/components/{{component}}/connections/{{connection_id}}'
parameters:
  - name: 'location'
    type: String
    description: 'The location of the space.'
    required: true
    url_param_only: true
    immutable: true
  - name: 'space'
    type: String
    description: 'The ID of the space.'
    required: true
    url_param_only: true
    immutable: true
  - name: 'application_template'
    type: String
    description: 'The ID of the application template.'
    required: true
    url_param_only: true
    immutable: true
  - name: 'component'
    type: String
    description: 'The ID of the component.'
    required: true
    url_param_only: true
    immutable: true
  - name: 'connection_id'
    type: String
    description: 'The ID of the connection.'
    required: true
    url_param_only: true
    immutable: true
properties:
  - name: 'name'
    type: String
    description: 'Identifier. The resource name of the Connection. Format: projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/components/{component}/connections/{connection_id}'
    output: true
  - name: 'createTime'
    type: Time
    description: 'Output only. [Output only] Create time stamp.'
    output: true
  - name: 'updateTime'
    type: Time
    description: 'Output only. [Output only] Update time stamp.'
    output: true
  - name: 'destinationComponentUri'
    type: String
    description: 'Required. The component URI that the connection points to.'
    required: true
  - name: 'sourceComponentParameters'
    type: KeyValuePairs
    description: 'Optional. Parameters associated with the source component.'
  - name: 'destinationComponentParameters'
    type: KeyValuePairs
    description: 'Optional. Parameters associated with the destination component.'
  - name: 'dependencyType'
    type: String
    description: 'Output only. The dependency type of the connection.'
    output: true
