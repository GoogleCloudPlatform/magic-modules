---
name: 'Connection'
base_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates/{{application_template}}/components/{{component}}/connections'
self_link: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates/{{application_template}}/components/{{component}}/connections/{{connection_id}}'
create_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates/{{application_template}}/components/{{component}}/connections?connectionId={{connection_id}}'
update_verb: 'PATCH'
update_mask: true
async:
  actions: []
description: |
  A connection between two components in an Application Design Center Application Template.
import_format:
  - 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applicationTemplates/{{application_template}}/components/{{component}}/connections/{{connection_id}}'
parameters:
  - type: String
    name: 'location'
    description: 'The location of the space.'
    required: true
    url_param_only: true
    immutable: true
  - type: String
    name: 'space'
    description: 'The ID of the space.'
    required: true
    url_param_only: true
    immutable: true
  - type: String
    name: 'application_template'
    description: 'The ID of the application template.'
    required: true
    url_param_only: true
    immutable: true
  - type: String
    name: 'component'
    description: 'The ID of the component.'
    required: true
    url_param_only: true
    immutable: true
  - type: String
    name: 'connection_id'
    description: 'The ID of the connection.'
    required: true
    url_param_only: true
    immutable: true
properties:
  - type: String
    name: 'name'
    description: 'Identifier. The resource name of the Connection. Format: projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/components/{component}/connections/{connection_id}'
    output: true
  - type: Time
    name: 'createTime'
    description: 'Output only. [Output only] Create time stamp.'
    output: true
  - type: Time
    name: 'updateTime'
    description: 'Output only. [Output only] Update time stamp.'
    output: true
  - type: String
    name: 'destinationComponentUri'
    description: 'Required. The component URI that the connection points to.'
    required: true
  - type: Array
    name: 'sourceComponentParameters'
    description: |
      Optional. Parameters associated with the source component. When unset, the
      API fills these in from the connected components.
    default_from_api: true
    item_type:
      type: NestedObject
      properties:
        - type: String
          name: 'key'
          description: 'The key of the parameter.'
          required: true
        - type: String
          name: 'value'
          description: 'The value of the parameter, as a JSON-encoded string. Use `jsonencode()` to set it.'
          send_empty_value: true
          state_func: 'func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }'
          custom_flatten: 'templates/terraform/custom_flatten/json_schema.tmpl'
          custom_expand: 'templates/terraform/custom_expand/json_value.tmpl'
          validation:
            function: 'validation.StringIsJSON'
  - type: Array
    name: 'destinationComponentParameters'
    description: |
      Optional. Parameters associated with the destination component. When unset,
      the API fills these in from the connected components.
    default_from_api: true
    item_type:
      type: NestedObject
      properties:
        - type: String
          name: 'key'
          description: 'The key of the parameter.'
          required: true
        - type: String
          name: 'value'
          description: 'The value of the parameter, as a JSON-encoded string. Use `jsonencode()` to set it.'
          send_empty_value: true
          state_func: 'func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }'
          custom_flatten: 'templates/terraform/custom_flatten/json_schema.tmpl'
          custom_expand: 'templates/terraform/custom_expand/json_value.tmpl'
          validation:
            function: 'validation.StringIsJSON'
  - type: String
    name: 'dependencyType'
    description: 'Output only. The dependency type of the connection.'
    output: true
samples:
  - name: designcenter_connection_basic
    primary_resource_id: example
    steps:
      - name: designcenter_connection_basic
        resource_id_vars:
          connection_id: example-connection
        vars:
          project: my-project-name
          space: my-space
          application_template: my-application-template
          component: my-source-component
          destination_component_uri: projects/my-project-name/locations/us-central1/spaces/my-space/applicationTemplates/my-application-template/components/my-dest-component
        test_vars_overrides:
          project: BootstrapDesignCenterProject(t)
          space: BootstrapDesignCenterSpace(t)
          application_template: BootstrapDesignCenterApplicationTemplate(t)
          component: BootstrapDesignCenterComponent(t)
          destination_component_uri: BootstrapDesignCenterDestinationComponentURI(t)
      - name: designcenter_connection_update
        resource_id_vars:
          connection_id: example-connection
        vars:
          project: my-project-name
          space: my-space
          application_template: my-application-template
          component: my-source-component
          destination_component_uri: projects/my-project-name/locations/us-central1/spaces/my-space/applicationTemplates/my-application-template/components/my-dest-component
        test_vars_overrides:
          project: BootstrapDesignCenterProject(t)
          space: BootstrapDesignCenterSpace(t)
          application_template: BootstrapDesignCenterApplicationTemplate(t)
          component: BootstrapDesignCenterComponent(t)
          destination_component_uri: BootstrapDesignCenterDestinationComponentURI(t)
