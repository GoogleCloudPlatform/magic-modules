---
name: 'CatalogTemplate'
base_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog}}/templates'
create_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog}}/templates?catalogTemplateId={{catalog_template_id}}'
self_link: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog}}/templates/{{catalog_template_id}}'
update_verb: 'PATCH'
update_mask: true
description: |
  A Design Center Catalog Template.
autogen_async: true
async:
  actions: ["delete"]
  operation:
    base_url: "{{op_id}}"
import_format:
  - 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog}}/templates/{{catalog_template_id}}'
properties:
  - type: String
    name: 'location'
    description: |
      The location of the catalog template.
    required: true
    immutable: true
    url_param_only: true

  - type: String
    name: 'space'
    description: |
      The space of the catalog template.
    required: true
    immutable: true
    url_param_only: true

  - type: String
    name: 'catalog'
    description: |
      The catalog of the catalog template.
    required: true
    immutable: true
    url_param_only: true

  - type: String
    name: 'catalog_template_id'
    description: |
      The ID of the catalog template.
    required: true
    immutable: true
    url_param_only: true

  - type: Enum
    name: 'templateCategory'
    description: |
      The category of the template.
    required: true
    enum_values:
      - 'APPLICATION_TEMPLATE'
      - 'COMPONENT_TEMPLATE'

  - type: String
    name: 'displayName'
    description: |
      The display name of the catalog template.

  - type: String
    name: 'description'
    description: |
      The description of the catalog template.

  - type: String
    name: 'type'
    description: |
      The type of the catalog template.

  - type: String
    name: 'name'
    description: |
      The resource name of the catalog template.
    output: true

  - type: String
    name: 'uuid'
    description: |
      The unique system-generated UUID for the template.
    output: true

  - type: String
    name: 'latestRevisionId'
    description: |
      The ID of the latest revision of the template.
    output: true

  - type: Time
    name: 'createTime'
    description: |
      The time the catalog template was created.
    output: true

  - type: Time
    name: 'updateTime'
    description: |
      The time the catalog template was last updated.
    output: true
samples:
  - name: designcenter_catalog_template_basic
    primary_resource_id: example
    steps:
      - name: designcenter_catalog_template_basic
        resource_id_vars:
          catalog_template_id: example-catalog-template
        vars:
          project: my-project-name
          space: example-space
          catalog: example-catalog
        test_vars_overrides:
          project: BootstrapDesignCenterProject(t)
          space: BootstrapDesignCenterSpace(t)
          catalog: BootstrapDesignCenterCatalog(t)
      - name: designcenter_catalog_template_update
        resource_id_vars:
          catalog_template_id: example-catalog-template
        vars:
          project: my-project-name
          space: example-space
          catalog: example-catalog
        test_vars_overrides:
          project: BootstrapDesignCenterProject(t)
          space: BootstrapDesignCenterSpace(t)
          catalog: BootstrapDesignCenterCatalog(t)
