---
name: 'Catalog'
base_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs'
create_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs?catalogId={{catalog_id}}'
self_link: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog_id}}'
update_verb: 'PATCH'
update_mask: true
autogen_async: true
async:
  actions: ["delete"]
  operation:
    base_url: "{{op_id}}"
description: |
  A Design Center Catalog.
import_format:
  - 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/catalogs/{{catalog_id}}'
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
parameters:
  - type: String
    name: 'location'
    description: |
      The location of the catalog.
    required: true
    immutable: true
    url_param_only: true
  - type: String
    name: 'space'
    description: |
      The space for the catalog.
    required: true
    immutable: true
    url_param_only: true
  - type: String
    name: 'catalog_id'
    description: |
      The ID of the catalog.
    required: true
    immutable: true
    url_param_only: true
properties:
  - type: String
    name: 'name'
    description: |
      Identifier. The name of the catalog. Format:
      `projects/{project}/locations/{location}/spaces/{space}/catalogs/{catalog}`
    output: true
  - type: String
    name: 'displayName'
    description: |
      Optional. The display name of the catalog.
  - type: String
    name: 'description'
    description: |
      Optional. The description of the catalog.
  - type: Time
    name: 'createTime'
    description: |
      Output only. [Output only] Create time stamp.
    output: true
  - type: Time
    name: 'updateTime'
    description: |
      Output only. [Output only] Update time stamp.
    output: true
