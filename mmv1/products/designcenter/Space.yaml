---
name: 'Space'
description: 'A Space in the Application Design Center.'
base_url: 'projects/{{project}}/locations/{{location}}/spaces'
self_link: 'projects/{{project}}/locations/{{location}}/spaces/{{space_id}}'
create_url: 'projects/{{project}}/locations/{{location}}/spaces?spaceId={{space_id}}'
update_verb: 'PATCH'
update_mask: true
import_format:
  - 'projects/{{project}}/locations/{{location}}/spaces/{{space_id}}'

iam_policy:
  method_name_separator: ':'
  parent: 'projects/{{project}}/locations/{{location}}/spaces/{{space_id}}'
  fetch_iam_policy_verb: 'GET'

parameters:
  - name: 'location'
    type: 'String'
    description: 'The location of the space.'
    required: true
    immutable: true
    url_param_only: true
  - name: 'space_id'
    type: 'String'
    description: 'The ID of the space.'
    required: true
    immutable: true
    url_param_only: true

properties:
  - name: 'displayName'
    type: 'String'
    description: 'The display name of the space.'
  - name: 'description'
    type: 'String'
    description: 'The description of the space.'
  - name: 'enableGcpSharedTemplates'
    type: 'Boolean'
    description: 'Whether to enable GCP shared templates.'
  - name: 'gcsBucket'
    type: 'String'
    description: 'The GCS bucket for the space.'
    default_from_api: true
  - name: 'tags'
    type: 'KeyValuePairs'
    description: 'Tags for the space.'
    immutable: true
    ignore_read: true
  - name: 'name'
    type: 'String'
    description: 'The resource name of the space.'
    output: true
  - name: 'createTime'
    type: 'Time'
    description: 'The time when the space was created.'
    output: true
  - name: 'updateTime'
    type: 'Time'
    description: 'The time when the space was last updated.'
    output: true
