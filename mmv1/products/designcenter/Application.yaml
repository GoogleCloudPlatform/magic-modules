---
name: 'Application'
base_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applications'
self_link: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applications/{{application_id}}'
create_url: 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applications?applicationId={{application_id}}'
update_verb: 'PATCH'
update_mask: true
description: |
  Application Design Center Application.
autogen_async: true
async:
  operation:
    path: 'name'
    base_url: '{{op_id}}'
    wait_ms: 1000
  result:
    path: 'response'
  status:
    path: 'done'
    complete: true
    allowed_value:
      - true
  error:
    path: 'error'
    message: 'message'
  actions:
    - 'delete'
import_format:
  - 'projects/{{project}}/locations/{{location}}/spaces/{{space}}/applications/{{application_id}}'
properties:
  - name: 'location'
    type: String
    required: true
    url_param_only: true
    description: |
      The location of the space.
  - name: 'space'
    type: String
    required: true
    url_param_only: true
    description: |
      The space for the application.
  - name: 'application_id'
    type: String
    required: true
    url_param_only: true
    description: |
      The ID of the application.
  - name: 'source'
    type: NestedObject
    required: true
    description: |
      DeploymentSource for the application.
    properties:
      - name: 'application_template_revision_uri'
        type: String
        description: |
          Application template revision URI.
  - name: 'scope'
    type: NestedObject
    required: true
    description: |
      AppHub Scope for the application.
    properties:
      - name: 'type'
        type: String
        description: |
          Scope type.
  - name: 'display_name'
    type: String
    description: |
      Display name.
  - name: 'description'
    type: String
    description: |
      Description of the application.
  - name: 'app_parameters'
    type: KeyValuePairs
    description: |
      Application parameters.
  - name: 'component_parameters'
    type: KeyValuePairs
    description: |
      Component parameters.
  - name: 'service_account'
    type: String
    description: |
      Service account for deployment.
  - name: 'attributes'
    type: KeyValuePairs
    description: |
      Attributes of the application.
  - name: 'deployment_region'
    type: String
    description: |
      Deployment region.
  - name: 'deployment_project'
    type: String
    description: |
      Deployment project.
  - name: 'connection_configs'
    type: Array
    description: |
      Connection configurations.
    item_type:
      type: NestedObject
      properties:
        - name: 'connection_id'
          type: String
          description: |
            Connection ID.
        - name: 'destination_uri'
          type: String
          description: |
            Destination URI.
  - name: 'deployment_target'
    type: String
    description: |
      Deployment target.
  - name: 'composite_application_parameters'
    type: KeyValuePairs
    description: |
      Composite application parameters.
  - name: 'roles_apis_config'
    type: NestedObject
    description: |
      Roles and APIs configuration.
    properties:
      - name: 'roles'
        type: Array
        description: |
          List of roles.
        item_type:
          type: String
      - name: 'apis'
        type: Array
        description: |
          List of APIs.
        item_type:
          type: String
  - name: 'name'
    type: String
    output: true
    description: |
      Name of the application.
  - name: 'state'
    type: String
    output: true
    description: |
      State of the application.
  - name: 'deployment_metadata'
    type: KeyValuePairs
    output: true
    description: |
      Deployment metadata.
  - name: 'apphub_application'
    type: String
    output: true
    description: |
      AppHub application URI.
  - name: 'create_time'
    type: Time
    output: true
    description: |
      Create time.
  - name: 'update_time'
    type: Time
    output: true
    description: |
      Update time.