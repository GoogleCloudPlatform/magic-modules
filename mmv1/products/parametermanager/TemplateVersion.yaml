---
name: TemplateVersion
description: |
  A Template Version resource that stores the actual content of the template.
references:
  guides:
    Parameter templates overview: https://cloud.google.com/secret-manager/parameter-manager/docs/parameter-templates-overview
  api: https://cloud.google.com/secret-manager/parameter-manager/docs/reference/rest/v1/projects.locations.templates.versions
docs:
min_version: beta
base_url: '{{template}}/versions'
self_link: '{{template}}/versions/{{template_version_id}}'
create_url: '{{template}}/versions?template_version_id={{template_version_id}}'
update_mask: true
update_verb: PATCH
import_format:
  - projects/{{%project}}/locations/global/templates/{{%template_id}}/versions/{{%template_version_id}}
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
exclude_identity_generation: true
custom_code:
  custom_import: templates/terraform/custom_import/parameter_manager_template_version.go.tmpl
samples:
  - name: template_version_basic
    primary_resource_id: template-version-basic
    min_version: beta
    steps:
      - name: template_version_basic
        resource_id_vars:
          template_id: template
          template_version_id: template_version
  - name: template_version_with_json_format
    primary_resource_id: template-version-with-json-format
    min_version: beta
    steps:
      - name: template_version_with_json_format
        resource_id_vars:
          template_id: template
          template_version_id: template_version
parameters:
  - name: template
    type: ResourceRef
    description: |
      Parameter Manager Template resource.
    url_param_only: true
    required: true
    immutable: true
    resource: Template
    imports: name
  - name: template_version_id
    type: String
    description: |
      Version ID of the Template Version Resource. This must be unique within the Template.
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: name
    type: String
    description: |
      The resource name of the Template Version. Format:
      `projects/{{project}}/locations/global/templates/{{template_id}}/versions/{{template_version_id}}`
    output: true
  - name: createTime
    type: String
    description: |
      The time at which the Template Version was created.
    output: true
  - name: updateTime
    type: String
    description: |
      The time at which the Template Version was updated.
    output: true
  - name: disabled
    type: Boolean
    send_empty_value: true
    description: |
      The current state of the Template Version. This field is only applicable for updating Template Version.
  - name: payload
    type: NestedObject
    description: |
      The payload content of the Template Version.
    required: true
    immutable: true
    custom_flatten: templates/terraform/custom_flatten/template_version_payload.go.tmpl
    properties:
      - name: templateData
        type: String
        description: |
          The Template data.
        api_name: data
        required: true
        immutable: true
        sensitive: true
        custom_expand: templates/terraform/custom_expand/base64.go.tmpl
