---
name: 'MemoryLayer'
description: |
  Enables and manages the memory layer for a Cloud Bigtable cluster.

  Creation of this resource enables the memory layer on the specified cluster (`ENTERPRISE_PLUS` and `SSD` storage type required). Destruction of this resource disables the memory layer on the cluster.
references:
  guides:
  api: 'https://cloud.google.com/bigtable/docs/reference/admin/rest/v2/MemoryLayer'
docs:
base_url: 'projects/{{project}}/instances/{{instance}}/clusters/{{cluster}}/memoryLayer'
self_link: 'projects/{{project}}/instances/{{instance}}/clusters/{{cluster}}/memoryLayer'
create_url: 'projects/{{project}}/instances/{{instance}}/clusters/{{cluster}}/memoryLayer?updateMask=memoryConfig'
create_verb: 'PATCH'
delete_url: 'projects/{{project}}/instances/{{instance}}/clusters/{{cluster}}/memoryLayer?updateMask=memoryConfig'
delete_verb: 'PATCH'
immutable: true
id_format: 'projects/{{project}}/instances/{{instance}}/clusters/{{cluster}}/memoryLayer'
import_format:
  - 'projects/{{project}}/instances/{{instance}}/clusters/{{cluster}}/memoryLayer'
timeouts:
  insert_minutes: 60
  delete_minutes: 60
async:
  type: 'OpAsync'
  operation:
    base_url: '{{op_id}}'
  actions: ['create', 'delete']
  result:
    resource_inside_response: true
autogen_async: true
exclude_sweeper: true
custom_code:
  encoder: 'templates/terraform/encoders/bigtable_memory_layer.go.tmpl'
  decoder: 'templates/terraform/decoders/bigtable_memory_layer.go.tmpl'
  pre_delete: 'templates/terraform/pre_delete/bigtable_memory_layer.go.tmpl'
  test_check_destroy: 'templates/terraform/custom_check_destroy/bigtable_memory_layer.go.tmpl'
samples:
  - name: 'bigtable_memory_layer'
    primary_resource_id: 'memory_layer'
    # bigtable instance does not use the shared HTTP client, this test creates an instance
    skip_vcr: true
    steps:
      - name: 'bigtable_memory_layer'
        resource_id_vars:
          instance_name: 'bt-instance'
          cluster_id: 'bt-cluster'
parameters:
  - name: 'instance'
    type: String
    description: |
      The name of the instance to enable the memory layer within.
    url_param_only: true
    required: true
    immutable: true
    diff_suppress_func: 'tpgresource.CompareResourceNames'
  - name: 'cluster'
    type: String
    description: |
      The ID of the cluster to enable the memory layer on.
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: 'name'
    type: String
    description: |
      The unique name of the memory layer. Values are of the form `projects/<project>/instances/<instance>/clusters/<cluster>/memoryLayer`.
    output: true
  - name: 'etag'
    type: String
    description: |
      System-generated token used by the server to ensure that the client has an up-to-date value before proceeding.
    output: true
  - name: 'state'
    type: String
    description: |
      The current state of the memory layer.
    output: true
  - name: 'memoryConfig'
    type: NestedObject
    description: |
      The memory configuration for the cluster.
    output: true
    properties:
      - name: 'storageSizeGib'
        type: Integer
        description: |
          Reporting the current size of the memory layer in GiB.
        output: true
