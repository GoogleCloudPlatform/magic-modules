---
name: AuthProvider
description: An AuthProvider resource in Agent Identity to manage cloud authentication delegation.
base_url: projects/{{project}}/locations/{{location}}/authProviders
self_link: projects/{{project}}/locations/{{location}}/authProviders/{{auth_provider_id}}
create_url: projects/{{project}}/locations/{{location}}/authProviders?authProviderId={{auth_provider_id}}
update_mask: true
update_verb: PATCH
import_format:
  - projects/{{project}}/locations/{{location}}/authProviders/{{auth_provider_id}}
custom_diff:
  - agentIdentityAuthProviderCustomizeDiff
custom_code:
  constants: "templates/terraform/constants/agent_identity_auth_provider.go.tmpl"
  post_read: "templates/terraform/post_read/agent_identity_auth_provider.go.tmpl"
  decoder: "templates/terraform/decoders/agent_identity_auth_provider.go.tmpl"
  post_create: "templates/terraform/post_create/sleep.go.tmpl"
  post_update: "templates/terraform/post_create/sleep.go.tmpl"
  post_delete: "templates/terraform/post_delete/sleep.go.tmpl"
  test_check_destroy: "templates/terraform/custom_check_destroy/agent_identity_auth_provider.go.tmpl"
iam_policy:
  method_name_separator: ':'
  allowed_iam_role: roles/agentidentity.viewer
  parent_resource_attribute: auth_provider_id
  import_format:
    - projects/{{project}}/locations/{{location}}/authProviders/{{auth_provider_id}}
    - '{{auth_provider_id}}'
parameters:
  - name: location
    type: String
    required: true
    description: Resource ID segment making up resource `name`. It identifies the resource within its parent collection as described in https://google.aip.dev/122.
    immutable: true
    url_param_only: true
  - name: authProviderId
    type: String
    required: true
    description: |-
      The ID to use for the AuthProvider, which will become the final segment
      of the AuthProvider's resource name.
      This value should be 1-63 characters, and valid characters
      are /a-z-/. The first character must be a lowercase letter, and the
      last character must be a lowercase letter or a number.
    immutable: true
    url_param_only: true
properties:
  - name: allowedScopes
    type: Array
    description: |-
      List of scopes that are allowed to be requested for this auth_provider.
      If this list is non-empty, only scopes within this list may be requested.
      If this list is empty, all scopes may be requested.
      Scopes appearing in `blocked_scopes` are disallowed even if they appear in
      `allowed_scopes`.
      The number of allowed scopes is limited to 200.
    item_type:
      type: String
  - name: authProviderTypeParams
    type: NestedObject
    required: true
    description: |-
      AuthProvider type specific parameters.
      Required when creating an auth_provider.
    properties:
      - name: apiKey
        type: NestedObject
        description: Message describing ApiKeyParams object.
        ignore_read: true
        exactly_one_of:
          - auth_provider_type_params.0.api_key
          - auth_provider_type_params.0.three_legged_oauth
          - auth_provider_type_params.0.two_legged_oauth
          - auth_provider_type_params.0.xaa_auth_provider
          - auth_provider_type_params.0.connector_reference_auth_provider
        properties:
          - name: apiKey
            type: String
            description: Input only. The API key for this auth_provider.
            sensitive: true
            ignore_read: true
      - name: connectorReferenceAuthProvider
        type: NestedObject
        description: Configuration parameters for the Connector Reference auth provider.
        exactly_one_of:
          - auth_provider_type_params.0.api_key
          - auth_provider_type_params.0.three_legged_oauth
          - auth_provider_type_params.0.two_legged_oauth
          - auth_provider_type_params.0.xaa_auth_provider
          - auth_provider_type_params.0.connector_reference_auth_provider
        properties:
          - name: connector
            type: String
            required: true
            description: The name of the referenced connector.
          - name: authorizationDetails
            type: String
            description: |-
              Optional. Rich Authorization Requests (RFC 9396) detailing targeted OAuth
              resources/scopes, formatted as a JSON array of JSON objects.
            state_func: func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }
            validation:
              function: validation.StringIsJSON
            custom_expand: templates/terraform/custom_expand/json_value.tmpl
            custom_flatten: templates/terraform/custom_flatten/json_schema.tmpl
      - name: geAuthProvider
        type: NestedObject
        send_empty_value: true
        allow_empty_object: true
        output: true
        description: |-
          Message describing GeminiEnterpriseAuthProviderParams object.
          Since GeminiEnterpriseAuthProviderParams currently takes no subfields, defining this empty block selects the ge_auth_provider type.
        properties: [] # Explicitly show no properties
      - name: threeLeggedOauth
        type: NestedObject
        description: Message describing ThreeLeggedOAuth object.
        exactly_one_of:
          - auth_provider_type_params.0.api_key
          - auth_provider_type_params.0.three_legged_oauth
          - auth_provider_type_params.0.two_legged_oauth
          - auth_provider_type_params.0.xaa_auth_provider
          - auth_provider_type_params.0.connector_reference_auth_provider
        properties:
          - name: authorizationUrl
            type: String
            description: |-
              The authorization endpoint to send users to for consenting to delegate
              to the agent.
              eg. "https://auth.atlassian.com/authorize"
          - name: clientId
            type: String
            description: The client ID of the OAuth client.
          - name: clientSecret
            type: String
            description: Input only. The client secret of the OAuth client.
            ignore_read: true
            write_only: true
          - name: defaultContinueUri
            type: String
            description: |-
              The default continue URI for 3LO flow and it will be used when no continue
              URI is provided in the RetrieveCredentials request.
          - name: enablePkce
            type: Boolean
            description: |-
              Enables Proof Key for Code Exchange (PKCE) for the OAuth flow to prevent
              authorization code interception attacks.
          - name: redirectUrl
            type: String
            description: |-
              The redirect URL this auth_provider uses for the OAuth exchange.
              This is deterministic based on the name of the auth_provider.
            output: true
          - name: tokenUrl
            type: String
            description: |-
              The token endpoint for requesting tokens on behalf of an end user.
              eg. "https://auth.atlassian.com/oauth/token"
      - name: twoLeggedOauth
        type: NestedObject
        description: Message describing TwoLeggedOAuth object.
        exactly_one_of:
          - auth_provider_type_params.0.api_key
          - auth_provider_type_params.0.three_legged_oauth
          - auth_provider_type_params.0.two_legged_oauth
          - auth_provider_type_params.0.xaa_auth_provider
          - auth_provider_type_params.0.connector_reference_auth_provider
        properties:
          - name: clientId
            type: String
            description: The client ID of the OAuth client.
          - name: clientSecret
            type: String
            description: Input only. The client secret of the OAuth client.
            ignore_read: true
            write_only: true
          - name: tokenUrl
            type: String
            description: The token endpoint of the OAuth client.
      - name: xaaAuthProvider
        type: NestedObject
        description: Configuration parameters for the Cross-App Access auth provider.
        exactly_one_of:
          - auth_provider_type_params.0.api_key
          - auth_provider_type_params.0.three_legged_oauth
          - auth_provider_type_params.0.two_legged_oauth
          - auth_provider_type_params.0.xaa_auth_provider
          - auth_provider_type_params.0.connector_reference_auth_provider
        properties:
          - name: additionalParameters
            type: KeyValuePairs
            description: Optional. Additional parameters to be passed to the token endpoint.
          - name: clientAssertionJwtAuth
            type: NestedObject
            description: |-
              Option 2: Authenticate using a standard `client_id` and a Client Assertion JWT.
            conflicts:
              - auth_provider_type_params.0.xaa_auth_provider.0.client_secret_auth
            properties:
              - name: clientId
                type: String
                required: true
                description: The client identifier.
          - name: clientSecretAuth
            type: NestedObject
            description: |-
              Option 1: Authenticate using a standard `client_id` and `client_secret`.
            conflicts:
              - auth_provider_type_params.0.xaa_auth_provider.0.client_assertion_jwt_auth
            properties:
              - name: clientId
                type: String
                required: true
                description: The client identifier.
              - name: clientSecret
                type: String
                required: true
                sensitive: true
                ignore_read: true
                description: Input only. The client secret.
          - name: customIssuer
            type: NestedObject
            description: |-
              Configuration when using a custom or third-party authorization server as the issuer.
            exactly_one_of:
              - auth_provider_type_params.0.xaa_auth_provider.0.google_account
              - auth_provider_type_params.0.xaa_auth_provider.0.workforce_identity_federation
              - auth_provider_type_params.0.xaa_auth_provider.0.custom_issuer
            properties:
              - name: issuer
                type: String
                description: Optional. The issuer identifier of the target Authorization Server.
              - name: tokenUrl
                type: String
                required: true
                description: |-
                  Required. The token endpoint of the target OAuth authorization server to
                  retrieve resource tokens.
          - name: googleAccount
            type: NestedObject
            send_empty_value: true
            allow_empty_object: true
            description: Configuration when using Google Accounts as the issuer.
            exactly_one_of:
              - auth_provider_type_params.0.xaa_auth_provider.0.google_account
              - auth_provider_type_params.0.xaa_auth_provider.0.workforce_identity_federation
              - auth_provider_type_params.0.xaa_auth_provider.0.custom_issuer
            properties: []
          - name: idJagInput
            type: NestedObject
            send_empty_value: true
            allow_empty_object: true
            description: Configuration for when the input is already an ID-JAG.
            exactly_one_of:
              - auth_provider_type_params.0.xaa_auth_provider.0.id_token_input
              - auth_provider_type_params.0.xaa_auth_provider.0.id_jag_input
            properties: []
          - name: idTokenInput
            type: NestedObject
            description: Configuration for when the input is an ID token.
            exactly_one_of:
              - auth_provider_type_params.0.xaa_auth_provider.0.id_token_input
              - auth_provider_type_params.0.xaa_auth_provider.0.id_jag_input
            properties:
              - name: agentIdentityPool
                type: NestedObject
                send_empty_value: true
                allow_empty_object: true
                description: |-
                  Indicates the managed Agent Identity pool should be used to fetch the ID-JAG.
                exactly_one_of:
                  - auth_provider_type_params.0.xaa_auth_provider.0.id_token_input.0.id_jag_auth_provider
                  - auth_provider_type_params.0.xaa_auth_provider.0.id_token_input.0.agent_identity_pool
                properties: []
              - name: idJagAdditionalClaims
                type: String
                description: Optional additional claims to include when fetching an ID-JAG.
                state_func: func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }
                validation:
                  function: validation.StringIsJSON
                custom_expand: templates/terraform/custom_expand/json_schema.tmpl
                custom_flatten: templates/terraform/custom_flatten/json_schema.tmpl
              - name: idJagAuthProvider
                type: String
                description: |-
                  The resource name of the ID-JAG auth provider.
                  Format: `projects/{project}/locations/{location}/authProviders/{auth_provider}`
                exactly_one_of:
                  - auth_provider_type_params.0.xaa_auth_provider.0.id_token_input.0.id_jag_auth_provider
                  - auth_provider_type_params.0.xaa_auth_provider.0.id_token_input.0.agent_identity_pool
          - name: workforceIdentityFederation
            type: NestedObject
            send_empty_value: true
            allow_empty_object: true
            description: Configuration when using Workforce Identity Federation as the issuer.
            exactly_one_of:
              - auth_provider_type_params.0.xaa_auth_provider.0.google_account
              - auth_provider_type_params.0.xaa_auth_provider.0.workforce_identity_federation
              - auth_provider_type_params.0.xaa_auth_provider.0.custom_issuer
            properties: []
  - name: blockedScopes
    type: Array
    description: |-
      List of scopes that are blocked from being requested for this
      auth_provider. If a scope appears in this list, it will not be requested,
      even if it also appears in `allowed_scopes`. `blocked_scopes` takes
      precedence over `allowed_scopes`. The number of blocked scopes is limited
      to 200.
    item_type:
      type: String
  - name: createTime
    type: String
    description: "[Output only] Create time stamp"
    output: true
  - name: deleted
    type: Boolean
    description: This is set to true if the auth_provider is deleted.
    output: true
  - name: description
    type: String
    description: |-
      Description of the resource.
      Must be less than 256 characters.
  - name: expireTime
    type: String
    description: The time when the auth_provider will expire.
    output: true
  - name: labels
    type: KeyValueLabels
    description: Labels as key value pairs
  - name: name
    type: String
    description: |-
      Identifier. The full resource name of the auth_provider. Format:
      projects/{project}/locations/{location}/authProviders/{auth_provider}
    output: true
  - name: state
    type: String
    description: |-
      The state of the auth_provider.
      Possible values:
      ENABLED
      DISABLED
    output: true
  - name: updateTime
    type: String
    description: "[Output only] Update time stamp"
    output: true
  - name: workloadIds
    type: Array
    description: |-
      Input only. Represents the workload identity in IAM `principal://` format of the
      agent(s) that will use this AuthProvider. Example:
      `principal://agents.global.org-${ORG_ID}.system.id.goog/resources/aiplatform/projects/{PROJECT_ID}/locations/{LOCATIONS}/reasoningEngines/{ID}`
    item_type:
      type: String
    ignore_read: true
samples:
  - name: "agent_identity_auth_provider_basic"
    primary_resource_id: "default"
    steps:
      - name: "agent_identity_auth_provider_basic"
        resource_id_vars:
          auth_provider_id: "example-provider"
        ignore_read_extra:
          - "auth_provider_type_params"
