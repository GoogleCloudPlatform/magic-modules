---
name: 'SecurityProfile'
description: |
  A security profile defines the behavior associated to a profile type.
references:
  guides:
    'Create and manage security profiles': 'https://cloud.google.com/firewall/docs/configure-security-profiles'
  api: 'https://cloud.google.com/firewall/docs/reference/network-security/rest/v1/organizations.locations.securityProfiles'
docs:
base_url: '{{parent}}/locations/{{location}}/securityProfiles'
self_link: '{{parent}}/locations/{{location}}/securityProfiles/{{name}}'
create_url: '{{parent}}/locations/{{location}}/securityProfiles?securityProfileId={{name}}'
update_verb: 'PATCH'
update_mask: true
import_format:
  - '{{%parent}}/locations/{{location}}/securityProfiles/{{name}}'
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
async:
  actions: ['create', 'delete', 'update']
  type: 'OpAsync'
  operation:
    base_url: '{{op_id}}'
  result:
    resource_inside_response: false
  include_project: true
custom_code:
include_in_tgc_next: true
sweeper:
  url_substitutions:
    - parent: "organizations/${ORG_ID}"
      region: "global"
samples:
  - name: 'network_security_security_profile_basic'
    primary_resource_id: 'default'
    steps:
      - name: 'network_security_security_profile_basic'
        resource_id_vars:
          resource_name: 'my-security-profile'
        test_env_vars:
          org_id: 'ORG_ID'
  - name: 'network_security_security_profile_overrides'
    primary_resource_id: 'default'
    steps:
      - name: 'network_security_security_profile_overrides'
        resource_id_vars:
          resource_name: 'my-security-profile'
        test_env_vars:
          org_id: 'ORG_ID'
  - name: 'network_security_security_profile_mirroring'
    primary_resource_id: 'default'
    steps:
      - name: 'network_security_security_profile_mirroring'
        resource_id_vars:
          resource_name: 'my-security-profile'
          network_name: 'my-network'
          deployment_group_id: 'my-dg'
          endpoint_group_id: 'my-eg'
        test_env_vars:
          org_id: 'ORG_ID'
  - name: 'network_security_security_profile_intercept'
    min_version: 'beta'
    primary_resource_id: 'default'
    steps:
      - name: 'network_security_security_profile_intercept'
        min_version: 'beta'
        resource_id_vars:
          resource_name: 'my-security-profile'
          network_name: 'my-network'
          deployment_group_id: 'my-dg'
          endpoint_group_id: 'my-eg'
        test_env_vars:
          org_id: 'ORG_ID'
  - name: 'network_security_security_profile_url_filtering'
    primary_resource_id: 'default'
    tgc_skip_test: The ENUM value URL_FILTERING in type field is transformed to UNKNOWN_ENUM_VALUE_ProfileType_5 in CAI asset. The reason could be that URL_FILTERING is not supported in CAI yet. Will check if the value in CAI assets will be correct later.
    steps:
      - name: 'network_security_security_profile_url_filtering'
        resource_id_vars:
          resource_name: 'my-security-profile'
        test_env_vars:
          org_id: 'ORG_ID'
  - name: network_security_security_profile_broker
    primary_resource_id: 'default'
    steps:
      - name: network_security_security_profile_broker
        resource_id_vars:
          resource_name: 'my-security-profile'
          network_name: 'my-network'
          deployment_group_id: 'my-dg'
          endpoint_group_id: 'my-eg'
        test_env_vars:
          org_id: 'ORG_ID'
  - name: 'network_security_security_profile_wildfire'
    min_version: 'beta'
    primary_resource_id: 'default'
    tgc_skip_test: The ENUM value WILDFIRE_ANALYSIS in type field is not supported in CAI yet.
    steps:
      - name: 'network_security_security_profile_wildfire'
        min_version: 'beta'
        resource_id_vars:
          resource_name: 'my-security-profile'
        test_env_vars:
          project: 'PROJECT_NAME'
      - name: 'network_security_security_profile_wildfire_update'
        min_version: 'beta'
        resource_id_vars:
          resource_name: 'my-security-profile'
        test_env_vars:
          project: 'PROJECT_NAME'
parameters:
  - name: 'name'
    type: String
    description: |
      The name of the security profile resource.
    url_param_only: true
    required: true
    immutable: true
  - name: 'location'
    type: String
    description: |
      The location of the security profile.
      The default value is `global`.
    url_param_only: true
    immutable: true
    default_value: "global"
  - name: 'parent'
    type: String
    description: |
      The name of the parent this security profile belongs to.
      Format: `organizations/{organization_id}` or `projects/{project_id}`.
    url_param_only: true
    immutable: true
properties:
  - name: 'selfLink'
    type: String
    description: |
      Server-defined URL of this resource.
    output: true
  - name: 'createTime'
    type: Time
    description: Time the security profile was created in UTC.
    output: true
  - name: 'updateTime'
    type: Time
    description: Time the security profile was updated in UTC.
    output: true
  - name: 'etag'
    type: String
    description: |
      This checksum is computed by the server based on the value of other fields,
      and may be sent on update and delete requests to ensure the client has an up-to-date
      value before proceeding.
    output: true
  - name: 'description'
    type: String
    description: |
      An optional description of the security profile. The Max length is 512 characters.
  - name: 'labels'
    type: KeyValueLabels
    description: |
      A map of key/value label pairs to assign to the resource.
  - name: 'threatPreventionProfile'
    type: NestedObject
    description: The threat prevention configuration for the security profile.
    properties:
      - name: 'severityOverrides'
        type: Array
        is_set: true
        description: The configuration for overriding threats actions by severity match.
        item_type:
          type: NestedObject
          properties:
            - name: 'action'
              type: Enum
              description: Threat action override.
              required: true
              enum_values:
                - 'ALERT'
                - 'ALLOW'
                - 'DEFAULT_ACTION'
                - 'DENY'
            - name: 'severity'
              type: Enum
              description: Severity level to match.
              required: true
              enum_values:
                - 'CRITICAL'
                - 'HIGH'
                - 'INFORMATIONAL'
                - 'LOW'
                - 'MEDIUM'
      - name: 'threatOverrides'
        type: Array
        is_set: true
        description: |
          The configuration for overriding threats actions by threat id match.
          If a threat is matched both by configuration provided in severity overrides
          and threat overrides, the threat overrides action is applied.
        item_type:
          type: NestedObject
          properties:
            - name: 'action'
              type: Enum
              description: Threat action.
              required: true
              enum_values:
                - 'ALERT'
                - 'ALLOW'
                - 'DEFAULT_ACTION'
                - 'DENY'
            - name: 'threatId'
              type: String
              description: Vendor-specific ID of a threat to override.
              required: true
            - name: 'type'
              type: Enum
              description: Type of threat.
              output: true
              enum_values:
                - 'ANTIVIRUS'
                - 'DNS'
                - 'UNKNOWN'
                - 'VULNERABILITY'
                - 'SPYWARE'
      - name: 'antivirusOverrides'
        type: Array
        is_set: true
        description: |
          Defines what action to take for antivirus threats per protocol.
        item_type:
          type: NestedObject
          properties:
            - name: 'protocol'
              type: Enum
              description: Required protocol to match.
              required: true
              enum_values:
                - 'SMTP'
                - 'SMB'
                - 'POP3'
                - 'IMAP'
                - 'HTTP2'
                - 'HTTP'
                - 'FTP'
            - name: 'action'
              type: Enum
              description: Threat action override. For some threat types, only a subset of actions applies.
              required: true
              enum_values:
                - 'ALERT'
                - 'ALLOW'
                - 'DEFAULT_ACTION'
                - 'DENY'
    conflicts:
      - 'urlFilteringProfile'
      - 'customMirroringProfile'
      - 'customInterceptProfile'
      - 'wildfireAnalysisProfile'
  - name: 'urlFilteringProfile'
    type: NestedObject
    is_missing_in_cai: true
    description: The url filtering configuration for the security profile.
    custom_flatten: 'templates/terraform/custom_flatten/network_security_security_profile_url_filters_flatten.go.tmpl'
    properties:
      - name: 'urlFilters'
        type: Array
        is_set: true
        description: |
          The configuration for action to take based on domain name match.
          A domain name would be checked for matching filters through the list in order of highest to lowest priority,
          and the first filter that a domain name matches with is the one whose actions gets applied.
        item_type:
          type: NestedObject
          properties:
            - name: 'filteringAction'
              type: Enum
              description: The action to take when the filter is applied.
              required: true
              enum_values:
                - 'ALLOW'
                - 'DENY'
            - name: 'urls'
              type: Array
              description: |
                A list of domain matcher strings that a domain name gets compared with to determine if the filter is applicable.
                A domain name must match with at least one of the strings in the list for a filter to be applicable.
              item_type:
                type: String
            - name: 'priority'
              type: Integer
              description: |
                The priority of the filter within the URL filtering profile.
                Must be an integer from 0 and 2147483647, inclusive. Lower integers indicate higher priorities.
                The priority of a filter must be unique within a URL filtering profile.
              required: true
    conflicts:
      - 'threatPreventionProfile'
      - 'customMirroringProfile'
      - 'customInterceptProfile'
      - 'wildfireAnalysisProfile'
  - name: 'customMirroringProfile'
    type: NestedObject
    description: |
      The configuration for defining the Mirroring Endpoint Group used to
      mirror traffic to third-party collectors.
    properties:
      - name: mirroringEndpointGroup
        type: String
        description: |
          The target Mirroring Endpoint Group.
          When a mirroring rule with this security profile attached matches a packet,
          a replica will be mirrored to the location-local target in this group.
          Format: projects/{project_id}/locations/global/mirroringEndpointGroups/{endpoint_group_id}
        required: true
      - name: mirroringDeploymentGroups
        type: Array
        is_missing_in_cai: true
        item_type:
          type: String
        description: |
          The target downstream Mirroring Deployment Groups.
          This field is used for Packet Broker mirroring endpoint groups to specify
          the deployment groups that the packet should be mirrored to by the broker.
          Format: projects/{project_id}/locations/global/mirroringDeploymentGroups/{deployment_group_id}
      - name: 'mirroringEndpointGroupType'
        type: String
        description: |-
          The type of the mirroring endpoint group this profile is attached to.
          Possible values:
          DIRECT
          BROKER
        output: true
    conflicts:
      - 'threatPreventionProfile'
      - 'urlFilteringProfile'
      - 'customInterceptProfile'
      - 'wildfireAnalysisProfile'
  - name: 'customInterceptProfile'
    type: NestedObject
    description: |
      The configuration for defining the Intercept Endpoint Group used to
      intercept traffic to third-party firewall appliances.
    properties:
      - name: interceptEndpointGroup
        type: String
        description: |
          The Intercept Endpoint Group to which matching traffic should be intercepted.
          Format: projects/{project_id}/locations/global/interceptEndpointGroups/{endpoint_group_id}
        required: true
    conflicts:
      - 'threatPreventionProfile'
      - 'urlFilteringProfile'
      - 'customMirroringProfile'
      - 'wildfireAnalysisProfile'
  - name: 'wildfireAnalysisProfile'
    type: NestedObject
    min_version: 'beta'
    is_missing_in_cai: true
    description: |
      The wildfire analysis configuration for the security profile.
    conflicts:
      - 'threatPreventionProfile'
      - 'urlFilteringProfile'
      - 'customMirroringProfile'
      - 'customInterceptProfile'
    properties:
      - name: 'wildfireRealtimeLookup'
        type: Boolean
        min_version: 'beta'
        send_empty_value: true
        description: |
          Enables verdict lookup in real-time before advancing to inline-ml or cloud analysis.
      - name: 'wildfireSubmissionRules'
        type: Array
        min_version: 'beta'
        send_empty_value: true
        description: |
          The configuration for file submission to WildFire in cloud.
        item_type:
          type: NestedObject
          properties:
            - name: 'fileSelectionMode'
              type: Enum
              min_version: 'beta'
              required: true
              description: |
                Defines the file selection mode for a rule.
              enum_values:
                - 'ALL_FILE_TYPES'
                - 'CUSTOM_FILE_TYPES'
            - name: 'customFileTypes'
              type: NestedObject
              min_version: 'beta'
              description: |
                Defines the custom file types to match for a rule.
              properties:
                - name: 'fileTypes'
                  type: Array
                  min_version: 'beta'
                  is_set: true
                  required: true
                  description: |
                    The file types to match for a rule.
                  item_type:
                    type: Enum
                    enum_values:
                      - 'APK'
                      - 'ARCHIVE'
                      - 'EMAIL_LINK'
                      - 'FLASH'
                      - 'JAR'
                      - 'LINUX'
                      - 'MS_OFFICE'
                      - 'PDF'
                      - 'PE'
                      - 'SCRIPT'
            - name: 'direction'
              type: Enum
              min_version: 'beta'
              required: true
              description: |
                Direction of traffic to match for a rule.
              enum_values:
                - 'UPLOAD'
                - 'DOWNLOAD'
                - 'BOTH'
      - name: 'wildfireInlineCloudAnalysisRules'
        type: Array
        min_version: 'beta'
        send_empty_value: true
        description: |
          The configuration for inline cloud analysis of files.
        item_type:
          type: NestedObject
          properties:
            - name: 'fileSelectionMode'
              type: Enum
              min_version: 'beta'
              required: true
              description: |
                Defines the file selection mode for a rule.
              enum_values:
                - 'ALL_FILE_TYPES'
                - 'CUSTOM_FILE_TYPES'
            - name: 'customFileTypes'
              type: NestedObject
              min_version: 'beta'
              description: |
                Defines the custom file types to match for a rule.
              properties:
                - name: 'fileTypes'
                  type: Array
                  min_version: 'beta'
                  is_set: true
                  required: true
                  description: |
                    The file types to match for a rule.
                  item_type:
                    type: Enum
                    enum_values:
                      - 'PE'
            - name: 'direction'
              type: Enum
              min_version: 'beta'
              required: true
              description: |
                Direction of traffic to match for a rule.
              enum_values:
                - 'UPLOAD'
                - 'DOWNLOAD'
                - 'BOTH'
            - name: 'action'
              type: Enum
              min_version: 'beta'
              required: true
              description: |
                The action to take when a rule is matched.
              enum_values:
                - 'ALLOW'
                - 'DENY'
                - 'ALERT'
      - name: 'wildfireOverrides'
        type: Array
        min_version: 'beta'
        is_set: true
        send_empty_value: true
        description: |
          Defines what action to take for WildFire threats per protocol.
        item_type:
          type: NestedObject
          properties:
            - name: 'protocol'
              type: Enum
              min_version: 'beta'
              required: true
              description: |
                Required protocol to match.
              enum_values:
                - 'WILDFIRE_SMTP'
                - 'WILDFIRE_SMB'
                - 'WILDFIRE_POP3'
                - 'WILDFIRE_IMAP'
                - 'WILDFIRE_HTTP2'
                - 'WILDFIRE_HTTP'
                - 'WILDFIRE_FTP'
            - name: 'action'
              type: Enum
              min_version: 'beta'
              required: true
              description: |
                Threat action override.
              enum_values:
                - 'WILDFIRE_DEFAULT_ACTION'
                - 'WILDFIRE_ALLOW'
                - 'WILDFIRE_ALERT'
                - 'WILDFIRE_DENY'
      - name: 'wildfireInlineMlOverrides'
        type: Array
        min_version: 'beta'
        is_set: true
        send_empty_value: true
        description: |
          Defines what action to take for WildFire inline ML threats per protocol.
        item_type:
          type: NestedObject
          properties:
            - name: 'protocol'
              type: Enum
              min_version: 'beta'
              required: true
              description: |
                Required protocol to match.
              enum_values:
                - 'WILDFIRE_SMTP'
                - 'WILDFIRE_SMB'
                - 'WILDFIRE_POP3'
                - 'WILDFIRE_IMAP'
                - 'WILDFIRE_HTTP2'
                - 'WILDFIRE_HTTP'
                - 'WILDFIRE_FTP'
            - name: 'action'
              type: Enum
              min_version: 'beta'
              required: true
              description: |
                Threat action override.
              enum_values:
                - 'WILDFIRE_DEFAULT_ACTION'
                - 'WILDFIRE_ALLOW'
                - 'WILDFIRE_ALERT'
                - 'WILDFIRE_DENY'
      - name: 'wildfireThreatOverrides'
        type: Array
        min_version: 'beta'
        is_set: true
        send_empty_value: true
        description: |
          The configuration for overriding threats actions by threat id match.
        item_type:
          type: NestedObject
          properties:
            - name: 'threatId'
              type: String
              min_version: 'beta'
              required: true
              description: |
                Vendor-specific ID of a threat to override.
            - name: 'action'
              type: Enum
              min_version: 'beta'
              required: true
              description: |
                Threat action override.
              enum_values:
                - 'WILDFIRE_DEFAULT_ACTION'
                - 'WILDFIRE_ALLOW'
                - 'WILDFIRE_ALERT'
                - 'WILDFIRE_DENY'
      - name: 'wildfireInlineMlSetting'
        type: NestedObject
        min_version: 'beta'
        description: |
          WildFire inline Machine Learning setting for the Security Profile.
        properties:
          - name: 'inlineMlConfigs'
            type: Array
            min_version: 'beta'
            is_set: true
            send_empty_value: true
            description: |
              Defines what action to take for a specific file type in WildFire inline ML.
            item_type:
              type: NestedObject
              properties:
                - name: 'fileType'
                  type: Enum
                  min_version: 'beta'
                  required: true
                  description: |
                    The file type to match.
                  enum_values:
                    - 'WINDOWS_EXECUTABLE'
                    - 'POWERSHELL_SCRIPT1'
                    - 'POWERSHELL_SCRIPT2'
                    - 'ELF'
                    - 'MS_OFFICE'
                    - 'SHELL'
                    - 'OOXML'
                    - 'MACHO'
                - name: 'action'
                  type: Enum
                  min_version: 'beta'
                  required: true
                  description: |
                    The action to take for a file type.
                  enum_values:
                    - 'DISABLE'
                    - 'ALERT'
                    - 'ENABLE'
          - name: 'fileExceptions'
            type: Array
            min_version: 'beta'
            send_empty_value: true
            description: |
              File exceptions to exclude from WildFire inline ML.
            item_type:
              type: NestedObject
              properties:
                - name: 'partialHash'
                  type: String
                  min_version: 'beta'
                  required: true
                  description: |
                    The partial SHA256 hash of the file to exclude.
                - name: 'filename'
                  type: String
                  min_version: 'beta'
                  description: |
                    The file name associated with the partial hash.
  - name: 'type'
    type: Enum
    description: The type of security profile.
    required: true
    immutable: true
    enum_values:
      - 'THREAT_PREVENTION'
      - 'URL_FILTERING'
      - 'CUSTOM_MIRRORING'
      - 'CUSTOM_INTERCEPT'
      - 'WILDFIRE_ANALYSIS'
