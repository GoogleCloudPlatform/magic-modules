---
name: 'NotebookExecution'
api_resource_type_kind: NotebookExecutionJob
description: |
  'An instance of a notebook Execution'
references:
  guides:
    'Schedule a notebook run': 'https://cloud.google.com/colab/docs/schedule-notebook-run'
  api: 'https://cloud.google.com/vertex-ai/docs/reference/rest/v1/projects.locations.notebookExecutionJobs'
base_url: 'projects/{{project}}/locations/{{location}}/notebookExecutionJobs'
self_link: 'projects/{{project}}/locations/{{location}}/notebookExecutionJobs/{{notebook_execution_job_id}}'
immutable: true
create_url: 'projects/{{project}}/locations/{{location}}/notebookExecutionJobs?notebook_execution_job_id={{notebook_execution_job_id}}'
timeouts:
  insert_minutes: 60
  update_minutes: 20
  delete_minutes: 20
async:
  type: 'OpAsync'
  operation:
import_format:
  - 'projects/{{project}}/locations/{{location}}/notebookExecutionJobs/{{notebook_execution_job_id}}'
include_in_tgc_next: true
custom_code:
  post_create: 'templates/terraform/post_create/colab_notebook_execution.go.tmpl'
samples:
  - name: 'colab_notebook_execution_basic'
    primary_resource_id: 'notebook-execution'
    steps:
      - name: 'colab_notebook_execution_basic'
        resource_id_vars:
          runtime_template_name: 'runtime-template-name'
          bucket: 'my_bucket'
        test_env_vars:
          project_id: 'PROJECT_NAME'
          service_account: 'SERVICE_ACCT'
        ignore_read_extra:
          - direct_notebook_source.0.content
  - name: 'colab_notebook_execution_custom_env'
    primary_resource_id: 'notebook-execution'
    steps:
      - name: 'colab_notebook_execution_custom_env'
        resource_id_vars:
          network_name: 'colab-test-default'
          bucket: 'my_bucket'
        test_env_vars:
          project_id: 'PROJECT_NAME'
          service_account: 'SERVICE_ACCT'
        ignore_read_extra:
          - direct_notebook_source.0.content
  - name: 'colab_notebook_execution_workbench_runtime'
    primary_resource_id: 'notebook-execution'
    steps:
      - name: 'colab_notebook_execution_workbench_runtime'
        resource_id_vars:
          bucket: 'my_bucket'
        test_env_vars:
          project_id: 'PROJECT_NAME'
          service_account: 'SERVICE_ACCT'
        ignore_read_extra:
          - direct_notebook_source.0.content
  - name: 'colab_notebook_execution_workbench_runtime_vm'
    primary_resource_id: 'notebook-execution'
    steps:
      - name: 'colab_notebook_execution_workbench_runtime_vm'
        resource_id_vars:
          bucket: 'my_bucket'
        test_env_vars:
          project_id: 'PROJECT_NAME'
          service_account: 'SERVICE_ACCT'
        ignore_read_extra:
          - direct_notebook_source.0.content
  - name: 'colab_notebook_execution_workbench_runtime_vm_name'
    primary_resource_id: 'notebook-execution'
    steps:
      - name: 'colab_notebook_execution_workbench_runtime_vm_name'
        resource_id_vars:
          bucket: 'my_bucket'
        test_env_vars:
          project_id: 'PROJECT_NAME'
          service_account: 'SERVICE_ACCT'
        ignore_read_extra:
          - direct_notebook_source.0.content
  - name: 'colab_notebook_execution_full'
    min_version: beta
    primary_resource_id: 'notebook-execution'
    steps:
      - name: 'colab_notebook_execution_full'
        min_version: beta
        resource_id_vars:
          notebook_execution_job_id: 'colab-notebook-execution'
          runtime_template_name: 'runtime-template-name'
          bucket: 'my_bucket'
        test_env_vars:
          project_id: 'PROJECT_NAME'
          service_account: 'SERVICE_ACCT'
  - name: 'colab_notebook_execution_dataform'
    min_version: beta
    primary_resource_id: 'notebook-execution'
    bootstrap_iam:
      - member: "serviceAccount:service-{project_number}@gcp-sa-dataform.iam.gserviceaccount.com"
        role: "roles/cloudkms.cryptoKeyEncrypterDecrypter"
    steps:
      - name: 'colab_notebook_execution_dataform'
        min_version: beta
        resource_id_vars:
          secret: 'secret'
          dataform_repository: 'dataform-repository'
          runtime_template_name: 'runtime-template-name'
          bucket: 'my_bucket'
          key_name: 'my-crypto-key'
        test_env_vars:
          project_id: 'PROJECT_NAME'
          service_account: 'SERVICE_ACCT'
        test_vars_overrides:
          key_name: 'kms.BootstrapKMSKeyInLocation(t, "us-central1").CryptoKey.Name'
          # for backward compatible
          secret: '"secret" + randomSuffix'
parameters:
  - name: 'location'
    type: String
    required: true
    url_param_only: true
    description: 'The location for the resource: https://cloud.google.com/colab/docs/locations'
  - name: 'notebookExecutionJobId'
    type: String
    url_param_only: true
    description: 'User specified ID for the Notebook Execution Job'
    custom_flatten: 'templates/terraform/custom_flatten/name_from_self_link.tmpl'
    default_from_api: true
properties:
  - name: 'displayName'
    type: String
    description: Required. The display name of the Notebook Execution.
    required: true
  - name: 'dataformRepositorySource'
    type: NestedObject
    description: 'The Dataform Repository containing the input notebook.'
    exactly_one_of:
      - dataform_repository_source
      - gcs_notebook_source
      - direct_notebook_source
    properties:
      - name: 'dataformRepositoryResourceName'
        type: String
        required: true
        description: 'The resource name of the Dataform Repository.'
        diff_suppress_func: 'tpgresource.CompareSelfLinkRelativePaths'
      - name: 'commitSha'
        type: String
        description: 'The commit SHA to read repository with. If unset, the file will be read at HEAD.'
  - name: 'gcsNotebookSource'
    type: NestedObject
    description: 'The Cloud Storage uri for the input notebook.'
    exactly_one_of:
      - dataform_repository_source
      - gcs_notebook_source
      - direct_notebook_source
    properties:
      - name: 'uri'
        type: String
        description: 'The Cloud Storage uri pointing to the ipynb file.'
        required: true
      - name: 'generation'
        type: String
        description: 'The version of the Cloud Storage object to read. If unset, the current version of the object is read. See https://cloud.google.com/storage/docs/metadata#generation-number.'
  - name: 'directNotebookSource'
    type: NestedObject
    description: 'The content of the input notebook in ipynb format.'
    ignore_read: true
    exactly_one_of:
      - dataform_repository_source
      - gcs_notebook_source
      - direct_notebook_source
    properties:
      - name: 'content'
        type: String
        required: true
        description: 'The base64-encoded contents of the input notebook file.'
        custom_flatten: 'templates/terraform/custom_flatten/colab_notebook_execution_direct_content.go.tmpl'
        tgc_ignore_terraform_custom_flatten: true
  - name: executionTimeout
    type: String
    description: 'Max running time of the execution job in seconds (default 86400s / 24 hrs).'
  - name: 'notebookRuntimeTemplateResourceName'
    type: String
    description: 'The NotebookRuntimeTemplate to source compute configuration from.'
    exactly_one_of:
      - notebook_runtime_template_resource_name
      - custom_environment_spec
  - name: customEnvironmentSpec
    type: NestedObject
    description: Compute configuration to use for an execution job
    exactly_one_of:
      - notebook_runtime_template_resource_name
      - custom_environment_spec
    properties:
      - name: machineSpec
        type: NestedObject
        description: |
          'The machine configuration of the runtime.'
        properties:
          - name: 'machineType'
            type: String
            description: |
              The Compute Engine machine type selected for the runtime.
          - name: 'acceleratorType'
            type: String
            description: |
              The type of hardware accelerator used by the runtime. If specified, acceleratorCount must also be specified.
          - name: 'acceleratorCount'
            type: Integer
            description: 'The number of accelerators used by the runtime.'
      - name: persistentDiskSpec
        type: NestedObject
        description: 'The configuration for the data disk of the runtime.'
        properties:
          - name: 'diskType'
            type: String
            description: 'The type of the persistent disk.'
          - name: 'diskSizeGb'
            type: String # Integer
            description: |
              The disk size of the runtime in GB. If specified, the diskType must also be specified. The minimum size is 10GB and the maximum is 65536GB.
      - name: networkSpec
        type: NestedObject
        description: 'The network configuration for the runtime.'
        properties:
          - name: 'enableInternetAccess'
            type: Boolean
            description: Enable public internet access for the runtime.
          - name: 'network'
            type: String
            description: 'The name of the VPC that this runtime is in.'
            diff_suppress_func: 'tpgresource.CompareSelfLinkRelativePaths'
          - name: 'subnetwork'
            type: String
            description: 'The name of the subnetwork that this runtime is in.'
            diff_suppress_func: 'tpgresource.CompareSelfLinkRelativePaths'
      - name: shieldedInstanceConfig
        type: NestedObject
        # GCP API does not return shieldedInstanceConfig in GET responses for NotebookExecutionJob.
        ignore_read: true
        description: 'Optional. Shielded VM configuration.'
        properties:
          - name: enableIntegrityMonitoring
            type: Boolean
            description: 'Optional. Defines whether the instance has integrity monitoring enabled. Enables monitoring and attestation of the boot integrity of the instance. The attestation is performed against the integrity policy baseline. This baseline is initially derived from the implicitly trusted boot image when the instance is created. Enabled by default.'
          - name: enableSecureBoot
            type: Boolean
            description: 'Optional. Defines whether the instance has Secure Boot enabled. Secure Boot helps ensure that the system only runs authentic software by verifying the digital signature of all boot components, and halting the boot process if signature verification fails. Disabled by default.'
          - name: enableVtpm
            type: Boolean
            description: 'Optional. Defines whether the instance has the vTPM enabled. Enabled by default.'
  - name: workbenchRuntime
    type: NestedObject
    # GCP API does not return workbenchRuntime in GET responses for NotebookExecutionJob.
    ignore_read: true
    description: 'Configuration for a Workbench Instances-based environment.'
    properties:
      - name: customContainerImage
        type: NestedObject
        description: 'Optional. Custom container image for the Workbench instance.'
        exactly_one_of:
          - workbench_runtime.0.custom_container_image
          - workbench_runtime.0.vm_image
        properties:
          - name: repository
            type: String
            description: 'The path to the container image repository. For example: gcr.io/{project_id}/{imageName}'
          - name: tag
            type: String
            description: 'The tag of the container image. If not specified, this defaults to the latest tag.'
      - name: vmImage
        type: NestedObject
        description: 'Optional. Custom Compute Engine VM image for the Workbench instance.'
        exactly_one_of:
          - workbench_runtime.0.custom_container_image
          - workbench_runtime.0.vm_image
        properties:
          - name: family
            type: String
            exactly_one_of:
              - workbench_runtime.0.vm_image.0.family
              - workbench_runtime.0.vm_image.0.name
            description: 'Optional. Use this VM image family to find the image; the newest image in this family will be used.'
          - name: name
            type: String
            exactly_one_of:
              - workbench_runtime.0.vm_image.0.family
              - workbench_runtime.0.vm_image.0.name
            description: 'Optional. Use VM image name to find the image.'
          - name: project
            type: String
            description: 'The name of the Google Cloud project that this VM image belongs to. Format: {project_id}'
  - name: 'gcsOutputUri'
    required: true
    type: String
    description: 'The Cloud Storage location to upload the result to. Format:`gs://bucket-name`'
  - name: 'executionUser'
    type: String
    exactly_one_of:
      - execution_user
      - service_account
    description: 'The user email to run the execution as.'
  - name: 'serviceAccount'
    type: String
    exactly_one_of:
      - execution_user
      - service_account
    description: 'The service account to run the execution as.'
