---
name: PscAuthorizationPolicy
description: |
  Represents a Private Service Connect (PSC) Authorization Policy.
references:
  guides:
    Official Documentation: https://cloud.google.com/network-connectivity/docs
  api: https://cloud.google.com/network-connectivity/docs/reference/networkconnectivity/rest/v1/projects.locations.pscAuthorizationPolicies
docs:
base_url: projects/{{project}}/locations/{{location}}/pscAuthorizationPolicies
immutable: true
self_link: projects/{{project}}/locations/{{location}}/pscAuthorizationPolicies/{{name}}
create_url: projects/{{project}}/locations/{{location}}/pscAuthorizationPolicies?psc_authorization_policy_id={{name}}
delete_url: projects/{{project}}/locations/{{location}}/pscAuthorizationPolicies/{{name}}
timeouts:
  insert_minutes: 20
  delete_minutes: 20
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: [create, delete]
  result:
    resource_inside_response: false
autogen_async: true
custom_code:
samples:
  - name: network_connectivity_psc_authorization_policy_basic
    primary_resource_id: default
    steps:
      - name: network_connectivity_psc_authorization_policy_basic
        resource_id_vars:
          policy_name: my-psc-auth-policy
parameters:
  - name: name
    type: String
    description: |
      The name of the PscAuthorizationPolicy.
    url_param_only: true
    required: true
    immutable: true
  - name: location
    type: String
    description: |
      The location of the PscAuthorizationPolicy.
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: createTime
    type: Time
    description: |
      Output only. Time when the PscAuthorizationPolicy was created.
    output: true
  - name: updateTime
    type: Time
    description: |
      Output only. Time when the PscAuthorizationPolicy was updated.
    output: true
  - name: uid
    type: String
    description: |
      Output only. The unique identifier of the PscAuthorizationPolicy.
    output: true
  - name: etag
    type: String
    description: |
      Output only. The etag of the PscAuthorizationPolicy.
    output: true
  - name: labels
    type: KeyValueLabels
    description: |
      User-defined labels.
  - name: description
    type: String
    description: |
      An optional description of this resource.
  - name: targetResourceUri
    type: String
    description: |
      The full absolute URI of the targeted resource governed by this policy.
      For example, for an AgentRegistry resource, the format is:
      `//agentregistry.googleapis.com/projects/{project}/locations/{location}`
    required: true
  - name: authorizedClientResources
    type: Array
    description: |
      List of authorized consumer resources allowed to connect.
      Supported values are:
      1. Project resource name (e.g., `projects/{project_id}`)
      2. Wildcard `"*"` (grants global ingress authorization to the target).
    required: true
    item_type:
      type: String
  - name: authorizationMode
    type: Enum
    description: |
      The authorization mode.
    required: true
    enum_values:
      - AUTHORIZATION_MODE_TRANSITIVE_TO_SERVICE_ATTACHMENT
