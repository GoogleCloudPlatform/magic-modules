---
name: InboundOidcSsoProfile
description: |
  An OIDC federation between a Google enterprise customer and an OIDC identity provider.

  The caller must be a Google Workspace / Cloud Identity administrator of the
  customer with the SSO settings privilege (for example a super admin);
  Google Cloud IAM roles are not sufficient.

  If you are using User ADCs (Application Default Credentials) with this resource,
  you must specify a `billing_project` and set `user_project_override` to true
  in the provider configuration. Otherwise the Cloud Identity API will return a 403 error.
  Your account must have the `serviceusage.services.use` permission on the
  `billing_project` you defined.
references:
  guides:
    Assign SSO profiles: https://cloud.google.com/identity/docs/how-to/assign-sso-profiles
    Set up SSO with OIDC: https://support.google.com/a/answer/13511217
  api: https://cloud.google.com/identity/docs/reference/rest/v1/inboundOidcSsoProfiles
base_url: inboundOidcSsoProfiles
self_link: 'inboundOidcSsoProfiles/{{inbound_oidc_sso_profile_id}}'
create_url: inboundOidcSsoProfiles
update_url: 'inboundOidcSsoProfiles/{{inbound_oidc_sso_profile_id}}'
update_verb: PATCH
update_mask: true
delete_url: 'inboundOidcSsoProfiles/{{inbound_oidc_sso_profile_id}}'
id_format: 'inboundOidcSsoProfiles/{{inbound_oidc_sso_profile_id}}'
import_format:
  - 'inboundOidcSsoProfiles/{{inbound_oidc_sso_profile_id}}'
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
# This resource has unusual authentication requirements that mean we can't currently test it or sweep it in CI
exclude_sweeper: true
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: [create, delete, update]
  result:
    resource_inside_response: true
autogen_async: true
samples:
  - name: cloud_identity_inbound_oidc_sso_profile_basic
    primary_resource_id: oidc_profile
    skip_test: Require Google Workspace admin privileges not held by the CI service account
    steps:
      - name: cloud_identity_inbound_oidc_sso_profile_basic
        resource_id_vars:
          display_name: oidc-profile
        vars:
          issuer_uri: https://idp.example.com
          change_password_uri: https://idp.example.com/change-password
          client_id: test-client-id
          client_secret: test-client-secret
        test_env_vars:
          cust_id: CUST_ID
      - name: cloud_identity_inbound_oidc_sso_profile_basic
        resource_id_vars:
          display_name: oidc-profile-updated
        vars:
          issuer_uri: https://idp.example.com/updated
          change_password_uri: https://idp.example.com/change-password-updated
          client_id: test-client-id-updated
          client_secret: test-client-secret-updated
        test_env_vars:
          cust_id: CUST_ID
properties:
  - name: inboundOidcSsoProfileId
    api_name: name
    type: String
    description: |
      The server-assigned ID of the OIDC SSO profile (the last segment of `name`).
    output: true
    custom_flatten: templates/terraform/custom_flatten/name_from_self_link.tmpl
  - name: name
    type: String
    description: |
      Resource name of the OIDC SSO profile, in the format `inboundOidcSsoProfiles/{inbound_oidc_sso_profile_id}`.
    output: true
  - name: customer
    type: String
    description: |
      The customer. For example: `customers/C0123abc`. If omitted, the customer of the caller is used.
    immutable: true
    default_from_api: true
  - name: displayName
    type: String
    description: |
      Human-readable name of the OIDC SSO profile.
  - name: idpConfig
    type: NestedObject
    description: |
      OIDC identity provider configuration.
    required: true
    properties:
      - name: issuerUri
        type: String
        description: |
          The Issuer identifier for the IdP. Must be a URL. The discovery URL will be derived
          from this as described in Section 4 of the OIDC specification.
        required: true
      - name: changePasswordUri
        type: String
        description: |
          The **Change Password URL** of the identity provider. Users will be sent to this URL
          when changing their passwords at `myaccount.google.com`. This takes precedence over
          the change password URL configured at customer-level. Must use `HTTPS`.
  - name: rpConfig
    type: NestedObject
    description: |
      OIDC relying party (RP) configuration for this OIDC SSO profile. These are the RP details
      provided by Google that should be configured on the corresponding identity provider.
    # The API always returns the output-only `redirect_uris`, even when no client is configured.
    default_from_api: true
    properties:
      - name: clientId
        type: String
        description: |
          OAuth2 client ID for OIDC. Must be set together with `client_secret`.
      - name: clientSecret
        type: String
        description: |
          Input only. OAuth2 client secret for OIDC. Must be set together with `client_id`.
        sensitive: true
        ignore_read: true
      - name: redirectUris
        type: Array
        description: |
          The URL(s) that this client may use in authentication requests.
        output: true
        item_type:
          type: String
