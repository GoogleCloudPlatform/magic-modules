---
name: Tenant
description: |
  Tenant configuration in a multi-tenant project.

  You must enable the
  [Google Identity Platform](https://console.cloud.google.com/marketplace/details/google-cloud-platform/customer-identity) in
  the marketplace prior to using this resource.

  You must [enable multi-tenancy](https://cloud.google.com/identity-platform/docs/multi-tenancy-quickstart) via
  the Cloud Console prior to creating tenants.
docs:
base_url: projects/{{project}}/tenants
self_link: projects/{{project}}/tenants/{{name}}
update_mask: true
update_verb: PATCH
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
include_in_tgc_next: true
generate_list_resource: true
samples:
  - name: identity_platform_tenant_basic
    primary_resource_id: tenant
    steps:
      - name: identity_platform_tenant_basic
        vars:
          display_name: tenant
        # The tenant id is generated by the server from the display name, so a
        # sweepable display name is the only way to get a sweepable tenant. The
        # API caps display names at 20 characters, so no random suffix is added.
        test_vars_overrides:
          display_name: '"tf-test-tenant"'
parameters:
properties:
  - name: name
    type: String
    description: |
      The name of the tenant that is generated by the server
    output: true
    custom_flatten: templates/terraform/custom_flatten/name_from_self_link.tmpl
  - name: displayName
    type: String
    description: |
      Human friendly display name of the tenant.
    required: true
  - name: allowPasswordSignup
    type: Boolean
    description: |
      Whether to allow email/password user authentication.
  - name: enableEmailLinkSignin
    type: Boolean
    description: |
      Whether to enable email link user authentication.
  - name: disableAuth
    type: Boolean
    description: |
      Whether authentication is disabled for the tenant. If true, the users under
      the disabled tenant are not allowed to sign-in. Admins of the disabled tenant
      are not able to manage its users.
  - name: passwordPolicyConfig
    type: NestedObject
    description: |
      The configuration for the password policy on the tenant.
    properties:
      - name: passwordPolicyEnforcementState
        type: Enum
        description: |
          Which enforcement mode to use for the password policy.
        enum_values:
          - OFF
          - ENFORCE
      - name: passwordPolicyVersions
        type: Array
        description: |
          Must be of length 1. Contains the strength attributes for the password policy.
        item_type:
          type: NestedObject
          properties:
            - name: customStrengthOptions
              type: NestedObject
              description: |
                The custom strength options enforced by the password policy.
              properties:
                - name: minPasswordLength
                  type: Integer
                  description: |
                    Minimum password length. Range from 6 to 30.
                - name: maxPasswordLength
                  type: Integer
                  description: |
                    Maximum password length. No default max length.
                - name: containsLowercaseCharacter
                  type: Boolean
                  description: |
                    The password must contain a lower case character.
                - name: containsUppercaseCharacter
                  type: Boolean
                  description: |
                    The password must contain an upper case character.
                - name: containsNumericCharacter
                  type: Boolean
                  description: |
                    The password must contain a number.
                - name: containsNonAlphanumericCharacter
                  type: Boolean
                  description: |
                    The password must contain a non alpha numeric character.
            - name: schemaVersion
              type: Integer
              description: |
                Schema version number for the password policy.
              output: true
      - name: forceUpgradeOnSignin
        type: Boolean
        description: |
          Users must have a password compliant with the password policy to sign-in.
      - name: lastUpdateTime
        type: Time
        description: |
          The last time the password policy on the tenant was updated.
        output: true
  - name: client
    type: NestedObject
    description: |
      Options related to how clients making requests on behalf of a tenant should be configured.
    properties:
      - name: permissions
        type: NestedObject
        description: |
          Configuration related to restricting a user's ability to affect their account.
        properties:
          - name: disabledUserSignup
            type: Boolean
            description: |
              When true, end users cannot sign up for a new account on the associated project through any of our API methods.
          - name: disabledUserDeletion
            type: Boolean
            description: |
              When true, end users cannot delete their account on the associated project through any of our API methods.
