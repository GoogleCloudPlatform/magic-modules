---
name: 'TelemetryPolicy'
description: |
  Provides a configuration for telemetry.
min_version: 'beta'
references:
  guides:
  api: 'https://cloud.google.com/traffic-director/docs/reference/network-services/rest/v1beta1/projects.locations.telemetryPolicies'
docs:
base_url: 'projects/{{project}}/locations/{{location}}/telemetryPolicies'
self_link: 'projects/{{project}}/locations/{{location}}/telemetryPolicies/{{name}}'
create_url: 'projects/{{project}}/locations/{{location}}/telemetryPolicies?telemetryPolicyId={{name}}'
update_verb: 'PATCH'
update_mask: true
import_format:
  - 'projects/{{project}}/locations/{{location}}/telemetryPolicies/{{name}}'
timeouts:
  insert_minutes: 30
  update_minutes: 30
  delete_minutes: 30
autogen_async: true
async:
  actions: ['create', 'delete', 'update']
  type: 'OpAsync'
  operation:
    base_url: '{{op_id}}'
    timeouts:
      insert_minutes: 30
      update_minutes: 30
      delete_minutes: 30
  result:
    resource_inside_response: false
custom_code:
sweeper:
  url_substitutions:
    - location: 'global'
    - location: 'us-central1'
samples:
  - name: 'network_services_telemetry_policy_basic'
    primary_resource_id: 'default'
    min_version: 'beta'
    steps:
      - name: 'network_services_telemetry_policy_basic'
        test_env_vars:
          project: 'PROJECT_NAME'
        resource_id_vars:
          resource_name: 'my-telemetry-policy'
  - name: 'network_services_telemetry_policy_full'
    primary_resource_id: 'default'
    min_version: 'beta'
    steps:
      - name: 'network_services_telemetry_policy_full'
        test_env_vars:
          project: 'PROJECT_NAME'
        resource_id_vars:
          resource_name: 'my-telemetry-policy-full'
      - name: 'network_services_telemetry_policy_update'
        test_env_vars:
          project: 'PROJECT_NAME'
        resource_id_vars:
          resource_name: 'my-telemetry-policy-full'
  - name: 'network_services_telemetry_policy_global'
    primary_resource_id: 'default'
    min_version: 'beta'
    steps:
      - name: 'network_services_telemetry_policy_global'
        test_env_vars:
          project: 'PROJECT_NAME'
        resource_id_vars:
          resource_name: 'my-telemetry-policy-global'
parameters:
  - name: 'name'
    type: String
    description: |
      Short name of the TelemetryPolicy resource to be created.
    url_param_only: true
    required: true
    immutable: true
  - name: 'location'
    type: String
    description: |
      Location (region) of the TelemetryPolicy resource to be created. Defaults to 'global'.
    default_value: 'global'
    url_param_only: true
    immutable: true
properties:
  - name: 'createTime'
    type: Time
    description: |
      Time the TelemetryPolicy was created in UTC.
    output: true
  - name: 'updateTime'
    type: Time
    description: |
      Time the TelemetryPolicy was updated in UTC.
    output: true
  - name: 'uid'
    type: String
    description: |
      Specifies the server-assigned unique identifier for the policy.
    output: true
  - name: 'labels'
    type: KeyValueLabels
    description: |
      Set of label tags associated with the TelemetryPolicy resource.
  - name: 'displayName'
    type: String
    description: |
      Provides a human-readable name for the policy.
  - name: 'telemetryTarget'
    type: NestedObject
    description: |
      Specifies the set of targets to which this telemetry policy applies.
    required: true
    properties:
      - name: 'resources'
        type: Array
        description: |
          Lists references to the resources that are targeted by the policy.
          Types of resources supported:
          - `run.googleapis.com/`
          - `compute.googleapis.com/`
          - `networkservices.googleapis.com/`
          The format must be the full resource name of a supported resource.
        required: true
        diff_suppress_func: 'tpgresource.ProjectNumberDiffSuppress'
        item_type:
          type: String
  - name: 'tracingConfiguration'
    type: NestedObject
    description: |
      Specifies the top-level configuration block within the telemetry policy that contains all the settings for how tracing will be applied to the target resources.
    properties:
      - name: 'samplingRate'
        type: Double
        description: |
          Specifies the tracing sampling rate. The sampling rate is a float number in the interval [0, 1]. The sampling rate is applied to all requests to the targeted resources. The default value is 0.0.
      - name: 'customSpanAttributes'
        type: Array
        description: |
          Provides key-value pairs for adding context to spans. Supports literalValue (static) and fromHeaderValue (dynamic extraction).
        item_type:
          type: NestedObject
          properties:
            - name: 'attributeName'
              type: String
              description: |
                Defines the key for a custom attribute that is added to the trace spans generated by the Google Cloud Load Balancer (GCLB).
              required: true
            - name: 'literalValue'
              type: String
              description: |
                Assigns a static, constant value to the custom trace span attribute defined by the corresponding attributeName. Mutually exclusive with fromHeaderValue.
            - name: 'fromHeaderValue'
              type: String
              description: |
                Specifies an incoming request header name from which the value for the custom span attribute should be dynamically extracted. Mutually exclusive with literalValue.
      - name: 'parentBasedSampling'
        type: NestedObject
        description: |
          Configures honoring a sampled bit in downstream traceparentID headers.
        properties:
          - name: 'enabled'
            type: Boolean
            description: |
              Provides a master switch to respect a sampled bit in incoming traceparentID headers. Default is false.
            send_empty_value: true
          - name: 'samplingRate'
            type: Double
            description: |
              Specifies the sampling rate to use when the sampled bit is set in the incoming traceparentID header.
  - name: 'metricsConfiguration'
    type: NestedObject
    description: |
      Specifies the top-level configuration block within the telemetry policy that contains all the settings for how metrics will be applied to the target resources.
    properties:
      - name: 'enabled'
        type: Boolean
        description: |
          Indicates whether metrics are enabled or disabled. Set to true to explicitly enable, or false to explicitly disable.
        send_empty_value: true
