---
name: 'CdnEdgeExtension'
description: |
  CdnEdgeExtension is a resource that lets the extension service modify the headers of both requests to the cache and responses from the cache served by an EdgeCacheService.
min_version: 'beta'
references:
  guides:
    'Configure a edge extension': 'https://cloud.google.com/service-extensions/docs/configure-edge-extensions'
  api: 'https://cloud.google.com/service-extensions/docs/reference/rest/v1beta1/projects.locations.cdnEdgeExtensions'
docs:
base_url: 'projects/{{project}}/locations/{{location}}/cdnEdgeExtensions'
self_link: 'projects/{{project}}/locations/{{location}}/cdnEdgeExtensions/{{name}}'
create_url: 'projects/{{project}}/locations/{{location}}/cdnEdgeExtensions?cdnEdgeExtensionId={{name}}'
update_verb: 'PATCH'
update_mask: true
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
autogen_async: true
async:
  actions: ['create', 'delete', 'update']
  type: 'OpAsync'
  operation:
    base_url: '{{op_id}}'
  result:
    resource_inside_response: false
custom_code:
sweeper:
  url_substitutions:
    - location: 'global'
samples:
  - name: 'network_services_cdn_edge_extension_basic'
    primary_resource_id: 'default'
    min_version: 'beta'
    # Excluded from generated tests because WasmPlugin requires uploading a compiled .wasm
    # artifact to Artifact Registry in a pre-apply step; covered by the handwritten test in
    # mmv1/third_party/terraform/services/networkservices2/resource_network_services_cdn_edge_extension_test.go.tmpl.
    exclude_test: true
    steps:
      - name: 'network_services_cdn_edge_extension_basic'
        test_env_vars:
          project: 'PROJECT_NAME'
        resource_id_vars:
          bucket_name: 'my-bucket'
          origin_name: 'my-origin'
          service_name: 'my-service'
          cdn_edge_extension_name: 'my-cdn-edge-ext'
          wasm_plugin_name: 'my-wasm-plugin'
          repository_name: 'repository-standard'
parameters:
  - name: 'location'
    type: String
    description: |
      The location of the CDN edge extension.
    url_param_only: true
    required: true
    immutable: true
  - name: 'name'
    type: String
    description: |
      Name of the CdnEdgeExtension resource in the following format: projects/{project}/locations/{location}/cdnEdgeExtensions/{cdn_edge_extension}
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: 'description'
    type: String
    description: |
      A human-readable description of the resource.
  - name: 'labels'
    type: KeyValueLabels
    description: 'Set of labels associated with the CdnEdgeExtension resource.'
  - name: 'target'
    type: NestedObject
    description: |
      Specifies the set of targets to which CdnEdgeExtension should be applied to.
    required: true
    properties:
      - name: 'resources'
        type: Array
        description: |
          A list of references to the resources that are targeted by CdnEdgeExtension.
          Types of resources supported: EdgeCacheService.
          The format can be `projects/{project}/locations/{location}/edgeCacheServices/{edgeCacheService}` or
          `//networkservices.googleapis.com/projects/{project}/locations/{location}/edgeCacheServices/{edgeCacheService}`.
        required: true
        diff_suppress_func: 'tpgresource.ProjectNumberDiffSuppress'
        item_type:
          type: String
  - name: 'extensionChains'
    type: Array
    description: |
      A set of ordered extension chains that contain the match conditions and extensions to execute.
      Match conditions for each extension chain are evaluated in sequence for a given request.
      The first extension chain that has a condition that matches the request is executed.
      Any subsequent extension chains do not execute. Limited to 5 extension chains per resource.
    required: true
    item_type:
      type: NestedObject
      properties:
        - name: 'name'
          type: String
          description: |
            The name for this extension chain. The name is logged as part of the HTTP request logs.
            The name must conform with RFC-1034, is restricted to lower-cased letters, numbers and hyphens,
            and can have a maximum length of 63 characters. Additionally, the first character must be a letter
            and the last character must be a letter or a number.
          required: true
        - name: 'matchCondition'
          type: NestedObject
          description: |
            Conditions under which this chain is invoked for a request.
          required: true
          properties:
            - name: 'celExpression'
              type: String
              description: |
                A Common Expression Language (CEL) expression that is used to match requests for which the extension chain is executed.
              required: true
        - name: 'extensions'
          type: Array
          description: |
            A set of extensions to execute for the matching request.
            At least one extension is required. Up to 3 extensions can be defined for each extension chain.
          required: true
          item_type:
            type: NestedObject
            properties:
              - name: 'name'
                type: String
                description: |
                  The name for this extension. The name is logged as part of the HTTP request logs.
                  The name must conform with RFC-1034, is restricted to lower-cased letters, numbers and hyphens,
                  and can have a maximum length of 63 characters. Additionally, the first character must be a letter
                  and the last a letter or a number.
                required: true
              - name: 'service'
                type: String
                description: |
                  The reference to the service that runs the extension.
                  Must be a reference to a WasmPlugin resource.
                required: true
                diff_suppress_func: 'tpgresource.ProjectNumberDiffSuppress'
              - name: 'failOpen'
                type: Boolean
                description: |
                  Determines how the proxy behaves if the call to the extension fails or times out.
                  When set to TRUE, request or response processing continues without error.
                  Any subsequent extensions in the extension chain are also executed.
              - name: 'supportedEvents'
                type: Array
                description: |
                  A set of events during request or response processing for which this extension is called.
                  Eligible values are `REQUEST_HEADERS` and `RESPONSE_HEADERS`.
                item_type:
                  type: String
                min_size: 1
              - name: 'forwardHeaders'
                type: Array
                description: |
                  List of the HTTP headers to forward to the extension (from the client or backend).
                  If omitted, all headers are sent. Each element is a string indicating the header name.
                item_type:
                  type: String
              - name: 'forwardAttributes'
                type: Array
                description: |
                  List of the Envoy attributes to forward to the extension server.
                item_type:
                  type: String
                max_size: 16
