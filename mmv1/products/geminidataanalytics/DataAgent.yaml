                    item_type:
                      type: NestedObject
                      properties:
                        - name: 'projectId'
                          type: String
                          description: |-
                            Required. The project that the property graph belongs to.
                          required: true
                        - name: 'datasetId'
                          type: String
                          description: |-
                            Required. The dataset that the property graph belongs to.
                          required: true
                        - name: 'propertyGraphId'
                          type: String
                          description: |-
                            Required. The property graph ID.
                          required: true
              - name: 'looker'
                type: NestedObject
                description: |-
                  References to Looker explores.
                properties:
                  - name: 'exploreReferences'
                    type: Array
                    description: |-
                      Required. References to Looker explores.
                    required: true
                    item_type:
                      type: NestedObject
                      properties:
                        - name: 'lookmlModel'
                          type: String
                          description: |-
                            Required. Name of the LookML model.
                          required: true
                        - name: 'explore'
                          type: String
                          description: |-
                            Required. Name of the LookML Explore.
                          required: true
                        - name: 'lookerInstanceUri'
                          type: String
                          description: |-
                            Optional. The base URL of the Looker instance.
                        - name: 'privateLookerInstanceInfo'
                          type: NestedObject
                          description: |-
                            Optional. Private Looker instance info if the Looker instance is behind a private network.
                          properties:
                            - name: 'lookerInstanceId'
                              type: String
                              description: |-
                                Optional. The Looker instance ID.
                            - name: 'serviceDirectoryName'
                              type: String
                              description: |-
                                Optional. The service directory name of the Looker instance.
                        - name: 'schema'
                          type: NestedObject
                          description: |-
                            Optional. The schema of the datasource.
                          properties:
                            - name: 'description'
                              type: String
                              description: |-
                                Optional. A textual description of the explore's content and purpose.
                            - name: 'displayName'
                              type: String
                              description: |-
                                Optional. Explore display name.
                            - name: 'synonyms'
                              type: Array
                              description: |-
                                Optional. A list of alternative names or synonyms that can be used to refer to the explore.
                              item_type:
                                type: String
                            - name: 'tags'
                              type: Array
                              description: |-
                                Optional. A list of tags or keywords associated with the explore, used for categorization.
                              item_type:
                                type: String
                            - name: 'fields'
                              type: Array
                              description: |-
                                Optional. The fields in the schema.
                              item_type:
                                type: NestedObject
                                properties:
                                  - name: 'name'
                                    type: String
                                    description: |-
                                      Optional. The name of the field.
                                  - name: 'type'
                                    type: String
                                    description: |-
                                      Optional. The type of the field.
                                  - name: 'description'
                                    type: String
                                    description: |-
                                      Optional. A brief description of the field.
                                  - name: 'mode'
                                    type: String
                                    description: |-
                                      Optional. The mode of the field (e.g., NULLABLE, REPEATED).
                                  - name: 'synonyms'
                                    type: Array
                                    description: |-
                                      Optional. A list of alternative names or synonyms that can be used to refer to this field.
                                    item_type:
                                      type: String
                                  - name: 'tags'
                                    type: Array
                                    description: |-
                                      Optional. A list of tags or keywords associated with the field, used for categorization.
                                    item_type:
                                      type: String
                                  - name: 'subfields'
                                    type: String
                                    description: |-
                                      Optional. Recursive property for nested schema structures, encoded as a JSON string representing a list of Field objects.
                                    state_func: 'func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }'
                                    validation:
                                      function: 'validation.StringIsJSON'
                                    custom_expand: 'templates/terraform/custom_expand/json_value.tmpl'
                                    custom_flatten: 'templates/terraform/custom_flatten/json_schema.tmpl'
                                  - name: 'category'
                                    type: String
                                    description: |-
                                      Optional. Field category.
                                  - name: 'valueFormat'
                                    type: String
                                    description: |-
                                      Optional. Value format of the field.
                            - name: 'filters'
                              type: Array
                              description: |-
                                Optional. The filters on the datasource's underlying data.
                              item_type:
                                type: NestedObject
                                properties:
                                  - name: 'field'
                                    type: String
                                    description: |-
                                      Optional. The field to filter on.
                                  - name: 'value'
                                    type: String
                                    description: |-
                                      Optional. The default value used for this filter if the filter is not overridden in a query.
                                  - name: 'type'
                                    type: String
                                    description: |-
                                      Optional. The type of filter present on a datasource, such as ALWAYS_FILTER.
              - name: 'studio'
                type: NestedObject
                description: |-
                  References to Looker Studio datasources.
                properties:
                  - name: 'studioReferences'
                    type: Array
                    description: |-
                      Optional. The references to the studio datasources.
                    item_type:
                      type: NestedObject
                      properties:
                        - name: 'datasourceId'
                          type: String
                          description: |-
                            Required. The ID of the datasource.
                          required: true
          - name: 'options'
            type: NestedObject
            description: |-
              Optional. Additional options for the conversation.
            properties:
              - name: 'analysis'
                type: NestedObject
                description: |-
                  Optional. Options for analysis.
                properties:
                  - name: 'python'
                    type: NestedObject
                    description: |-
                      Optional. Options for Python analysis.
                    properties:
                      - name: 'enabled'
                        type: Boolean
                        description: |-
                          Optional. Whether to enable Python analysis. Defaults to false.
              - name: 'datasource'
                type: NestedObject
                description: |-
                  Optional. Options for datasource configuration.
                properties:
                  - name: 'bigQueryMaxBilledBytes'
                    type: Integer
                    description: |-
                      Optional. Limits the bytes billed for each BigQuery query job.
              - name: 'model'
                type: String
                description: |-
                  Optional. The model to use for the agent loop.
                default_from_api: true
          - name: 'exampleQueries'
            type: Array
            description: |-
              Optional. A list of example queries for BigQuery data sources.
            item_type:
              type: NestedObject
              properties:
                - name: 'naturalLanguageQuestion'
                  type: String
                  description: |-
                    Optional. A natural language question that a user might ask.
                - name: 'sqlQuery'
                  type: String
                  description: |-
                    Optional. The SQL query that should be generated to answer
                    the natural language question.
                - name: 'parameters'
                  type: Array
                  description: |-
                    Optional. The list of query parameters.
                  item_type:
                    type: NestedObject
                    properties:
                      - name: 'name'
                        type: String
                        description: |-
                          Required. The name of the parameter reference in the SQL query.
                        required: true
                      - name: 'description'
                        type: String
                        description: |-
                          Optional. The description of the parameter that can be used by the LLM to extract the parameter value from the user question.
                      - name: 'dataType'
                        type: String
                        description: |-
                          Required. The data type of the parameter, e.g. "STRING", "INT64", "DATE".
                        required: true
          - name: 'lookerGoldenQueries'
            type: Array
            description: |-
              Optional. A list of golden queries for Looker data sources.
            item_type:
              type: NestedObject
              properties:
                - name: 'naturalLanguageQuestions'
                  type: Array
                  description: |-
                    Optional. Natural language questions that a user might ask.
                  item_type:
                    type: String
                - name: 'lookerQuery'
                  type: NestedObject
                  description: |-
                    Optional. The Looker Query corresponding to the natural language questions.
                  properties:
                    - name: 'model'
                      type: String
                      description: |-
                        Required. The LookML model used to generate the query.
                      required: true
                    - name: 'explore'
                      type: String
                      description: |-
                        Required. The LookML explore used to generate the query.
                      required: true
                    - name: 'fields'
                      type: Array
                      description: |-
                        Optional. The fields to retrieve from the explore.
                      item_type:
                        type: String
                    - name: 'filters'
                      type: Array
                      description: |-
                        Optional. The filters to apply to the explore.
                      item_type:
                        type: NestedObject
                        properties:
                          - name: 'field'
                            type: String
                            description: |-
                              Required. The field to filter on.
                            required: true
                          - name: 'value'
                            type: String
                            description: |-
                              Optional. The value for the field to filter on.
                    - name: 'sorts'
                      type: Array
                      description: |-
                        Optional. The sorts to apply to the explore.
                      item_type:
                        type: String
                    - name: 'limit'
                      type: String
                      description: |-
                        Optional. Limit in the query.
                    - name: 'queryId'
                      type: String
                      description: |-
                        Optional. The primary identifier for the query resource in Looker.
                    - name: 'clientId'
                      type: String
                      description: |-
                        Optional. The short alphanumeric identifier for the query, used for share links and Explore URLs.
          - name: 'glossaryTerms'
            type: Array
            description: |-
              Optional. Term definitions for the agent's domain.
            item_type:
              type: NestedObject
              properties:
                - name: 'displayName'
                  type: String
                  description: |-
                    Required. User friendly display name of the glossary term.
                  required: true
                - name: 'description'
                  type: String
                  description: |-
                    Required. The description or meaning of the term.
                  required: true
                - name: 'labels'
                  type: Array
                  description: |-
                    Optional. A list of general purpose labels associated with this term.
                  item_type:
                    type: String
          - name: 'schemaRelationships'
            type: Array
            description: |-
              Optional. Relationships between table schemas, including referencing
              and referenced columns.
            item_type:
              type: NestedObject
              properties:
                - name: 'leftSchemaPaths'
                  type: NestedObject
                  description: |-
                    Required. An ordered list of fields for the left side of the join.
                  required: true
                  properties:
                    - name: 'tableFqn'
                      type: String
                      description: |-
                        Required. The service-qualified full resource name of the table.
                      required: true
                    - name: 'paths'
                      type: Array
                      description: |-
                        Required. The ordered list of paths within the table schema.
                      required: true
                      item_type:
                        type: String
                - name: 'rightSchemaPaths'
                  type: NestedObject
                  description: |-
                    Required. An ordered list of fields for the right side of the join.
                  required: true
                  properties:
                    - name: 'tableFqn'
                      type: String
                      description: |-
                        Required. The service-qualified full resource name of the table.
                      required: true
                    - name: 'paths'
                      type: Array
                      description: |-
                        Required. The ordered list of paths within the table schema.
                      required: true
                      item_type:
                        type: String
                - name: 'sources'
                  type: Array
                  description: |-
                    Optional. Sources which generated the schema relation edge.
                    Possible values: BIGQUERY_JOB_HISTORY, LLM_SUGGESTED, BIGQUERY_TABLE_CONSTRAINTS.
                  item_type:
                    type: String
                - name: 'confidenceScore'
                  type: Double
                  description: |-
                    Optional. A confidence score for the suggested relationship.
          - name: 'userFunctions'
            type: NestedObject
            description: |-
              Optional. A collection of user functions to be included in context.
            properties:
              - name: 'bqRoutines'
                type: Array
                description: |-
                  Optional. A list of BigQuery routines to include in the context.
                item_type:
                  type: NestedObject
                  properties:
                    - name: 'description'
                      type: String
                      description: |-
                        Optional. User override or addition to description, to tell the agent when to use the UDF.
                    - name: 'routineReference'
                      type: NestedObject
                      description: |-
                        Optional. The reference to the BigQuery routine.
                      properties:
                        - name: 'projectId'
                          type: String
                          description: |-
                            Optional. The project ID of the routine.
                        - name: 'datasetId'
                          type: String
                          description: |-
                            Optional. The dataset ID of the routine.
                        - name: 'routineId'
                          type: String
                          description: |-
                            Optional. The routine ID of the routine.
      - name: 'lastPublishedContext'
        type: NestedObject
        description: |-
          Output only. The last published context for the agent.
        output: true
        custom_expand: 'templates/terraform/custom_expand/gemini_data_analytics_data_agent_last_published_context.go.tmpl'
        properties:
          - name: 'systemInstruction'
            type: String
            description: |-
              Output only. The basic entry point for data owners creating domain
              knowledge for the agent.
          - name: 'datasourceReferences'
            type: NestedObject
            description: |-
              Output only. Data sources that are available for answering questions.
            properties:
              - name: 'bq'
                type: NestedObject
                description: |-
                  References to BigQuery tables.
                properties:
                  - name: 'tableReferences'
                    type: Array
                    description: |-
                      References to BigQuery tables.
                    item_type:
                      type: NestedObject
                      properties:
                        - name: 'projectId'
                          type: String
                          description: |-
                            The project that the table belongs to.
                        - name: 'datasetId'
                          type: String
                          description: |-
                            The dataset that the table belongs to.
                        - name: 'tableId'
                          type: String
                          description: |-
                            The table ID.
  - name: 'kmsKey'
    type: String
    description: |-
      Optional. Customer managed encryption key (CMEK) to use for encrypting the
      DataAgent resources. Cloud KMS CryptoKeys must reside in the same location
      as the DataAgent. The expected format is
      projects/*/locations/*/keyRings/*/cryptoKeys/*.
    # Not annotated IMMUTABLE in the proto, but updateSync rejects it:
    # "request.update_mask: kms_key field cannot be updated."
    immutable: true
  - name: 'createTime'
    type: String
    description: |-
      Output only. The time when the data agent was created.
    output: true
  - name: 'updateTime'
    type: String
    description: |-
      Output only. The time when the data agent was last updated.
    output: true
  - name: 'deleteTime'
    type: String
    description: |-
      Output only. The time the data agent was soft deleted.
    output: true
  - name: 'purgeTime'
    type: String
    description: |-
      Output only. Timestamp in UTC of when this data agent is considered expired.
    output: true
