                                type: NestedObject
                                properties:
                                  - name: 'name'
                                    type: String
                                    output: true
                                    description: |-
                                      Output only. The name of the field.
                                  - name: 'description'
                                    type: String
                                    output: true
                                    description: |-
                                      Output only. A brief description of the field.
                                  - name: 'synonyms'
                                    type: Array
                                    output: true
                                    description: |-
                                      Output only. A list of alternative names or synonyms that can be
                                      used to refer to this field.
                                    item_type:
                                      type: String
                                  - name: 'tags'
                                    type: Array
                                    output: true
                                    description: |-
                                      Output only. A list of tags or keywords associated with the field,
                                      used for categorization.
                                    item_type:
                                      type: String
          - name: 'options'
            type: NestedObject
            description: |-
              Output only. Additional options for the conversation.
            output: true
            properties:
              - name: 'analysis'
                type: NestedObject
                description: |-
                  Output only. Options for analysis.
                output: true
                properties:
                  - name: 'python'
                    type: NestedObject
                    description: |-
                      Output only. Options for Python analysis.
                    output: true
                    properties:
                      - name: 'enabled'
                        type: Boolean
                        description: |-
                          Output only. Whether Python analysis is enabled.
                        output: true
              - name: 'datasource'
                type: NestedObject
                description: |-
                  Output only. Options for datasource configuration.
                output: true
                properties:
                  - name: 'bigQueryMaxBilledBytes'
                    type: Integer
                    description: |-
                      Output only. Limits the bytes billed for each BigQuery query job.
                    output: true
              - name: 'model'
                type: String
                output: true
                description: |-
                  Output only. The model to use for the conversation. Possible values:
                  `LATEST_GA_MODEL`. See the
                  [API reference](https://cloud.google.com/gemini/docs/conversational-analytics-api/reference/rest/v1/ConversationOptions)
                  for the full list of values.
          - name: 'exampleQueries'
            type: Array
            description: |-
              Output only. A list of example queries for BigQuery data sources.
            output: true
            item_type:
              type: NestedObject
              properties:
                - name: 'naturalLanguageQuestion'
                  type: String
                  description: |-
                    Output only. A natural language question that a user might ask.
                  output: true
                - name: 'sqlQuery'
                  type: String
                  description: |-
                    Output only. The SQL query that should be generated to answer
                    the natural language question.
                  output: true
                - name: 'parameters'
                  type: Array
                  output: true
                  description: |-
                    Output only. Parameters referenced by the SQL query, for example `@name`.
                  item_type:
                    type: NestedObject
                    properties:
                      - name: 'name'
                        type: String
                        output: true
                        description: |-
                          Output only. The name of the parameter, as referenced in the SQL query.
                      - name: 'description'
                        type: String
                        output: true
                        description: |-
                          Output only. A description of the parameter.
                      - name: 'dataType'
                        type: String
                        output: true
                        description: |-
                          Output only. The BigQuery data type of the parameter, for example `STRING`.
          - name: 'glossaryTerms'
            type: Array
            description: |-
              Output only. Term definitions for the agent's domain.
            output: true
            item_type:
              type: NestedObject
              properties:
                - name: 'displayName'
                  type: String
                  description: |-
                    Output only. User friendly display name of the glossary term.
                  output: true
                - name: 'description'
                  type: String
                  description: |-
                    Output only. The description or meaning of the term.
                  output: true
                - name: 'labels'
                  type: Array
                  description: |-
                    Output only. A list of general purpose labels associated with this term.
                  output: true
                  item_type:
                    type: String
          - name: 'schemaRelationships'
            type: Array
            description: |-
              Output only. Relationships between table schemas, including referencing
              and referenced columns.
            output: true
            item_type:
              type: NestedObject
              properties:
                - name: 'leftSchemaPaths'
                  type: NestedObject
                  description: |-
                    Output only. An ordered list of fields for the left side of the join.
                  output: true
                  properties:
                    - name: 'tableFqn'
                      type: String
                      description: |-
                        Output only. The service-qualified full resource name of the table.
                      output: true
                    - name: 'paths'
                      type: Array
                      description: |-
                        Output only. The ordered list of paths within the table schema.
                      output: true
                      item_type:
                        type: String
                - name: 'rightSchemaPaths'
                  type: NestedObject
                  description: |-
                    Output only. An ordered list of fields for the right side of the join.
                  output: true
                  properties:
                    - name: 'tableFqn'
                      type: String
                      description: |-
                        Output only. The service-qualified full resource name of the table.
                      output: true
                    - name: 'paths'
                      type: Array
                      description: |-
                        Output only. The ordered list of paths within the table schema.
                      output: true
                      item_type:
                        type: String
                - name: 'sources'
                  type: Array
                  description: |-
                    Output only. Sources which generated the schema relation edge.
                  output: true
                  item_type:
                    type: String
                - name: 'confidenceScore'
                  type: Double
                  description: |-
                    Output only. A confidence score for the suggested relationship.
                  output: true
          - name: 'userFunctions'
            type: NestedObject
            output: true
            description: |-
              Output only. User-defined functions that the agent can use.
            properties:
              - name: 'bqRoutines'
                type: Array
                output: true
                description: |-
                  Output only. BigQuery routines (user-defined functions) available to the agent.
                item_type:
                  type: NestedObject
                  properties:
                    - name: 'routineReference'
                      type: NestedObject
                      output: true
                      description: |-
                        Output only. Reference to the BigQuery routine.
                      properties:
                        - name: 'projectId'
                          type: String
                          output: true
                          description: |-
                            Output only. The project that the routine belongs to.
                        - name: 'datasetId'
                          type: String
                          output: true
                          description: |-
                            Output only. The dataset that the routine belongs to.
                        - name: 'routineId'
                          type: String
                          output: true
                          description: |-
                            Output only. The routine ID.
                    - name: 'description'
                      type: String
                      output: true
                      description: |-
                        Output only. A description of the routine.
  - name: 'kmsKey'
    type: String
    description: |-
      Optional. Customer managed encryption key (CMEK) to use for encrypting the
      DataAgent resources. Cloud KMS CryptoKeys must reside in the same location
      as the DataAgent. The expected format is
      projects/*/locations/*/keyRings/*/cryptoKeys/*.
    # Not annotated IMMUTABLE in the proto, but updateSync rejects it:
    # "request.update_mask: kms_key field cannot be updated."
    immutable: true
  - name: 'createTime'
    type: String
    description: |-
      Output only. The time when the data agent was created.
    output: true
  - name: 'updateTime'
    type: String
    description: |-
      Output only. The time when the data agent was last updated.
    output: true
  - name: 'deleteTime'
    type: String
    description: |-
      Output only. The time the data agent was soft deleted.
    output: true
  - name: 'purgeTime'
    type: String
    description: |-
      Output only. Timestamp in UTC of when this data agent is considered expired.
    output: true
