---
name: OutboundEndpoint
description: |
  An OutboundEndpoint is a regional resource to enable outbound forwarding from a private IP range in VPCs to on-premise or other networks.
references:
  guides:
    Cloud DNS Outbound Endpoints: https://cloud.google.com/dns/docs/outbound-forwarding-zones
  api: https://cloud.google.com/dns/docs/reference/v1/outboundEndpoints
docs:
base_url: projects/{{project}}/locations/{{location}}/outboundEndpoints
self_link: projects/{{project}}/locations/{{location}}/outboundEndpoints/{{name}}
create_url: projects/{{project}}/locations/{{location}}/outboundEndpoints?outboundEndpointId={{name}}
update_mask: true
update_verb: PATCH
id_format: projects/{{project}}/locations/{{location}}/outboundEndpoints/{{name}}
import_format:
  - projects/{{project}}/locations/{{location}}/outboundEndpoints/{{name}}
  - '{{project}}/{{location}}/{{name}}'
  - '{{location}}/{{name}}'
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
autogen_async: true
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: [create, delete, update]
  result:
    resource_inside_response: false
autogen_status: T3V0Ym91bmRFbmRwb2ludEF1dG9nZW5WMkFnZW50
samples:
  - name: dns_outbound_endpoint_basic
    primary_resource_id: example-endpoint
    steps:
      - name: dns_outbound_endpoint_basic
        resource_id_vars:
          outbound_endpoint_name: example-endpoint
          network_name: test-network
          subnetwork_name: test-subnetwork
          proxy_subnetwork_name: test-proxy-subnetwork
      - name: dns_outbound_endpoint_basic_update
        vars:
          description: Sample outbound endpoint description
          env: test
          owner: network-team
        resource_id_vars:
          outbound_endpoint_name: example-endpoint
          network_name: test-network
          subnetwork_name: test-subnetwork
          proxy_subnetwork_name: test-proxy-subnetwork
      - name: dns_outbound_endpoint_basic_update
        vars:
          description: Updated outbound endpoint description
          env: prod
          owner: dns-team
        resource_id_vars:
          outbound_endpoint_name: example-endpoint
          network_name: test-network
          subnetwork_name: test-subnetwork
          proxy_subnetwork_name: test-proxy-subnetwork
parameters:
  - name: name
    type: String
    description: |
      The name of the OutboundEndpoint.
    url_param_only: true
    required: true
    immutable: true
  - name: location
    type: String
    description: |
      The location of the OutboundEndpoint.
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: endpointIp
    type: String
    description: |
      User provided IP address to use for outbound DNS forwarding. This address
      must be a free address on the subnetwork. If omitted, a free IP address
      from the subnetwork is automatically allocated.
    default_from_api: true
    immutable: true
  - name: network
    type: String
    description: |
      The VPC network containing the outbound endpoint, specified as full path.
    required: true
    immutable: true
  - name: subnetwork
    type: String
    description: |
      The subnetwork holding the endpoint_ip, specified as full path.
    required: true
    immutable: true
  - name: description
    type: String
    description: |
      User provided description.
  - name: labels
    type: KeyValueLabels
    description: |
      Labels as key value pairs
  - name: annotations
    type: KeyValueAnnotations
    description: |
      Annotations as key value pairs
  - name: createTime
    type: Time
    description: |
      The timestamp when the resource was created.
    output: true
  - name: updateTime
    type: Time
    description: |
      The timestamp when the resource was updated.
    output: true
