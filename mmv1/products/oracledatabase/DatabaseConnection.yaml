---
name: DatabaseConnection
description: |-
  A DatabaseConnection represents a connection to an Oracle database, specifying
  credentials, connection string, and optional network and wallet configuration.
references:
  guides:
    Oracle Database: https://cloud.google.com/oracle/database/docs/overview
base_url: projects/{{project}}/locations/{{location}}/databaseConnections
self_link: projects/{{project}}/locations/{{location}}/databaseConnections/{{database_connection_id}}
create_url: projects/{{project}}/locations/{{location}}/databaseConnections?databaseConnectionId={{database_connection_id}}
id_format: projects/{{project}}/locations/{{location}}/databaseConnections/{{database_connection_id}}
import_format:
  - projects/{{project}}/locations/{{location}}/databaseConnections/{{database_connection_id}}
update_mask: true
update_verb: PATCH
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
async:
  type: OpAsync
  operation:
    timeouts:
      insert_minutes: 20
      update_minutes: 20
      delete_minutes: 20
    base_url: '{{op_id}}'
  actions:
    - create
    - update
    - delete
  result:
    resource_inside_response: true
  include_project: false
autogen_status: RGF0YWJhc2VDb25uZWN0aW9uQXV0b2dlblYyQWdlbnQ=
autogen_async: true
samples:
  - name: oracledatabase_database_connection_basic
    primary_resource_id: default
    steps:
      - name: oracledatabase_database_connection_basic
        resource_id_vars:
          project: my-project
          database_connection_id: my-connection
        test_vars_overrides:
          project: envvar.GetTestProjectFromEnv()
          database_connection_id: fmt.Sprintf("tf-test-dbconn-%s", acctest.RandString(t, 10))
  - name: oracledatabase_database_connection_full
    primary_resource_id: default
    steps:
      - name: oracledatabase_database_connection_full
        resource_id_vars:
          project: my-project
          database_connection_id: my-connection
        test_vars_overrides:
          project: envvar.GetTestProjectFromEnv()
          database_connection_id: fmt.Sprintf("tf-test-dbconn-%s", acctest.RandString(t, 10))
      - name: oracledatabase_database_connection_full_update
        resource_id_vars:
          project: my-project
          database_connection_id: my-connection
        test_vars_overrides:
          project: envvar.GetTestProjectFromEnv()
          database_connection_id: fmt.Sprintf("tf-test-dbconn-%s", acctest.RandString(t, 10))
parameters:
  - name: location
    type: String
    required: true
    description: Resource ID segment making up resource `name`. It identifies the resource within its parent collection as described in https://google.aip.dev/122.
    immutable: true
    url_param_only: true
  - name: databaseConnectionId
    type: String
    required: true
    description: |-
      The ID of the DatabaseConnection to create. This value is restricted
      to (^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$) and must be a maximum of 63
      characters in length. The value must start with a letter and end with
      a letter or a number.
    immutable: true
    url_param_only: true
properties:
  - name: connectionString
    type: String
    required: true
    description: |-
      Oracle Easy Connect or TNS connection string.
      Example: "your-db-host.example.com:1521/YOUR_SERVICE_NAME"
    immutable: true
  - name: createTime
    type: String
    description: The create time of the resource.
    output: true
  - name: displayName
    type: String
    description: User-friendly display name for the connection.
    immutable: true
  - name: labels
    type: KeyValueLabels
    description: 'Optional: Labels as key-value pairs to organize the resource.'
  - name: lifecycleDetails
    type: String
    description: Additional information about the current state of the connection.
    output: true
  - name: name
    type: String
    description: |-
      Identifier. The resource name of the DatabaseConnection.
      Format:
      projects/{project}/locations/{location}/databaseConnections/{database_connection}
    output: true
  - name: odbNetwork
    type: String
    description: |-
      For Oracle Database@Google cloud resources.
      Format: projects/{project}/locations/{location}/odbNetworks/{odbNetwork}
    immutable: true
  - name: passwordSecretVersion
    type: String
    description: |-
      The resource name of the GCP Secret Manager secret version
      containing the password for the specified username.
      Format: projects/{project}/secrets/{secret_id}/versions/{version_id}
      The service's Per-Product Per-Project Service Account (P4SA)
      must have the 'secretmanager.secretAccessor' permission on this secret.
  - name: state
    type: String
    description: |-
      The current state of the connection.
      Possible values:
      CREATING
      ACTIVE
      FAILED
      DELETING
    output: true
  - name: updateTime
    type: String
    description: The update time of the resource.
    output: true
  - name: username
    type: String
    description: The default database username to use for connections.
    immutable: true
  - name: walletSecretVersion
    type: String
    description: |-
      Optional: The resource name of the GCP Secret Manager secret version
      containing base64 encoded content of the Oracle Wallet ZIP file required
      for mTLS/TLS connections. Format:
      projects/{project}/secrets/{secret_id}/versions/{version_id} The
      service's Per-Product Per-Project Service Account (P4SA) must have the
      'secretmanager.secretAccessor' permission on this secret.
