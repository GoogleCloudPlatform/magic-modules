---
name: EvaluationSet
description: |
  An EvaluationSet is a collection of related EvaluationItems that are evaluated together
  in Vertex AI.
references:
  guides:
    'Official Documentation': 'https://cloud.google.com/vertex-ai/generative-ai/docs/models/evaluation-overview'
  api: 'https://cloud.google.com/vertex-ai/docs/reference/rest/v1/projects.locations.evaluationSets'
docs:
base_url: projects/{{project}}/locations/{{region}}/evaluationSets
self_link: projects/{{project}}/locations/{{region}}/evaluationSets/{{name}}
create_url: projects/{{project}}/locations/{{region}}/evaluationSets
id_format: projects/{{project}}/locations/{{region}}/evaluationSets/{{name}}
import_format:
  - projects/{{project}}/locations/{{region}}/evaluationSets/{{name}}
update_verb: PATCH
update_mask: true
generate_list_resource: true
sweeper:
  identifier_field: displayName
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: ['delete']
custom_code:
samples:
  - name: vertex_ai_evaluation_set
    primary_resource_id: evaluation_set
    steps:
      - name: vertex_ai_evaluation_set
        resource_id_vars:
          display_name: eval-set
          item_display_name: eval-item

parameters:
  - name: region
    type: String
    description: The region of the EvaluationSet. eg us-central1
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: name
    type: String
    description: |
      The short name of the EvaluationSet (the final component of the resource name).
    output: true
    custom_flatten: templates/terraform/custom_flatten/name_from_self_link.tmpl
  - name: displayName
    type: String
    description: |
      The user-friendly display name for the EvaluationSet.
    required: true
    immutable: true
  - name: evaluationItems
    type: Array
    description: |
      The EvaluationItems that are part of this EvaluationSet.
      Format: `projects/{project}/locations/{location}/evaluationItems/{evaluationItem}`.
    required: true
    diff_suppress_func: 'tpgresource.CompareResourceNames'
    item_type:
      type: String
  - name: metadata
    type: String
    description: |
      User-defined metadata for this EvaluationSet as a JSON string.
    immutable: true
    state_func: 'func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }'
    custom_flatten: templates/terraform/custom_flatten/json_schema.tmpl
    custom_expand: templates/terraform/custom_expand/json_value.tmpl
    validation:
      function: validation.StringIsJSON
  - name: createTime
    type: String
    description: |
      The timestamp of when the EvaluationSet was created in RFC3339 UTC "Zulu" format,
      with nanosecond resolution and up to nine fractional digits.
    output: true
  - name: updateTime
    type: String
    description: |
      The timestamp of when the EvaluationSet was last updated in RFC3339 UTC "Zulu" format,
      with nanosecond resolution and up to nine fractional digits.
    output: true
