---
name: EvaluationSet
description: |
  An EvaluationSet is a collection of related EvaluationItems that are evaluated together
  in Vertex AI.
references:
  guides:
    'Official Documentation': 'https://cloud.google.com/vertex-ai/generative-ai/docs/evaluation/overview'
  api: 'https://cloud.google.com/vertex-ai/docs/reference/rest/v1/projects.locations.evaluationSets'
docs:
base_url: projects/{{project}}/locations/{{region}}/evaluationSets
self_link: projects/{{project}}/locations/{{region}}/evaluationSets/{{name}}
create_url: projects/{{project}}/locations/{{region}}/evaluationSets
id_format: projects/{{project}}/locations/{{region}}/evaluationSets/{{name}}
import_format:
  - projects/{{project}}/locations/{{region}}/evaluationSets/{{name}}
update_verb: PATCH
update_mask: true
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: ['delete']
custom_code:
samples:
  - name: vertex_ai_evaluation_set
    primary_resource_id: example
    exclude_test: true
    steps:
      - name: vertex_ai_evaluation_set
  - name: vertex_ai_evaluation_set_encryption
    primary_resource_id: example
    exclude_test: true
    steps:
      - name: vertex_ai_evaluation_set_encryption
parameters:
  - name: region
    type: String
    description: The region of the EvaluationSet. eg us-central1
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: name
    type: String
    description: |
      The short name of the EvaluationSet (the final component of the resource name).
    output: true
    custom_flatten: templates/terraform/custom_flatten/name_from_self_link.tmpl
  - name: displayName
    type: String
    description: |
      The user-friendly display name for the EvaluationSet.
    required: true
    immutable: true
  - name: evaluationItems
    type: Array
    description: |
      The EvaluationItems that are part of this dataset.
      Format: `projects/{project}/locations/{location}/evaluationItems/{evaluationItem}`.
    required: true
    item_type:
      type: String
  - name: createTime
    type: String
    description: |
      The timestamp of when the EvaluationSet was created in RFC3339 UTC "Zulu" format,
      with nanosecond resolution and up to nine fractional digits.
    output: true
  - name: updateTime
    type: String
    description: |
      The timestamp of when the EvaluationSet was last updated in RFC3339 UTC "Zulu" format,
      with nanosecond resolution and up to nine fractional digits.
    output: true
  - name: encryptionSpec
    type: NestedObject
    description: |
      Customer-managed encryption key spec for this EvaluationSet. If set,
      this EvaluationSet and its sub-resources will be secured by this key.
    immutable: true
    properties:
      - name: kmsKeyName
        type: String
        description: |
          Required. The Cloud KMS resource identifier of the customer managed encryption key
          used to protect a resource. Has the form:
          `projects/my-project/locations/my-region/keyRings/my-kr/cryptoKeys/my-key`.
          The key needs to be in the same region as where the resource is created.
        immutable: true
