---
name: 'PipelineJob'
description: |
  An instance of a machine learning PipelineJob. A PipelineJob runs a pipeline
  created using Kubeflow Pipelines or Vertex AI Pipelines.
references:
  guides:
    'Introduction to Vertex AI Pipelines': 'https://cloud.google.com/vertex-ai/docs/pipelines/introduction'
  api: 'https://cloud.google.com/vertex-ai/docs/reference/rest/v1/projects.locations.pipelineJobs'
base_url: 'projects/{{project}}/locations/{{region}}/pipelineJobs'
self_link: 'projects/{{project}}/locations/{{region}}/pipelineJobs/{{name}}'
create_url: 'projects/{{project}}/locations/{{region}}/pipelineJobs?pipelineJobId={{pipeline_job_id}}'
id_format: 'projects/{{project}}/locations/{{region}}/pipelineJobs/{{name}}'
import_format:
  - 'projects/{{project}}/locations/{{region}}/pipelineJobs/{{name}}'
immutable: true
deletion_policy_custom_docs: true
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
async:
  actions: ['delete']
  type: 'OpAsync'
  operation:
    base_url: '{{op_id}}'
  result:
    resource_inside_response: false
custom_code:
  constants: 'templates/terraform/constants/vertex_ai_pipeline_job.go.tmpl'
  pre_delete: 'templates/terraform/pre_delete/vertex_ai_pipeline_job.go.tmpl'
samples:
  - name: 'vertex_ai_pipeline_job_basic'
    primary_resource_id: 'pipeline_job'
    steps:
      - name: 'vertex_ai_pipeline_job_basic'
        resource_id_vars:
          pipeline_job_id: 'example-pipeline-job'
          storage_bucket: 'example-pipeline-bucket'
        ignore_read_extra:
          - 'deletion_policy'
          - 'end_time'
          - 'error'
          - 'job_detail'
          - 'pipeline_spec'
          - 'start_time'
          - 'state'
          - 'update_time'
  - name: 'vertex_ai_pipeline_job_full'
    primary_resource_id: 'pipeline_job'
    bootstrap_iam:
      - member: 'serviceAccount:service-{project_number}@gcp-sa-aiplatform.iam.gserviceaccount.com'
        role: 'roles/cloudkms.cryptoKeyEncrypterDecrypter'
      - member: 'serviceAccount:service-{project_number}@gcp-sa-aiplatform.iam.gserviceaccount.com'
        role: 'roles/compute.networkAdmin'
      - member: 'serviceAccount:service-{project_number}@gcp-sa-aiplatform.iam.gserviceaccount.com'
        role: 'roles/dns.peer'
    steps:
      - name: 'vertex_ai_pipeline_job_full'
        resource_id_vars:
          pipeline_job_id: 'example-pipeline-job-full'
          storage_bucket: 'example-pipeline-bucket-full'
          network_name: 'vertex-pipeline-network'
          address_name: 'vertex-pipeline-ip-range'
          network_attachment_name: 'psc-pipeline-attachment'
          subnetwork_name: 'psc-pipeline-subnetwork'
          kms_key_name: 'example-key'
        test_vars_overrides:
          kms_key_name: 'kms.BootstrapKMSKeyInLocation(t, "us-central1").CryptoKey.Name'
        ignore_read_extra:
          - 'deletion_policy'
          - 'end_time'
          - 'error'
          - 'job_detail'
          - 'pipeline_spec'
          - 'start_time'
          - 'state'
          - 'update_time'
  - name: 'vertex_ai_pipeline_job_persistent_resource'
    primary_resource_id: 'pipeline_job'
    min_version: 'beta'
    steps:
      - name: 'vertex_ai_pipeline_job_persistent_resource'
        min_version: 'beta'
        resource_id_vars:
          pipeline_job_id: 'example-pipeline-job-pr'
          persistent_resource_id: 'example-persistent-resource'
          storage_bucket: 'example-pipeline-bucket-pr'
        ignore_read_extra:
          - 'deletion_policy'
          - 'end_time'
          - 'error'
          - 'job_detail'
          - 'pipeline_spec'
          - 'start_time'
          - 'state'
          - 'update_time'
virtual_fields:
  - name: 'deletion_policy'
    description: |
      The deletion policy for the pipeline job. Setting `FORCE` will cancel the pipeline
      job if it is in an active state before deleting it. Defaults to `DELETE`.

      When a 'terraform destroy' or 'terraform apply' would delete the resource,
      the command will fail if this field is set to "PREVENT" in Terraform state.
      When set to "ABANDON", the command will remove the resource from Terraform
      management without updating or deleting the resource in the API.
      When set to "DELETE", Terraform will attempt to delete the pipeline job without
      cancelling it first, which will fail if the pipeline job is still in an active state.
    type: String
    exclude: true
parameters:
  - name: 'region'
    type: String
    description: |
      The region of the pipeline job. eg us-central1
    immutable: true
    url_param_only: true
  - name: 'pipelineJobId'
    type: String
    description: |
      The ID to use for the PipelineJob, which will become the final component of the PipelineJob name. If not provided, an ID will be automatically generated.
      This value should be less than 128 characters, and valid characters are `/[a-z][0-9]-/`.
    immutable: true
    url_param_only: true
properties:
  - name: 'name'
    type: String
    description: |
      The resource name of the PipelineJob. This is the final component of the resource path.
    output: true
    custom_flatten: 'templates/terraform/custom_flatten/name_from_self_link.tmpl'
  - name: 'displayName'
    type: String
    description: |
      The display name of the Pipeline. The name can be up to 128 characters long and can consist of any UTF-8 characters.
  - name: 'createTime'
    type: String
    description: |
      Pipeline creation time in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine fractional digits.
    output: true
  - name: 'startTime'
    type: String
    description: |
      Pipeline start time in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine fractional digits.
    output: true
  - name: 'endTime'
    type: String
    description: |
      Pipeline end time in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine fractional digits.
    output: true
  - name: 'updateTime'
    type: String
    description: |
      Timestamp when this PipelineJob was most recently updated in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine fractional digits.
    output: true
  - name: 'pipelineSpec'
    type: String
    description: |
      The spec of the pipeline. This is a JSON object that describes the pipeline.
    default_from_api: true
    state_func: 'func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }'
    diff_suppress_func: 'vertexAIPipelineJobPipelineSpecDiffSuppress'
    custom_flatten: 'templates/terraform/custom_flatten/json_schema.tmpl'
    custom_expand: 'templates/terraform/custom_expand/json_value.tmpl'
    validation:
      function: 'validation.StringIsJSON'
  - name: 'state'
    type: String
    description: |
      The detailed state of the job.
    output: true
  - name: 'templateUri'
    type: String
    description: |
      A template uri from where the PipelineJob.pipeline_spec, if empty, will be downloaded. Currently, only uri from Vertex Template Registry & Gallery is supported.
  - name: 'templateMetadata'
    type: NestedObject
    description: |
      Pipeline template metadata. Will fill up fields if PipelineJob.template_uri is from supported template registry.
    output: true
    properties:
      - name: 'version'
        type: String
        description: |
          The version_name in artifact registry.
        output: true
  - name: 'scheduleName'
    type: String
    description: |
      The schedule resource name. Only returned if the Pipeline is created by Schedule API.
    output: true
  - name: 'preflightValidations'
    type: Boolean
    description: |
      Whether to do component level validations before job creation.
    ignore_read: true
    send_empty_value: true
  - name: 'serviceAccount'
    type: String
    description: |
      The service account that the pipeline workload runs as. If not specified, the Compute Engine default service account in the project will be used. Users starting the pipeline must have the iam.serviceAccounts.actAs permission on this service account.
    default_from_api: true
  - name: 'network'
    type: String
    description: |
      The full name of the Compute Engine network to which the Pipeline Job's workload should be peered. For example, `projects/12345/global/networks/myVPC`. Format is of the form `projects/{project}/global/networks/{network}`. Where `{project}` is a project number, as in `12345`, and `{network}` is a network name. Private services access must already be configured for the network. Pipeline job will apply the network configuration to the Google Cloud resources being launched, if applied, such as Vertex AI Training or Dataflow job. If left unspecified, the workload is not peered with any network.
  - name: 'reservedIpRanges'
    type: Array
    description: |
      A list of names for the reserved ip ranges under the VPC network that can be used for this Pipeline Job's workload. If set, we will deploy the Pipeline Job's workload within the provided ip ranges. Otherwise, the job will be deployed to any ip ranges under the provided VPC network.
    item_type:
      type: String
  - name: 'pscInterfaceConfig'
    type: NestedObject
    description: |
      Configuration for PSC-I for PipelineJob.
    properties:
      - name: 'networkAttachment'
        type: String
        description: |
          The name of the Compute Engine network attachment to attach to the resource within the region and user project. To specify this field, you must have already created a network attachment. This field is only used for resources using PSC-I.
      - name: 'dnsPeeringConfigs'
        type: Array
        description: |
          DNS peering configurations. When specified, Vertex AI will attempt to configure DNS peering zones in the tenant project VPC to resolve the specified domains using the target network's Cloud DNS. The user must grant the dns.peer role to the Vertex AI Service Agent on the target project.
        item_type:
          type: NestedObject
          properties:
            - name: 'domain'
              type: String
              required: true
              description: |
                The DNS name suffix of the zone being peered to, e.g., "my-internal-domain.corp.". Must end with a dot.
            - name: 'targetProject'
              type: String
              required: true
              description: |
                The project ID hosting the Cloud DNS managed zone that contains the above domain. The Vertex AI Service Agent must be granted the dns.peer role on this project.
            - name: 'targetNetwork'
              type: String
              required: true
              description: |
                The VPC network name in the targetProject where the DNS zone specified by domain is visible.
  - name: 'encryptionSpec'
    type: NestedObject
    description: |
      Customer-managed encryption key options for a pipelineJob. If set, this PipelineJob and all of its sub-resources will be secured by this key.
    properties:
      - name: 'kmsKeyName'
        type: String
        required: true
        description: |
          The Cloud KMS resource identifier of the customer managed encryption key used to protect a resource. Has the form: `projects/my-project/locations/my-region/keyRings/my-kr/cryptoKeys/my-key`. The key needs to be in the same region as where the compute resource is created.
  - name: 'labels'
    type: KeyValueLabels
    description: |
      The labels with user-defined metadata to organize PipelineJob.
  - name: 'runtimeConfig'
    type: NestedObject
    description: |
      Runtime config of the pipeline.
    properties:
      - name: 'gcsOutputDirectory'
        type: String
        required: true
        description: |
          A path in a Cloud Storage bucket, which will be treated as the root output directory of the pipeline. It is used by the system to generate the paths of output artifacts. The artifact paths are generated with a sub-directory pattern `{job_id}/{task_id}/{output_key}` under the specified output directory. The service account specified in this pipeline must have the `storage.objects.get` and `storage.objects.create` permissions for this bucket.
      - name: 'parameterValues'
        type: KeyValuePairs
        default_from_api: true
        description: |
          The runtime parameters of the PipelineJob. The parameters will be passed into PipelineJob.pipeline_spec to replace the placeholders at runtime. This field is used by pipelines built using `PipelineJob.pipeline_spec.schema_version` 2.1.0, such as pipelines built using Kubeflow Pipelines SDK 1.9 or higher and the v2 DSL.
      - name: 'failurePolicy'
        type: String
        default_from_api: true
        description: |
          Represents the failure policy of a pipeline. Currently, the default of a pipeline is that the pipeline will continue to run until no more tasks can be executed, also known as `PIPELINE_FAILURE_POLICY_FAIL_SLOW`. However, if a pipeline is set to `PIPELINE_FAILURE_POLICY_FAIL_FAST`, it will stop scheduling any new tasks as soon as the pipeline fails.
          Possible values are: `PIPELINE_FAILURE_POLICY_UNSPECIFIED`, `PIPELINE_FAILURE_POLICY_FAIL_SLOW`, `PIPELINE_FAILURE_POLICY_FAIL_FAST`.
      - name: 'inputArtifacts'
        type: Map
        description: |
          The runtime artifacts of the PipelineJob. The key will be the input artifact name and the value would be one of the InputArtifact.
        key_name: 'artifact_key'
        value_type:
          type: NestedObject
          properties:
            - name: 'artifactId'
              type: String
              required: true
              description: |
                Artifact resource id from MLMD. Which is the last portion of an artifact resource name: `projects/{project}/locations/{location}/metadataStores/default/artifacts/{artifact_id}`. The artifact must be within the same project, location and default metadatastore as the pipeline.
      - name: 'defaultRuntime'
        min_version: 'beta'
        type: NestedObject
        description: |
          The default runtime for the PipelineJob.
        properties:
          - name: 'persistentResourceRuntimeDetail'
            min_version: 'beta'
            type: NestedObject
            description: |
              Persistent resource based runtime detail.
            properties:
              - name: 'persistentResourceName'
                min_version: 'beta'
                type: String
                description: |
                  PersistentResource name, format: `projects/{project}/locations/{location}/persistentResources/{persistent_resource}`.
              - name: 'taskResourceUnavailableWaitTimeMs'
                min_version: 'beta'
                type: String
                description: |
                  The maxWaitTime for the task if the persistent resource is unavailable.
              - name: 'taskResourceUnavailableTimeoutBehavior'
                min_version: 'beta'
                type: String
                default_from_api: true
                description: |
                  Sets the behavior when a task has reached the defined wait duration while waiting for task resources to become available in the specified persistent resource.
                  Possible values are: `TASK_RESOURCE_UNAVAILABLE_TIMEOUT_BEHAVIOR_UNSPECIFIED`, `FAIL`, `FALL_BACK_TO_ON_DEMAND`.
  - name: 'error'
    type: NestedObject
    description: |
      The error that occurred during pipeline execution. Only populated when the pipeline's state is FAILED or CANCELLED.
    output: true
    properties:
      - name: 'code'
        type: Integer
        description: |
          The status code, which should be an enum value of google.rpc.Code.
        output: true
      - name: 'message'
        type: String
        description: |
          A developer-facing error message, which should be in English.
        output: true
      - name: 'details'
        type: Array
        description: |
          A list of messages that carry the error details.
        output: true
        item_type:
          type: KeyValuePairs
  - name: 'jobDetail'
    type: NestedObject
    description: |
      The details of pipeline run. Not available in the list view.
    output: true
    properties:
      - name: 'pipelineContext'
        type: NestedObject
        description: |
          The context of the pipeline.
        output: true
        properties:
          - name: 'name'
            type: String
            description: |
              The resource name of the Context.
            output: true
          - name: 'displayName'
            type: String
            description: |
              User provided display name of the Context. May be up to 128 Unicode characters.
            output: true
          - name: 'etag'
            type: String
            description: |
              An eTag used to perform consistent read-modify-write updates.
            output: true
          - name: 'metadata'
            type: String
            description: |
              Properties of the Context.
            output: true
            custom_flatten: 'templates/terraform/custom_flatten/json_schema.tmpl'
          - name: 'createTime'
            type: String
            description: |
              Timestamp when this Context was created.
            output: true
          - name: 'updateTime'
            type: String
            description: |
              Timestamp when this Context was last updated.
            output: true
          - name: 'parentContexts'
            type: Array
            description: |
              A list of resource names of Contexts that are parents of this Context.
            output: true
            item_type:
              type: String
          - name: 'schemaTitle'
            type: String
            description: |
              The title of the schema describing the metadata.
            output: true
          - name: 'schemaVersion'
            type: String
            description: |
              The version of the schema in schema_name to use.
            output: true
          - name: 'labels'
            type: KeyValuePairs
            description: |
              The labels with user-defined metadata to organize your Contexts.
            output: true
          - name: 'description'
            type: String
            description: |
              Description of the Context.
            output: true
      - name: 'pipelineRunContext'
        type: NestedObject
        description: |
          The context of the current pipeline run.
        output: true
        properties:
          - name: 'name'
            type: String
            description: |
              The resource name of the Context.
            output: true
          - name: 'displayName'
            type: String
            description: |
              User provided display name of the Context. May be up to 128 Unicode characters.
            output: true
          - name: 'etag'
            type: String
            description: |
              An eTag used to perform consistent read-modify-write updates.
            output: true
          - name: 'metadata'
            type: String
            description: |
              Properties of the Context.
            output: true
            custom_flatten: 'templates/terraform/custom_flatten/json_schema.tmpl'
          - name: 'createTime'
            type: String
            description: |
              Timestamp when this Context was created.
            output: true
          - name: 'updateTime'
            type: String
            description: |
              Timestamp when this Context was last updated.
            output: true
          - name: 'parentContexts'
            type: Array
            description: |
              A list of resource names of Contexts that are parents of this Context.
            output: true
            item_type:
              type: String
          - name: 'schemaTitle'
            type: String
            description: |
              The title of the schema describing the metadata.
            output: true
          - name: 'schemaVersion'
            type: String
            description: |
              The version of the schema in schema_name to use.
            output: true
          - name: 'labels'
            type: KeyValuePairs
            description: |
              The labels with user-defined metadata to organize your Contexts.
            output: true
          - name: 'description'
            type: String
            description: |
              Description of the Context.
            output: true
      - name: 'taskDetails'
        type: Array
        description: |
          The runtime details of the tasks under the pipeline.
        output: true
        item_type:
          type: NestedObject
          properties:
            - name: 'taskId'
              type: String
              description: |
                The system generated ID of the task.
              output: true
            - name: 'parentTaskId'
              type: String
              description: |
                The id of the parent task if the task is within a component scope. Empty if the task is at the root level.
              output: true
            - name: 'taskName'
              type: String
              description: |
                The user specified name of the task that is defined in pipeline_spec.
              output: true
            - name: 'createTime'
              type: String
              description: |
                Task create time.
              output: true
            - name: 'startTime'
              type: String
              description: |
                Task start time.
              output: true
            - name: 'endTime'
              type: String
              description: |
                Task end time.
              output: true
            - name: 'state'
              type: String
              description: |
                The detailed state of the task.
              output: true
            - name: 'taskUniqueName'
              type: String
              description: |
                The unique name of a task.
              output: true
            - name: 'error'
              type: NestedObject
              description: |
                The error that occurred during task execution. Only populated when the task's state is FAILED or CANCELLED.
              output: true
              properties:
                - name: 'code'
                  type: Integer
                  description: |
                    The status code, which should be an enum value of google.rpc.Code.
                  output: true
                - name: 'message'
                  type: String
                  description: |
                    A developer-facing error message, which should be in English.
                  output: true
