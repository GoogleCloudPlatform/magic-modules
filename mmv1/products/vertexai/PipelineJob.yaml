---
name: PipelineJob
description: An instance of a machine learning PipelineJob in Vertex AI.
references:
  guides:
    Official Documentation: https://cloud.google.com/vertex-ai/docs/pipelines
  api: https://cloud.google.com/vertex-ai/docs/reference/rest/v1/projects.locations.pipelineJobs
docs:
base_url: projects/{{project}}/locations/{{region}}/pipelineJobs
self_link: projects/{{project}}/locations/{{region}}/pipelineJobs/{{name}}
create_url: projects/{{project}}/locations/{{region}}/pipelineJobs?pipelineJobId={{pipeline_job_id}}
id_format: projects/{{project}}/locations/{{region}}/pipelineJobs/{{name}}
import_format:
  - projects/{{project}}/locations/{{region}}/pipelineJobs/{{name}}
timeouts:
  insert_minutes: 30
  delete_minutes: 30
immutable: true
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: [delete]
  result:
    resource_inside_response: true
custom_code:
  pre_delete: templates/terraform/pre_delete/vertex_ai_pipeline_job.go.tmpl
samples:
  - name: vertex_ai_pipeline_job_basic
    primary_resource_id: pipeline_job
    steps:
      - name: vertex_ai_pipeline_job_basic
        resource_id_vars:
          pipeline_job_id: example-pipeline-job
          storage_bucket: example-bucket
        ignore_read_extra:
          - start_time
          - end_time
          - state
          - update_time
parameters:
  - name: region
    type: String
    description: The region of the PipelineJob. eg us-central1
    url_param_only: true
    immutable: true
    default_from_api: true
  - name: pipelineJobId
    type: String
    description: |-
      The ID to use for the PipelineJob, which will become the final component of the PipelineJob's resource name. If not provided, the server will generate a unique ID.
    url_param_only: true
    immutable: true
properties:
  - name: name
    type: String
    description: The short name of the PipelineJob (the final component of the resource name).
    output: true
    custom_flatten: templates/terraform/custom_flatten/name_from_self_link.tmpl
  - name: displayName
    type: String
    description: The display name of the Pipeline. The name can be up to 128 characters long and can consist of any UTF-8 characters.
    immutable: true
  - name: pipelineSpec
    type: String
    description: |-
      A compiled definition of a pipeline, represented as a JSON object. Defines the structure of the pipeline, including its components, tasks, and parameters. This specification is generated by compiling a pipeline function defined in Python using the Kubeflow Pipelines SDK.
    custom_expand: templates/terraform/custom_expand/json_value.tmpl
    custom_flatten: templates/terraform/custom_flatten/json_schema.tmpl
    validation:
      function: validation.StringIsJSON
    immutable: true
    ignore_read: true
  - name: templateUri
    type: String
    description: A template uri from where the PipelineJob.pipeline_spec, if empty, will be downloaded. Currently, only uri from Vertex Template Registry & Gallery is supported. Reference to https://cloud.google.com/vertex-ai/docs/pipelines/create-pipeline-template.
    immutable: true
  - name: runtimeConfig
    type: NestedObject
    description: Runtime configuration for the pipeline job.
    immutable: true
    properties:
      - name: gcsOutputDirectory
        type: String
        required: true
        description: |-
          A path in a Cloud Storage bucket, which will be treated as the root output directory of the pipeline. It is used by the system to generate the paths of output artifacts. The artifact paths are generated with a sub-path pattern `{job_id}/{task_id}/{output_key}` under the specified output directory. The service account specified in this pipeline must have the `storage.objects.get` and `storage.objects.create` permissions for this bucket.
        immutable: true
      - name: parameterValues
        type: KeyValuePairs
        description: |-
          The runtime parameters of the PipelineJob. The parameters will be passed into PipelineJob.pipeline_spec to replace the placeholders at runtime. This field is used by pipelines built using `PipelineJob.pipeline_spec.schema_version` 2.1.0, such as pipelines built using Kubeflow Pipelines SDK 1.9 or higher and the v2 DSL.
        custom_flatten: templates/terraform/custom_flatten/json_to_string_map.go.tmpl
        immutable: true
      - name: failurePolicy
        type: String
        description: 'Possible values: PIPELINE_FAILURE_POLICY_FAIL_SLOW PIPELINE_FAILURE_POLICY_FAIL_FAST'
        immutable: true
      - name: inputArtifacts
        type: Map
        key_name: key
        description: |-
          The runtime artifacts of the PipelineJob. The key will be the input
          artifact name and the value would be one of the InputArtifact.
        value_type:
          type: NestedObject
          properties:
            - name: artifactId
              type: String
              description: |-
                Artifact resource id from MLMD. Which is the last portion of an artifact resource name:
                `projects/{project}/locations/{location}/metadataStores/default/artifacts/{artifact_id}`.
                The artifact must stay within the same project, location and default metadatastore as the pipeline.
        immutable: true
  - name: serviceAccount
    type: String
    description: The service account that the pipeline workload runs as. If not specified, the Compute Engine default service account in the project will be used. See https://cloud.google.com/compute/docs/access/service-accounts#default_service_account Users starting the pipeline must have the `iam.serviceAccounts.actAs` permission on this service account.
    immutable: true
    default_from_api: true
  - name: network
    type: String
    description: |-
      The full name of the Compute Engine network to which the Pipeline Job's workload should be peered. For example, `projects/12345/global/networks/myVPC`. Format is of the form `projects/{project}/global/networks/{network}`. Where {project} is a project number, as in `12345`, and {network} is a network name. Private services access must already be configured for the network. Pipeline job will apply the network configuration to the Google Cloud resources being launched, if applied, such as Vertex AI Training or Dataflow job. If left unspecified, the workload is not peered with any network.
    immutable: true
  - name: reservedIpRanges
    type: Array
    description: |-
      A list of names for the reserved ip ranges under the VPC network that can be used for this Pipeline Job's workload. If set, we will deploy the Pipeline Job's workload within the provided ip ranges. Otherwise, the job will be deployed to any ip ranges under the provided VPC network. Example: ['vertex-ai-ip-range'].
    item_type:
      type: String
    immutable: true
    default_from_api: true
  - name: pscInterfaceConfig
    type: NestedObject
    description: Configuration for PSC-I.
    immutable: true
    properties:
      - name: networkAttachment
        type: String
        description: |-
          The name of the Compute Engine network attachment to attach to the resource within the region and user project. To specify this field, you must have already created a network attachment. This field is only used for resources using PSC-I.
        immutable: true
      - name: dnsPeeringConfigs
        type: Array
        description: |-
          DNS peering configurations. When specified, Vertex AI will attempt to configure DNS peering zones in the tenant project VPC to resolve the specified domains using the target network's Cloud DNS. The user must grant the dns.peer role to the Vertex AI Service Agent on the target project.
        item_type:
          type: NestedObject
          properties:
            - name: domain
              type: String
              description: 'The DNS name suffix of the zone being peered to, e.g., "my-internal-domain.corp.". Must end with a dot.'
              required: true
              immutable: true
            - name: targetNetwork
              type: String
              description: The VPC network name in the target_project where the DNS zone specified by 'domain' is visible.
              required: true
              immutable: true
            - name: targetProject
              type: String
              description: The project ID hosting the Cloud DNS managed zone that contains the 'domain'. The Vertex AI Service Agent requires the dns.peer role on this project.
              required: true
              immutable: true
        immutable: true
  - name: encryptionSpec
    type: NestedObject
    description: Represents a customer-managed encryption key specification that can be applied to a Vertex AI resource.
    immutable: true
    properties:
      - name: kmsKeyName
        type: String
        description: |-
          Resource name of the Cloud KMS key used to protect the resource. The Cloud KMS key must be in the same region as the resource. It must have the format `projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{crypto_key}`.
        required: true
        immutable: true
  - name: preflightValidations
    type: Boolean
    description: Whether to do component level validations before job creation.
    immutable: true
    ignore_read: true
    send_empty_value: true
  - name: labels
    type: KeyValueLabels
    description: |-
      The labels with user-defined metadata to organize PipelineJob. Label keys and values can be no longer than 64 characters (Unicode codepoints), can only contain lowercase letters, numeric characters, underscores and dashes. International characters are allowed. See https://goo.gl/xmQnxf for more information and examples of labels. Note there is some reserved label key for Vertex AI Pipelines. - `vertex-ai-pipelines-run-billing-id`, user set value will get overrided.
  - name: state
    type: String
    description: 'Possible values: PIPELINE_STATE_QUEUED PIPELINE_STATE_PENDING PIPELINE_STATE_RUNNING PIPELINE_STATE_SUCCEEDED PIPELINE_STATE_FAILED PIPELINE_STATE_CANCELLING PIPELINE_STATE_CANCELLED PIPELINE_STATE_PAUSED'
    output: true
  - name: error
    type: NestedObject
    description: The Status type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs.
    output: true
    properties:
      - name: code
        type: Integer
        description: The status code, which should be an enum value of google.rpc.Code.
        output: true
      - name: message
        type: String
        description: A developer-facing error message, which should be in English.
        output: true
  - name: createTime
    type: String
    description: Pipeline creation time.
    output: true
  - name: startTime
    type: String
    description: Pipeline start time.
    output: true
  - name: endTime
    type: String
    description: Pipeline end time.
    output: true
  - name: updateTime
    type: String
    description: Timestamp when this PipelineJob was most recently updated.
    output: true
  - name: scheduleName
    type: String
    description: The schedule resource name. Only returned if the Pipeline is created by Schedule API.
    output: true
  - name: templateMetadata
    type: NestedObject
    description: Pipeline template metadata if PipelineJob.template_uri is from supported template registry.
    output: true
    properties:
      - name: version
        type: String
        description: 'The version_name in artifact registry. Format is "sha256:abcdef123456...".'
        output: true
