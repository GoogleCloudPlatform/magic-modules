---
name: 'RagCorpus'
description: |-
  A RAG corpus is a container for user data uploaded to Vertex AI RAG Engine for chunking, embedding, and indexing.
references:
  guides:
    'Manage your RAG corpus': 'https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/rag-engine/manage-your-rag-corpus'
  api: 'https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1/projects.locations.ragCorpora'
base_url: 'projects/{{project}}/locations/{{region}}/ragCorpora'
self_link: 'projects/{{project}}/locations/{{region}}/ragCorpora/{{name}}'
create_url: 'projects/{{project}}/locations/{{region}}/ragCorpora'
update_verb: 'PATCH'
update_mask: false
generate_list_resource: true
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: ['create', 'delete', 'update']
  result:
    resource_inside_response: true
samples:
  - name: 'vertex_ai_rag_corpus_basic'
    primary_resource_id: 'example'
    steps:
      - name: 'vertex_ai_rag_corpus_basic'
        resource_id_vars:
          display_name: 'rag-corpus'
  - name: 'vertex_ai_rag_corpus_full'
    primary_resource_id: 'example'
    bootstrap_iam:
      - member: "serviceAccount:service-{project_number}@gcp-sa-vertex-rag.iam.gserviceaccount.com"
        role: "roles/cloudkms.cryptoKeyEncrypterDecrypter"
    steps:
      - name: 'vertex_ai_rag_corpus_full'
        resource_id_vars:
          display_name: 'rag-corpus-full'
          kms_key_name: 'kms-key'
        test_vars_overrides:
          kms_key_name: 'kms.BootstrapKMSKeyInLocation(t, "europe-west4").CryptoKey.Name'
parameters:
  - name: 'region'
    type: String
    description: The region of the RagCorpus. eg europe-west4
    url_param_only: true
    immutable: true
properties:
  - name: 'name'
    type: String
    description: |-
      The generated name of the RagCorpus, in the format
      projects/{project}/locations/{location}/ragCorpora/{rag_corpus}.
    output: true
    custom_flatten: 'templates/terraform/custom_flatten/name_from_self_link.tmpl'
  - name: 'displayName'
    type: String
    description: |-
      Required. The display name of the RagCorpus. The name can be up to 128
      characters long and can consist of any UTF-8 characters.
    required: true
  - name: 'description'
    type: String
    description: Optional. The description of the RagCorpus.
  - name: 'createTime'
    type: String
    description: |-
      Output only. Timestamp when this RagCorpus was created.
    output: true
  - name: 'updateTime'
    type: String
    description: |-
      Output only. Timestamp when this RagCorpus was last updated.
    output: true
  - name: 'corpusStatus'
    type: NestedObject
    description: Output only. RagCorpus state.
    output: true
    properties:
      - name: 'state'
        type: String
        description: Output only. RagCorpus life state.
        output: true
      - name: 'errorStatus'
        type: String
        description: Output only. Only populated when the state is ERROR.
        output: true
  - name: 'vectorDbConfig'
    type: NestedObject
    description: Optional. Immutable. The config for the RAG-managed Vector DB.
    immutable: true
    properties:
      - name: 'ragManagedDb'
        type: NestedObject
        description: The config for the default RAG-managed Vector DB.
        allow_empty_object: true
        send_empty_value: true
        properties:
          - name: 'knn'
            type: NestedObject
            description: Performs a KNN search on RagCorpus. This is the default choice if not specified.
            exactly_one_of:
              - vector_db_config.0.rag_managed_db.0.knn
              - vector_db_config.0.rag_managed_db.0.ann
            allow_empty_object: true
            send_empty_value: true
            properties: []
          - name: 'ann'
            type: NestedObject
            description: Performs an ANN search on RagCorpus.
            exactly_one_of:
              - vector_db_config.0.rag_managed_db.0.knn
              - vector_db_config.0.rag_managed_db.0.ann
            properties:
              - name: 'treeDepth'
                type: Integer
                description: The depth of the tree-based structure. Only depth values of 2 and 3 are supported. Default value is 2.
                default_from_api: true
              - name: 'leafCount'
                type: Integer
                description: Number of leaf nodes in the tree-based structure. Default value is 500.
                default_from_api: true
      - name: 'ragEmbeddingModelConfig'
        type: NestedObject
        description: Optional. Immutable. The embedding model config of the Vector DB.
        immutable: true
        properties:
          - name: 'vertexPredictionEndpoint'
            type: NestedObject
            description: The Vertex AI Prediction Endpoint used for dense vector search.
            properties:
              - name: 'endpoint'
                type: String
                description: |-
                  Required. The endpoint resource name. Format:
                  projects/{project}/locations/{location}/publishers/{publisher}/models/{model}
                  or projects/{project}/locations/{location}/endpoints/{endpoint}.
                required: true
              - name: 'model'
                type: String
                description: Output only. The resource name of the model that is deployed on the endpoint.
                output: true
              - name: 'modelVersionId'
                type: String
                description: Output only. Version ID of the model that is deployed on the endpoint.
                output: true
  - name: 'encryptionSpec'
    type: NestedObject
    description: |-
      Optional. Immutable. The CMEK key name used to encrypt at-rest data
      related to this corpus. Only applicable to RagManagedDb option for Vector
      DB. This field can only be set at corpus creation time, and cannot be
      updated or deleted.
    immutable: true
    properties:
      - name: 'kmsKeyName'
        type: String
        description: |-
          Required. The Cloud KMS resource identifier of the customer managed
          encryption key used to protect the resource. Has the form:
          projects/my-project/locations/my-region/keyRings/my-kr/cryptoKeys/my-key.
          The key needs to be in the same region as where the resource is
          created.
        required: true
        immutable: true
