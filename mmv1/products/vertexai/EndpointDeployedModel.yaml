---
name: EndpointDeployedModel
api_resource_type_kind: Endpoint
description: |
  A model deployed to a Vertex AI Endpoint.

  Deploying a model with this resource does not assign prediction traffic.
  Manage the endpoint-wide `traffic_split` with `google_vertex_ai_endpoint`
  or another endpoint traffic controller, but not both. Because the endpoint
  must exist before a model can be deployed, first apply the endpoint and
  deployment without a traffic split, then configure the split and apply
  again. Use the known `deployed_model_id` in the endpoint's split instead
  of a reference to this resource, which would create a dependency cycle.

  Before removing a model from a shared traffic split, explicitly route its
  traffic to other models and apply the endpoint update. Deletion refuses to
  redistribute other models' traffic. If the model is the only one receiving
  traffic, deletion clears the split using the endpoint's etag before
  undeploying it, stopping prediction traffic. This requires permission to
  update the endpoint. If the endpoint remains managed, also update its
  `traffic_split` configuration so it no longer references the deleted model.
references:
  guides:
    Deploy a model to an endpoint: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/deployment
    Update a deployed model: https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1/projects.locations.endpoints/mutateDeployedModel
    Undeploy a model: https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1/projects.locations.endpoints/undeployModel
  api: https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1/projects.locations.endpoints/deployModel
base_url: '{{endpoint}}'
self_link: '{{endpoint}}'
create_url: '{{endpoint}}:deployModel'
update_url: '{{endpoint}}:mutateDeployedModel'
delete_url: '{{endpoint}}:undeployModel'
update_verb: POST
delete_verb: POST
id_format: '{{endpoint}}/deployedModels/{{deployed_model_id}}'
import_format:
  - projects/{{project}}/locations/{{region}}/endpoints/{{endpoint}}/deployedModels/{{deployed_model_id}}
timeouts:
  insert_minutes: 60
  update_minutes: 60
  delete_minutes: 60
exclude_identity_generation: true
supports_indirect_user_project_override: true
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: [create, update, delete]
  result:
    resource_inside_response: true
  include_project: true
custom_diff:
  - resourceVertexAIEndpointDeployedModelCustomDiff
custom_code:
  constants: templates/terraform/constants/vertex_ai_endpoint_deployed_model.go.tmpl
  encoder: templates/terraform/encoders/vertex_ai_endpoint_deployed_model.go.tmpl
  update_encoder: templates/terraform/update_encoder/vertex_ai_endpoint_deployed_model.go.tmpl
  decoder: templates/terraform/decoders/vertex_ai_endpoint_deployed_model.go.tmpl
  pre_create: templates/terraform/pre_create/vertex_ai_endpoint_deployed_model.go.tmpl
  pre_update: templates/terraform/pre_update/vertex_ai_endpoint_deployed_model.go.tmpl
  pre_delete: templates/terraform/pre_delete/vertex_ai_endpoint_deployed_model.go.tmpl
  custom_import: templates/terraform/custom_import/vertex_ai_endpoint_deployed_model.go.tmpl
samples:
  - name: vertex_ai_endpoint_deployed_model_basic
    primary_resource_id: deployed_model
    steps:
      - name: vertex_ai_endpoint_deployed_model_basic
        vars:
          source_model: projects/my-project-name/locations/us-central1/models/my-source-model
        resource_id_vars:
          endpoint_name: endpoint-name
          model_id: model-id
        test_env_vars:
          project_name: PROJECT_NAME
        test_vars_overrides:
          source_model: vertexai.BootstrapVertexAIModel(t, "us-central1")
        ignore_read_extra:
          - project
parameters:
  - name: endpoint
    type: ResourceRef
    description: |
      The Endpoint to deploy the Model to, in the format
      `projects/{{project}}/locations/{{region}}/endpoints/{{endpoint}}`.
    url_param_only: true
    required: true
    immutable: true
    resource: Endpoint
    imports: name
  - name: region
    type: String
    description: The region of the Endpoint.
    url_param_only: true
    default_from_api: true
    immutable: true
properties:
  - name: deployedModelId
    api_name: id
    type: String
    description: |
      The user-specified ID of the DeployedModel. The ID must contain 1 to 10
      numeric characters and must be unique among the models deployed to the Endpoint.
    required: true
    immutable: true
  - name: model
    type: String
    description: |
      The resource name of the Model to deploy. The resource name may include a
      version ID or version alias, for example
      `projects/{project}/locations/{location}/models/{model}@2`.
    required: true
    immutable: true
  - name: displayName
    type: String
    description: The display name of the DeployedModel. If omitted, the Model's display name is used.
    default_from_api: true
    immutable: true
  - name: serviceAccount
    type: String
    description: |
      The service account that the DeployedModel's container runs as. The user
      deploying the Model must have the `iam.serviceAccounts.actAs` permission
      on this service account.
    immutable: true
  - name: enableAccessLogging
    type: Boolean
    description: Whether online prediction access logs are sent to Cloud Logging.
    default_from_api: true
    immutable: true
  # The mutation API supports disableContainerLogging only in v1.
  - name: disableContainerLogging
    type: Boolean
    description: |
      Whether container `stderr` and `stdout` logging is disabled. This is only
      supported for custom-trained Models and AutoML Tabular Models.
    default_from_api: true
    exact_version: ga
  - name: disableContainerLogging
    type: Boolean
    description: |
      Whether container `stderr` and `stdout` logging is disabled. This is only
      supported for custom-trained Models and AutoML Tabular Models.
    default_from_api: true
    exact_version: beta
    immutable: true
  - name: enableContainerLogging
    type: Boolean
    description: |
      Whether container `stderr` and `stdout` logging is enabled. This is only
      supported for custom-trained Models and AutoML Tabular Models.
    default_from_api: true
    min_version: beta
  - name: automaticResources
    type: NestedObject
    description: Resources for which Vertex AI automatically manages the machine configuration.
    allow_empty_object: true
    exactly_one_of:
      - automatic_resources
      - dedicated_resources
      - shared_resources
    properties:
      - name: minReplicaCount
        type: Integer
        description: The minimum number of replicas that will always be deployed.
        default_from_api: true
      - name: maxReplicaCount
        type: Integer
        description: The maximum number of replicas that may be deployed.
        default_from_api: true
  - name: dedicatedResources
    type: NestedObject
    description: Dedicated resources used by the DeployedModel.
    exactly_one_of:
      - automatic_resources
      - dedicated_resources
      - shared_resources
    properties:
      - name: machineSpec
        type: NestedObject
        description: The specification of a single machine used by the deployment.
        required: true
        allow_empty_object: true
        immutable: true
        properties:
          - name: machineType
            type: String
            description: The machine type used by each replica. Defaults to `n1-standard-2`.
            default_from_api: true
            immutable: true
          - name: acceleratorType
            type: String
            description: |
              The type of accelerator attached to the machine. See the
              [supported accelerator types](https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/Shared.Types/AcceleratorType).
            immutable: true
          - name: acceleratorCount
            type: Integer
            description: The number of accelerators attached to the machine.
            immutable: true
          - name: tpuTopology
            type: String
            description: The TPU topology.
            immutable: true
      - name: minReplicaCount
        type: Integer
        description: The minimum number of machine replicas that will always be deployed.
        required: true
      - name: maxReplicaCount
        type: Integer
        description: The maximum number of machine replicas that may be deployed.
        default_from_api: true
      - name: requiredReplicaCount
        type: Integer
        description: |
          The number of available replicas required for the deployment operation
          to succeed. If omitted, this defaults to `min_replica_count`.
        default_from_api: true
      - name: spot
        type: Boolean
        description: Whether to schedule the deployment workload on Spot VMs.
        default_from_api: true
        immutable: true
      - name: autoscalingMetricSpecs
        type: Array
        description: Autoscaling metrics for the deployment.
        item_type:
          type: NestedObject
          properties:
            - name: metricName
              type: String
              description: The resource metric name.
              required: true
            - name: target
              type: Integer
              description: |
                The target resource utilization percentage for the metric. When
                first omitted, the API defaults this to 60. To reset an existing
                target to 60, set it explicitly; removing it from the configuration
                retains the existing value.
              default_from_api: true
  - name: sharedResources
    type: String
    description: |
      The shared DeploymentResourcePool to deploy on, in the format
      `projects/{project}/locations/{location}/deploymentResourcePools/{deployment_resource_pool}`.
    immutable: true
    exactly_one_of:
      - automatic_resources
      - dedicated_resources
      - shared_resources
  - name: modelVersionId
    type: String
    description: The version ID of the deployed Model.
    output: true
  - name: createTime
    type: String
    description: The timestamp when the DeployedModel was created.
    output: true
  - name: privateEndpoints
    type: NestedObject
    description: Private paths for sending requests to the deployed model.
    output: true
    properties:
      - name: predictHttpUri
        type: String
        description: The HTTP path for prediction requests.
        output: true
      - name: explainHttpUri
        type: String
        description: The HTTP path for explanation requests.
        output: true
      - name: healthHttpUri
        type: String
        description: The HTTP path for health check requests.
        output: true
      - name: serviceAttachment
        type: String
        description: The service attachment resource used by Private Service Connect.
        output: true
