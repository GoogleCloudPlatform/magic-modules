---
name: EndpointDeployedModel
api_resource_type_kind: Endpoint
description: Deploys an existing Vertex AI Model to an existing Endpoint.
references:
  guides:
    Vertex AI online prediction: https://cloud.google.com/vertex-ai/docs/predictions/overview
  api: https://cloud.google.com/vertex-ai/docs/reference/rest/v1/projects.locations.endpoints/deployModel
base_url: '{{endpoint}}'
self_link: '{{endpoint}}/deployedModels/{{deployed_model_id}}'
create_url: '{{endpoint}}:deployModel'
delete_url: '{{endpoint}}:undeployModel'
id_format: '{{endpoint}}/deployedModels/{{deployed_model_id}}'
import_format:
  - projects/{{project}}/locations/{{region}}/endpoints/{{endpoint}}/deployedModels/{{deployed_model_id}}
timeouts:
  insert_minutes: 60
  delete_minutes: 30
exclude_identity_generation: true
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: [create, delete]
  result:
    resource_inside_response: true
  include_project: true
custom_code:
  encoder: templates/terraform/encoders/vertex_ai_endpoint_deployed_model.go.tmpl
  decoder: templates/terraform/decoders/vertex_ai_endpoint_deployed_model.go.tmpl
  post_create: templates/terraform/post_create/resource_vertexai_endpoint_deployed_model.go.tmpl
  pre_delete: templates/terraform/pre_delete/vertex_ai_endpoint_deployed_model.go.tmpl
  custom_import: templates/terraform/custom_import/vertex_ai_endpoint_deployed_model.go.tmpl
samples:
  - name: vertex_ai_endpoint_deployed_model_basic
    primary_resource_id: deployment
    exclude_test: true
    steps:
      - name: vertex_ai_endpoint_deployed_model_basic
        resource_id_vars:
          endpoint_name: endpoint-name
          model_name: model-name
          deployed_model_id: deployed-model-id
parameters:
  - name: endpoint
    type: ResourceRef
    description: The existing Vertex AI Endpoint to deploy the model to.
    url_param_only: true
    required: true
    immutable: true
    resource: Endpoint
    imports: name
  - name: region
    type: String
    description: The region of the Endpoint.
    url_param_only: true
    required: true
    immutable: true
  - name: deployedModelId
    type: String
    description: The numeric ID of the deployed model. If omitted, Vertex AI assigns one.
    immutable: true
    output: true
properties:
  - name: model
    type: String
    description: The full resource name of the Model to deploy.
    required: true
    immutable: true
    diff_suppress_func: tpgresource.ProjectNumberDiffSuppress
  - name: displayName
    type: String
    description: The display name of the deployed model.
    immutable: true
  - name: dedicatedResources
    type: NestedObject
    description: Dedicated resources for serving the model.
    exactly_one_of:
      - dedicated_resources
      - automatic_resources
    immutable: true
    properties:
      - name: machineSpec
        type: NestedObject
        required: true
        properties:
          - name: machineType
            type: String
          - name: acceleratorType
            type: String
          - name: acceleratorCount
            type: Integer
      - name: minReplicaCount
        type: Integer
        required: true
      - name: maxReplicaCount
        type: Integer
      - name: autoscalingMetricSpecs
        type: Array
        item_type:
          type: NestedObject
          properties:
            - name: metricName
              type: String
            - name: target
              type: Integer
  - name: automaticResources
    type: NestedObject
    description: Automatic resources for serving the model.
    exactly_one_of:
      - dedicated_resources
      - automatic_resources
    immutable: true
    properties:
      - name: minReplicaCount
        type: Integer
        required: true
      - name: maxReplicaCount
        type: Integer
  - name: trafficSplit
    type: String
    description: A JSON map from deployed model IDs to traffic percentages.
    default_from_api: true
    state_func: func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }
    custom_flatten: templates/terraform/custom_flatten/json_schema.tmpl
    custom_expand: templates/terraform/custom_expand/json_schema.tmpl
    validation:
      function: validation.StringIsJSON
    immutable: true
