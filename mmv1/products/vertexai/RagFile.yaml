---
name: 'RagFile'
description: |-
  A RagFile is a single file that has been imported into a Vertex AI RAG Engine
  RagCorpus, where it is parsed, chunked, embedded, and indexed.

  Each `google_vertex_ai_rag_file` imports exactly one file from either
  Cloud Storage or Google Drive using the `ragFiles:import` method.

  ~> **Note:** The RAG Engine service agent
  (`service-PROJECT_NUMBER@gcp-sa-vertex-rag.iam.gserviceaccount.com`) must be
  able to read the source file. If the source file content already exists in the
  RagCorpus, the import is skipped by the API and resource creation fails.
references:
  guides:
    'Manage your RAG files': 'https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/rag-engine/manage-your-rag-corpus'
  api: 'https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/rest/v1/projects.locations.ragCorpora.ragFiles'
base_url: 'projects/{{project}}/locations/{{region}}/ragCorpora/{{rag_corpus}}/ragFiles'
self_link: 'projects/{{project}}/locations/{{region}}/ragCorpora/{{rag_corpus}}/ragFiles/{{name}}'
create_url: 'projects/{{project}}/locations/{{region}}/ragCorpora/{{rag_corpus}}/ragFiles:import'
id_format: 'projects/{{project}}/locations/{{region}}/ragCorpora/{{rag_corpus}}/ragFiles/{{name}}'
import_format:
  - 'projects/{{project}}/locations/{{region}}/ragCorpora/{{rag_corpus}}/ragFiles/{{name}}'
collection_url_key: 'ragFiles'
# RagFiles have no update method; changing any field requires re-importing.
immutable: true
# RagFiles can only be listed per RagCorpus, so they cannot be swept on their own.
exclude_sweeper: true
timeouts:
  insert_minutes: 30
  delete_minutes: 20
# The import operation's response does not contain the created RagFile, so create
# waits on the operation in post_create and then looks up the new RagFile by source.
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  actions: ['delete']
custom_code:
  constants: 'templates/terraform/constants/vertex_ai_rag_file.go.tmpl'
  encoder: 'templates/terraform/encoders/vertex_ai_rag_file.go.tmpl'
  post_create: 'templates/terraform/post_create/vertex_ai_rag_file.go.tmpl'
samples:
  - name: 'vertex_ai_rag_file_gcs'
    primary_resource_id: 'example'
    steps:
      - name: 'vertex_ai_rag_file_gcs'
        resource_id_vars:
          corpus_display_name: 'rag-corpus-file'
          bucket_name: 'tf-test-rag-file'
  - name: 'vertex_ai_rag_file_full'
    primary_resource_id: 'example'
    steps:
      - name: 'vertex_ai_rag_file_full'
        resource_id_vars:
          corpus_display_name: 'rag-corpus-file-full'
          bucket_name: 'tf-test-rag-file-full'
  - name: 'vertex_ai_rag_file_layout_parser'
    primary_resource_id: 'example'
    steps:
      - name: 'vertex_ai_rag_file_layout_parser'
        resource_id_vars:
          corpus_display_name: 'rag-corpus-file-layout'
          bucket_name: 'tf-test-rag-file-layout'
          processor_display_name: 'rag-layout-parser'
  - name: 'vertex_ai_rag_file_google_drive'
    primary_resource_id: 'example'
    # Requires a Google Drive file shared with the RAG Engine service agent,
    # which cannot be provisioned in the test environment.
    exclude_test: true
    steps:
      - name: 'vertex_ai_rag_file_google_drive'
        resource_id_vars:
          corpus_display_name: 'rag-corpus-drive'
parameters:
  - name: 'region'
    type: String
    description: The region of the RagCorpus. eg europe-west4
    url_param_only: true
    required: true
    immutable: true
  - name: 'ragCorpus'
    type: String
    description: |-
      The ID of the RagCorpus to import the file into, for example the `name`
      attribute of a `google_vertex_ai_rag_corpus` resource.
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: 'name'
    type: String
    description: |-
      The generated ID of the RagFile.
    output: true
    custom_flatten: 'templates/terraform/custom_flatten/name_from_self_link.tmpl'
  - name: 'displayName'
    type: String
    description: |-
      The display name of the RagFile, derived by the API from the source file.
    output: true
  - name: 'description'
    type: String
    description: The description of the RagFile.
    output: true
  - name: 'createTime'
    type: String
    description: Timestamp when this RagFile was created.
    output: true
  - name: 'updateTime'
    type: String
    description: Timestamp when this RagFile was last updated.
    output: true
  - name: 'userMetadata'
    type: String
    description: The metadata for metadata search, in JSON format.
    output: true
  - name: 'fileStatus'
    type: NestedObject
    description: State of the RagFile.
    output: true
    properties:
      - name: 'state'
        type: String
        description: RagFile state.
        output: true
      - name: 'errorStatus'
        type: String
        description: Only populated when the state is ERROR.
        output: true
  - name: 'gcsSource'
    type: NestedObject
    description: |-
      The Cloud Storage location of the file to import.
    exactly_one_of:
      - gcs_source
      - google_drive_source
    properties:
      - name: 'uris'
        type: Array
        description: |-
          The Cloud Storage URI of the file to import, for example
          `gs://my-bucket/my-file.pdf`. Must reference a single file; directories
          and wildcards are not supported because each resource manages one RagFile.
        required: true
        # Each resource manages exactly one RagFile, so only a single URI is accepted.
        max_size: 1
        item_type:
          type: String
  - name: 'googleDriveSource'
    type: NestedObject
    description: |-
      The Google Drive location of the file to import.
    exactly_one_of:
      - gcs_source
      - google_drive_source
    properties:
      - name: 'resourceIds'
        type: Array
        description: The Google Drive file to import.
        required: true
        # Each resource manages exactly one RagFile, so only a single file is accepted.
        max_size: 1
        item_type:
          type: NestedObject
          properties:
            - name: 'resourceId'
              type: String
              description: The ID of the Google Drive file.
              required: true
            - name: 'resourceType'
              type: Enum
              description: |-
                The type of the Google Drive resource. Only individual files are
                supported because each resource manages one RagFile.
              default_value: 'RESOURCE_TYPE_FILE'
              enum_values:
                - 'RESOURCE_TYPE_FILE'
  - name: 'ragFileParsingConfig'
    type: NestedObject
    description: |-
      The parsing config used when importing the file. The default parser is used
      if this field is not set.
    # Only accepted by ragFiles:import; the RagFile resource does not return it.
    ignore_read: true
    properties:
      - name: 'layoutParser'
        type: NestedObject
        description: The Document AI Layout Parser to use for the file.
        conflicts:
          - rag_file_parsing_config.0.llm_parser
        properties:
          - name: 'processorName'
            type: String
            description: |-
              The full resource name of a Document AI processor or processor version
              of type `LAYOUT_PARSER_PROCESSOR`. Format:
              `projects/{project_id}/locations/{location}/processors/{processor_id}` or
              `projects/{project_id}/locations/{location}/processors/{processor_id}/processorVersions/{processor_version_id}`.
          - name: 'maxParsingRequestsPerMin'
            type: Integer
            description: |-
              The maximum number of requests the job is allowed to make to the
              Document AI processor per minute.
      - name: 'llmParser'
        type: NestedObject
        description: The LLM parser to use for the file.
        conflicts:
          - rag_file_parsing_config.0.layout_parser
        properties:
          - name: 'modelName'
            type: String
            description: |-
              The name of a LLM model used for parsing. Format:
              `projects/{project_id}/locations/{location}/publishers/{publisher}/models/{model}`.
          - name: 'maxParsingRequestsPerMin'
            type: Integer
            description: |-
              The maximum number of requests the job is allowed to make to the LLM
              model per minute.
          - name: 'customParsingPrompt'
            type: String
            description: |-
              The prompt to use for parsing. If not specified, a default prompt is used.
  - name: 'ragFileTransformationConfig'
    type: NestedObject
    description: The transformation config used when importing the file.
    # Only accepted by ragFiles:import; the RagFile resource does not return it.
    ignore_read: true
    properties:
      - name: 'ragFileChunkingConfig'
        type: NestedObject
        description: The chunking config for the file.
        properties:
          - name: 'fixedLengthChunking'
            type: NestedObject
            description: The fixed length chunking config.
            properties:
              - name: 'chunkSize'
                type: Integer
                description: The size of the chunks.
              - name: 'chunkOverlap'
                type: Integer
                description: The overlap between chunks.
  - name: 'maxEmbeddingRequestsPerMin'
    type: Integer
    description: |-
      The maximum number of queries per minute that the import is allowed to make
      to the embedding model specified on the RagCorpus.
    # Only accepted by ragFiles:import; the RagFile resource does not return it.
    ignore_read: true
