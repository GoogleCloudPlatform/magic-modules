---
name: 'PublisherModelConfig'
api_variant_patterns:
  - 'projects/{project}/locations/{location}/publishers/{publisher}/models/{model}'
description: |-
  Manages the per-model configuration for a Vertex AI Model Garden publisher
  model in a given location (regional or `global`).

  Each publisher model has a single configuration per project and location;
  creating this resource sets or updates that configuration. Destroying this
  resource clears `inference_event_logging_config` on the publisher model
  configuration while leaving any other settings on the publisher model
  configuration untouched.
min_version: 'beta'
references:
  guides:
    'Inference metadata logging': 'https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/capabilities/inference-metadata-logging'
    'Use models in Model Garden': 'https://cloud.google.com/vertex-ai/generative-ai/docs/model-garden/use-models'
  api: 'https://cloud.google.com/vertex-ai/docs/reference/rest/v1beta1/projects.locations.publishers.models/setPublisherModelConfig'
docs:
id_format: 'projects/{{project}}/locations/{{region}}/publishers/{{publisher}}/models/{{model}}'
base_url: 'projects/{{project}}/locations/{{region}}/publishers/{{publisher}}/models/{{model}}'
cai_base_url: 'projects/{{project}}/locations/{{region}}/publishers/{{publisher}}/models/{{model}}'
self_link: 'projects/{{project}}/locations/{{region}}/publishers/{{publisher}}/models/{{model}}:fetchPublisherModelConfig'
create_url: 'projects/{{project}}/locations/{{region}}/publishers/{{publisher}}/models/{{model}}:setPublisherModelConfig'
create_verb: 'POST'
update_url: 'projects/{{project}}/locations/{{region}}/publishers/{{publisher}}/models/{{model}}:setPublisherModelConfig'
update_verb: 'POST'
delete_url: 'projects/{{project}}/locations/{{region}}/publishers/{{publisher}}/models/{{model}}:setPublisherModelConfig'
delete_verb: 'POST'
mutex: 'projects/{{project}}/locations/{{region}}/publishers/{{publisher}}/models/{{model}}'
import_format:
  - 'projects/{{project}}/locations/{{region}}/publishers/{{publisher}}/models/{{model}}'
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
exclude_sweeper: true
# SetPublisherModelConfig returns an LRO when mutating configuration, or a
# synchronous 409 ALREADY_EXISTS error without an LRO when the target
# configuration already matches. Operation polling is handled conditionally in
# post_create, post_update, and post_delete while 409 ALREADY_EXISTS is ignored
# in post_create_failure, post_update_failure, and post_delete_failure.
custom_code:
  constants: 'templates/terraform/constants/vertex_ai_publisher_model_config.go.tmpl'
  encoder: 'templates/terraform/encoders/vertex_ai_publisher_model_config.go.tmpl'
  decoder: 'templates/terraform/decoders/vertex_ai_publisher_model_config.go.tmpl'
  pre_create: 'templates/terraform/pre_create/vertex_ai_publisher_model_config.go.tmpl'
  post_create: 'templates/terraform/post_create/vertex_ai_publisher_model_config.go.tmpl'
  post_create_failure: 'templates/terraform/post_create_failure/vertex_ai_publisher_model_config.go.tmpl'
  pre_read: 'templates/terraform/pre_read/vertex_ai_publisher_model_config.go.tmpl'
  pre_update: 'templates/terraform/pre_update/vertex_ai_publisher_model_config.go.tmpl'
  post_update: 'templates/terraform/post_update/vertex_ai_publisher_model_config.go.tmpl'
  post_update_failure: 'templates/terraform/post_create_failure/vertex_ai_publisher_model_config.go.tmpl'
  pre_delete: 'templates/terraform/pre_delete/vertex_ai_publisher_model_config.go.tmpl'
  post_delete: 'templates/terraform/post_delete/vertex_ai_publisher_model_config.go.tmpl'
  post_delete_failure: 'templates/terraform/post_create_failure/vertex_ai_publisher_model_config.go.tmpl'
  test_check_destroy: 'templates/terraform/custom_check_destroy/vertex_ai_publisher_model_config.go.tmpl'
samples:
  - name: 'vertex_ai_publisher_model_config_basic'
    primary_resource_id: 'config'
    min_version: 'beta'
    steps:
      - name: 'vertex_ai_publisher_model_config_basic'
        min_version: 'beta'
        vars:
          state: 'ENABLED'
      - name: 'vertex_ai_publisher_model_config_basic'
        min_version: 'beta'
        vars:
          state: 'DISABLED'
  - name: 'vertex_ai_publisher_model_config_global'
    primary_resource_id: 'config'
    min_version: 'beta'
    steps:
      - name: 'vertex_ai_publisher_model_config_global'
        min_version: 'beta'
        vars:
          state: 'ENABLED'
      - name: 'vertex_ai_publisher_model_config_global'
        min_version: 'beta'
        vars:
          state: 'DISABLED'
  - name: 'vertex_ai_publisher_model_config_singleton_lifecycle'
    primary_resource_id: 'tf_test_first'
    min_version: 'beta'
    exclude_basic_doc: true
    steps:
      - name: 'vertex_ai_publisher_model_config_singleton_lifecycle'
        min_version: 'beta'
        vars:
          state: 'ENABLED'
      - name: 'vertex_ai_publisher_model_config_singleton_lifecycle'
        min_version: 'beta'
        vars:
          state: 'DISABLED'
  - name: 'vertex_ai_publisher_model_config_global_acquire_different_state'
    primary_resource_id: 'tf_test_primary'
    min_version: 'beta'
    exclude_basic_doc: true
    steps:
      - name: 'vertex_ai_publisher_model_config_global_acquire_abandon'
        min_version: 'beta'
      - name: 'vertex_ai_publisher_model_config_global_acquire_verify'
        min_version: 'beta'
      - name: 'vertex_ai_publisher_model_config_global_acquire_recreate'
        min_version: 'beta'
parameters:
  - name: 'region'
    type: String
    description: |-
      The location of the publisher model, for example `global` or `us-central1`.
      If not specified, the provider region is used.
    url_param_only: true
    immutable: true
    ignore_read: true
    default_from_api: true
  - name: 'publisher'
    type: String
    description: |-
      The Model Garden publisher identifier, for example `google` or `anthropic`.
    url_param_only: true
    immutable: true
    required: true
  - name: 'model'
    type: String
    description: |-
      The publisher model identifier, for example `gemini-2.5-flash` or `claude-sonnet-4-5`.
    url_param_only: true
    immutable: true
    required: true
properties:
  - name: 'inferenceEventLoggingConfig'
    type: NestedObject
    description: |-
      Configures emission of the per-request
      `aiplatform.googleapis.com/inference_request` Cloud Logging log, which
      records structured per-request metadata (such as principal, traffic type,
      and token usage) for publisher-model traffic on the model.
    required: true
    properties:
      - name: 'state'
        type: Enum
        description: |-
          Whether emission of the `aiplatform.googleapis.com/inference_request`
          log is enabled.
        required: true
        enum_values:
          - 'ENABLED'
          - 'DISABLED'
