---
name: EmailTemplate
description: >
  EmailTemplate provides APIs to manage reusable email formats for security communications in SecOps. Analysts use these templates to ensure consistent messaging when notifying stakeholders or communicating with users during an investigation.
min_version: 'beta'
references:
  guides:
    'Google SecOps Guides': 'https://cloud.google.com/chronicle/docs/secops/secops-overview'
  api: 'https://docs.cloud.google.com/chronicle/docs/reference/rest/v1beta/projects.locations.instances.emailTemplates'
base_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}/emailTemplates
self_link: projects/{{project}}/locations/{{location}}/instances/{{instance}}/emailTemplates/{{email_template_id}}
create_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}/emailTemplates
id_format: projects/{{project}}/locations/{{location}}/instances/{{instance}}/emailTemplates/{{email_template_id}}
update_mask: true
update_verb: PATCH
import_format:
  - projects/{{project}}/locations/{{location}}/instances/{{instance}}/emailTemplates/{{email_template_id}}
autogen_status: RW1haWxUZW1wbGF0ZQ==
samples:
  - name: chronicle_emailtemplate_update
    primary_resource_id: sample
    min_version: beta
    steps:
      - name: "chronicle_emailtemplate_basic"
        test_env_vars:
          chronicle_id: 'CHRONICLE_ID'
      - name: "chronicle_emailtemplate_full"
        test_env_vars:
          chronicle_id: 'CHRONICLE_ID'
parameters:
  - name: location
    type: String
    required: true
    description: Resource ID segment making up resource `name`. It identifies the resource within its parent collection as described in https://google.aip.dev/122.
    immutable: true
    url_param_only: true
  - name: instance
    type: String
    required: true
    description: Resource ID segment making up resource `name`. It identifies the resource within its parent collection as described in https://google.aip.dev/122.
    immutable: true
    url_param_only: true
  - name: emailTemplateId
    type: String
    output: true
    custom_flatten: 'templates/terraform/custom_flatten/id_from_name.tmpl'
    description: |-
      Id of the EmailTemplate record.
properties:
  - name: displayName
    type: String
    required: true
    description: Display name of the EmailTemplate.
  - name: templateType
    type: String
    required: true
    immutable: true
    description: |-
      The resource inner type of the EmailTemplate.
      Possible values:
      EMAIL_TEMPLATE_TYPE_UNSPECIFIED
      TEMPLATE
      HTML_FORMAT
  - name: content
    type: String
    required: true
    description: Content of the EmailTemplate.
  - name: environments
    type: String
    required: true
    description: The environments to which the email template is associated.
  - name: author
    type: String
    description: Name of creator user.
    output: true
  - name: name
    type: String
    description: |-
      Identifier. The resource name of the EmailTemplate.
      Format:
      projects/{project}/locations/{location}/instances/{instance}/emailTemplates/{email_template}
    output: true
