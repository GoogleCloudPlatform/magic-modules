---
name: CaseTagDefinition
description: >
  A CaseTagDefinition is used to classify and tag cases based on criteria.
references:
  guides:
    'Google SecOps Guides': 'https://cloud.google.com/chronicle/docs/secops/secops-overview'
  api: 'https://cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.caseTagDefinitions'
base_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseTagDefinitions
self_link: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseTagDefinitions/{{case_tag_definition_id}}
create_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseTagDefinitions
id_format: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseTagDefinitions/{{case_tag_definition_id}}
update_mask: true
update_verb: PATCH
import_format:
  - projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseTagDefinitions/{{case_tag_definition_id}}
samples:
  - name: chronicle_casetagdefinition_update
    primary_resource_id: example
    steps:
      - name: "chronicle_casetagdefinition_basic"
        test_env_vars:
          chronicle_id: 'CHRONICLE_ID'
      - name: "chronicle_casetagdefinition_full"
        test_env_vars:
          chronicle_id: 'CHRONICLE_ID'
parameters:
  - name: location
    type: String
    required: true
    description: Resource ID segment making up resource `name`. It identifies the resource within its parent collection as described in https://google.aip.dev/122.
    immutable: true
    url_param_only: true
  - name: instance
    type: String
    required: true
    description: Resource ID segment making up resource `name`. It identifies the resource within its parent collection as described in https://google.aip.dev/122.
    immutable: true
    url_param_only: true
  - name: caseTagDefinitionId
    type: String
    output: true
    custom_flatten: 'templates/terraform/custom_flatten/id_from_name.tmpl'
    description: |-
      The unique identifier of the CaseTagDefinition.
properties:
  - name: canBeCaseTitle
    type: Boolean
    send_empty_value: true
    required: true
    description: |-
      When checked, the tag will be assigned as the title of the case if it meets the conditions.
  - name: comparisonType
    type: Enum
    required: true
    description: |-
      The type of comparison to be used when comparing the value to the case.
      Possible values:
      EXACT
      START_WITH
      CONTAIN
      ENDS_WITH
    enum_values:
      - EXACT
      - START_WITH
      - CONTAIN
      - ENDS_WITH
  - name: displayName
    type: String
    required: true
    description: This is the name of the tag that will be applied to the case.
  - name: matchCriteria
    type: Enum
    required: true
    description: |-
      The criteria to match the case against.
      Possible values:
      BY_VENDOR
      BY_PRODUCT
      BY_RULE_GENERATOR
      BY_ENTITY_PROPERTY_NAME
      DATA_DRIVEN
      SYSTEM
    enum_values:
      - BY_VENDOR
      - BY_PRODUCT
      - BY_RULE_GENERATOR
      - BY_ENTITY_PROPERTY_NAME
      - DATA_DRIVEN
      - SYSTEM
  - name: name
    type: String
    description: |-
      Identifier. The unique name(ID) of the CaseTagDefinition.
      Format:
      projects/{project}/locations/{location}/instances/{instance}/caseTagDefinitions/{case_tag_definition_id}
    output: true
  - name: priority
    type: Integer
    required: true
    description: |-
      Note that Google Security Operations merges priority with other alerts and
      entities and events so that the priority here is not absolute.
  - name: propertyName
    type: String
    description: |-
      Specific Entity property name to search in case.
      This is relevant only when a SearchIn of type BY_ENTITY_PROPERTY_NAME was chosen.
  - name: value
    type: String
    required: true
    description: Specific value to search in case - in addition to SearchIn property.
