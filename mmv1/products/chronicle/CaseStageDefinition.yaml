---
name: CaseStageDefinition
description: >
  CaseStageDefinition represents a stage in the lifecycle of a case.
references:
  guides:
    'Google SecOps Guides': 'https://cloud.google.com/chronicle/docs/secops/secops-overview'
  api: 'https://cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.caseStageDefinitions'
base_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseStageDefinitions
self_link: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseStageDefinitions/{{case_stage_definition_id}}
create_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseStageDefinitions
id_format: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseStageDefinitions/{{case_stage_definition_id}}
update_mask: true
update_verb: PATCH
import_format:
  - projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseStageDefinitions/{{case_stage_definition_id}}
autogen_status: Q2FzZVN0YWdlRGVmaW5pdGlvbg==
samples:
  - name: chronicle_casestagedefinition_basic
    primary_resource_id: example
    steps:
      - name: "chronicle_casestagedefinition_basic"
        test_env_vars:
          chronicle_id: 'CHRONICLE_ID'
parameters:
  - name: location
    type: String
    required: true
    description: Resource ID segment making up resource `name`. It identifies the resource within its parent collection as described in https://google.aip.dev/122.
    immutable: true
    url_param_only: true
  - name: instance
    type: String
    required: true
    description: Resource ID segment making up resource `name`. It identifies the resource within its parent collection as described in https://google.aip.dev/122.
    immutable: true
    url_param_only: true
  - name: caseStageDefinitionId
    type: String
    output: true
    custom_flatten: 'templates/terraform/custom_flatten/id_from_name.tmpl'
    description: |-
      The unique identifier for the CaseStageDefinition.
properties:
  - name: displayName
    type: String
    required: true
    immutable: true
    description: |-
      The display name of the stage. The display name must be unique within the instance. The display name must not contain special characters.
  - name: order
    type: Integer
    required: true
    immutable: true
    description: |-
      Defines the case stage order in the lifetime of a case.
  - name: name
    type: String
    description: |-
      Identifier. The resource name of the CaseStageDefinition.
      Format:
      projects/{project}/locations/{location}/instances/{instance}/caseStageDefinitions/{case_stage_definition}
    output: true
