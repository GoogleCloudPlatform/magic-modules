---
name: CaseCloseDefinition
description: >
  CaseCloseDefinition provides predefined root cause options for closing security cases in SecOps. These definitions ensure consistent documentation and reporting across case investigations upon closure.

min_version: 'beta'
references:
  guides:
    'Google SecOps Guides': 'https://cloud.google.com/chronicle/docs/secops/secops-overview'
  api: 'https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.caseCloseDefinitions'
base_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseCloseDefinitions
self_link: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseCloseDefinitions/{{case_close_definition_id}}
create_url: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseCloseDefinitions
id_format: projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseCloseDefinitions/{{case_close_definition_id}}
update_mask: true
update_verb: PATCH
import_format:
  - projects/{{project}}/locations/{{location}}/instances/{{instance}}/caseCloseDefinitions/{{case_close_definition_id}}
samples:
  - name: chronicle_caseclosedefinition_update
    min_version: beta
    primary_resource_id: example
    steps:
      - name: "chronicle_caseclosedefinition_basic"
        test_env_vars:
          chronicle_id: 'CHRONICLE_ID'
      - name: "chronicle_caseclosedefinition_full"
        test_env_vars:
          chronicle_id: 'CHRONICLE_ID'
parameters:
  - name: location
    type: String
    required: true
    description: The location of the resource. This is the geographical region where the Chronicle instance resides, such as "us" or "europe-west2".
    immutable: true
    url_param_only: true
  - name: instance
    type: String
    required: true
    description: The unique identifier for the Chronicle instance, which is the same as the customer ID.
    immutable: true
    url_param_only: true
  - name: caseCloseDefinitionId
    type: String
    output: true
    custom_flatten: 'templates/terraform/custom_flatten/id_from_name.tmpl'
    description: |-
      The ID of the case close definition.
properties:
  - name: closeReason
    type: Enum
    enum_values:
      - 'MALICIOUS'
      - 'NOT_MALICIOUS'
      - 'MAINTENANCE'
      - 'INCONCLUSIVE'
    required: true
    description: |-
      Specify why the case was closed.
      Possible values:
      MALICIOUS
      NOT_MALICIOUS
      MAINTENANCE
      INCONCLUSIVE
  - name: name
    type: String
    description: |-
      Identifier. The unique name(ID) of the CaseCloseDefinition.
      Format:
      projects/{project}/locations/{location}/instances/{instance}/caseCloseDefinitions/{case_close_definition}
    output: true
  - name: rootCause
    type: String
    required: true
    description: Provides detailed description about the specific root cause option.
