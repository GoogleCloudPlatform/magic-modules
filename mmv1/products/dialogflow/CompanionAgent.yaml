---
name: CompanionAgent
description: |
  A Companion Agent in Dialogflow.
references:
  guides:
    Official Documentation: https://cloud.google.com/agent-assist/docs
  api: https://cloud.google.com/dialogflow/es/docs/reference/rest/v2/projects.locations.companionAgents
base_url: projects/{{project}}/locations/{{location}}/companionAgents
self_link: '{{name}}'
create_url: projects/{{project}}/locations/{{location}}/companionAgents?companionAgentId={{companion_agent_id}}
update_mask: true
update_verb: PATCH
id_format: '{{name}}'
import_format:
  - '{{name}}'
# Sweeper skipped because pre_delete dynamically rewrites the regional endpoint host and self_link is {{name}}.
exclude_sweeper: true
autogen_status: Q29tcGFuaW9uQWdlbnRBdXRvZ2VuVjJBZ2VudA==
custom_code:
  pre_create: templates/terraform/pre_create/dialogflow_set_endpoint.go.tmpl
  pre_read: templates/terraform/pre_create/dialogflow_set_endpoint.go.tmpl
  pre_update: templates/terraform/pre_create/dialogflow_set_endpoint.go.tmpl
  pre_delete: templates/terraform/pre_create/dialogflow_set_endpoint.go.tmpl
  custom_import: templates/terraform/custom_import/self_link_as_name_set_project_and_location.go.tmpl
  test_check_destroy: templates/terraform/test_check_destroy/dialogflow_companion_agent.go.tmpl
samples:
  - name: dialogflow_companion_agent_basic
    primary_resource_id: default
    steps:
      - name: dialogflow_companion_agent_basic
        resource_id_vars:
          companion_agent_id: companion-agent
          display_name: companion-agent-basic
        vars:
          description: Basic Companion Agent Description
      - name: dialogflow_companion_agent_update
        resource_id_vars:
          companion_agent_id: companion-agent
          display_name: companion-agent-updated
        vars:
          description: Updated Companion Agent Description
  - name: dialogflow_companion_agent_tools
    primary_resource_id: default
    steps:
      - name: dialogflow_companion_agent_tools
        resource_id_vars:
          companion_agent_id: companion-tools
          display_name: companion-tools
          app_id: ces-app
          app_display_name: ces-app
          tool_id_1: ces-tool-1
          toolset_id_1: ces-toolset-1
          toolset_display_name_1: ces-toolset-1
        vars:
          description: Companion Agent with CES tools
      - name: dialogflow_companion_agent_tools_update
        resource_id_vars:
          companion_agent_id: companion-tools
          display_name: companion-tools-updated
          app_id: ces-app
          app_display_name: ces-app
          tool_id_1: ces-tool-1
          tool_id_2: ces-tool-2
          toolset_id_1: ces-toolset-1
          toolset_display_name_1: ces-toolset-1
          toolset_id_2: ces-toolset-2
          toolset_display_name_2: ces-toolset-2
        vars:
          description: Updated Companion Agent with CES tools
parameters:
  - name: location
    type: String
    required: true
    immutable: true
    url_param_only: true
    description: |
      The location of the companion agent.
  - name: companionAgentId
    type: String
    default_from_api: true
    immutable: true
    custom_flatten: templates/terraform/custom_flatten/id_from_name.tmpl
    description: |
      The ID to use for the companion agent, which will become the final component of the companion agent's resource name.
      If the field is not provided, an ID will be auto-generated.
properties:
  - name: name
    type: String
    description: |
      The unique identifier of the companion agent.
      Format: `projects/{project}/locations/{location}/companionAgents/{companion_agent}`.
    output: true
  - name: displayName
    type: String
    description: |
      Display name for the companion agent.
  - name: description
    type: String
    description: |
      Description for the companion agent.
  - name: createTime
    type: String
    description: |
      Creation time of this companion agent.
    output: true
  - name: updateTime
    type: String
    description: |
      Update time of this companion agent.
    output: true
  - name: skillConfigs
    type: Array
    description: |
      List of skill configs for the companion agent.
    item_type:
      type: NestedObject
      properties:
        - name: skillTriggeringEvent
          type: Enum
          description: |
            The event that should trigger the skill.
          enum_values:
            - SKILL_TRIGGER_EVENT_UNSPECIFIED
            - END_OF_UTTERANCE
            - CUSTOMER_MESSAGE
            - AGENT_MESSAGE
        - name: guidanceSkillConfig
          type: NestedObject
          description: |
            Guidance skill configuration.
          properties:
            - name: overarchingGuidance
              type: String
              description: |
                This is specific additional guidance that can be configured by the user.
            - name: guidanceInstructions
              type: Array
              description: |
                Customized instructions for guidance.
              item_type:
                type: NestedObject
                properties:
                  - name: displayName
                    type: String
                    description: |
                      Display name for the instruction.
                  - name: displayDetails
                    type: String
                    description: |
                      The detailed description of this instruction.
                  - name: condition
                    type: String
                    description: |
                      The condition of the instruction.
                  - name: disableSuggestedReply
                    type: Boolean
                    send_empty_value: true
                    description: |
                      Whether to disable suggested reply generation for this instruction.
                  - name: triggerEvent
                    type: Enum
                    description: |
                      Event that triggers the guidance instruction.
                    enum_values:
                      - TRIGGER_EVENT_UNSPECIFIED
                      - END_OF_UTTERANCE
                      - CUSTOMER_MESSAGE
                      - AGENT_MESSAGE
                  - name: actions
                    type: Array
                    description: |
                      The action items that can be processed.
                    item_type:
                      type: NestedObject
                      properties:
                        - name: description
                          type: String
                          required: true
                          description: |
                            Description of action item.
  - name: cesToolSpecs
    type: Array
    description: |
      List of CES tool specs that the companion agent can choose from.
    item_type:
      type: NestedObject
      properties:
        - name: cesTool
          type: String
          description: |
            The resource name of the CES tool.
            Format: `projects/{project}/locations/{location}/apps/{app}/tools/{tool}`.
        - name: confirmationRequirement
          type: Enum
          description: |
            Indicates whether the tool requires human confirmation.
          enum_values:
            - CONFIRMATION_REQUIREMENT_UNSPECIFIED
            - REQUIRED
            - NOT_REQUIRED
        - name: proactiveEnabled
          type: Boolean
          send_empty_value: true
          description: |
            Indicates whether the tool is enabled in proactive mode.
            All tools are enabled in proactive mode by default. To disable a tool in proactive mode, set this field to `false`.
            NOTE: At least one of `proactive_enabled` or `reactive_enabled` should be `true` else the tool will be ignored.
        - name: reactiveEnabled
          type: Boolean
          send_empty_value: true
          description: |
            Indicates whether the tool is enabled in reactive mode.
            All tools are disabled in reactive mode by default. To enable a tool in reactive mode, set this field to `true`.
            NOTE: At least one of `reactive_enabled` or `proactive_enabled` should be `true` else the tool will be ignored. CompanionAgent config will throw an error if any unsupported tool is enabled in reactive mode.
        - name: parameterOverrides
          type: Array
          description: |
            Overrides for the tool's input parameters. When the tool is called, each listed parameter is set to the value found in the ingested context references, populating it if omitted by the model or replacing any value predicted by the model. Duplicate entries for the same `parameter_name` are disallowed and rejected during Companion Agent validation.
          item_type:
            type: NestedObject
            properties:
              - name: parameterName
                type: String
                required: true
                description: |
                  The name of the tool input parameter to override, as defined in the tool's input schema. For example, `user_email`.
              - name: contextReferenceKey
                type: String
                required: true
                description: |
                  The key of the context reference in ingested context references.
              - name: fieldPath
                type: String
                description: |
                  The path into the JSON object of the latest content ingested under `context_reference_key` (e.g. `email` or `user.email`). If omitted, the entire content under `context_reference_key` is used.
                  If the path cannot be resolved when the tool is called, the value predicted by the model is used (or omitted if the model did not predict it).
  - name: toolsetTools
    type: Array
    description: |
      List of CES toolset specs that the companion agent can choose from.
    item_type:
      type: NestedObject
      properties:
        - name: toolset
          type: String
          required: true
          description: |
            The name of the toolset to retrieve the schema for.
            Format: `projects/{project}/locations/{location}/apps/{app}/toolsets/{toolset}`.
        - name: operationId
          type: String
          description: |
            The `operationId` field of the OpenAPI endpoint. The `operationId` must be present in the toolset's definition.
        - name: confirmationRequirement
          type: Enum
          description: |
            Indicates whether the tool requires human confirmation.
          enum_values:
            - CONFIRMATION_REQUIREMENT_UNSPECIFIED
            - REQUIRED
            - NOT_REQUIRED
        - name: proactiveEnabled
          type: Boolean
          send_empty_value: true
          description: |
            Indicates whether the toolset tool is enabled in proactive mode.
            NOTE: At least one of `proactive_enabled` or `reactive_enabled` should be `true` else the toolset tool will be ignored.
        - name: reactiveEnabled
          type: Boolean
          send_empty_value: true
          description: |
            Indicates whether the toolset tool is enabled in reactive mode.
            NOTE: At least one of `reactive_enabled` or `proactive_enabled` should be `true` else the toolset tool will be ignored.
        - name: parameterOverrides
          type: Array
          description: |
            Overrides for the tool's input parameters. When the tool is called, each listed parameter is set to the value found in the ingested context references, populating it if omitted by the model or replacing any value predicted by the model. Duplicate entries for the same `parameter_name` are disallowed and rejected during Companion Agent validation.
          item_type:
            type: NestedObject
            properties:
              - name: parameterName
                type: String
                required: true
                description: |
                  The name of the tool input parameter to override, as defined in the tool's input schema. For example, `user_email`.
              - name: contextReferenceKey
                type: String
                required: true
                description: |
                  The key of the context reference in ingested context references.
              - name: fieldPath
                type: String
                description: |
                  The path into the JSON object of the latest content ingested under `context_reference_key` (e.g. `email` or `user.email`). If omitted, the entire content under `context_reference_key` is used.
                  If the path cannot be resolved when the tool is called, the value predicted by the model is used (or omitted if the model did not predict it).
