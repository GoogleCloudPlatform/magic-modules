---
name: Tool
description: |
  Provides a list of actions available to a Generator (e.g., OpenAPI call, Function call, Connector call).
references:
  guides:
    Official Documentation: https://cloud.google.com/agent-assist/docs
  api: https://cloud.google.com/dialogflow/es/docs/reference/rest/v2/projects.locations.tools
base_url: projects/{{project}}/locations/{{location}}/tools
self_link: '{{name}}'
create_url: projects/{{project}}/locations/{{location}}/tools?toolId={{tool_id}}
update_mask: true
update_verb: PATCH
custom_code:
  pre_create: templates/terraform/pre_create/dialogflow_set_endpoint.go.tmpl
  post_create: templates/terraform/post_create/set_computed_name.tmpl
  pre_read: templates/terraform/pre_create/dialogflow_set_endpoint.go.tmpl
  pre_update: templates/terraform/pre_create/dialogflow_set_endpoint.go.tmpl
  pre_delete: templates/terraform/pre_create/dialogflow_set_endpoint.go.tmpl
  custom_import: templates/terraform/custom_import/self_link_as_name_set_project_and_location.go.tmpl
samples:
  - name: dialogflow_tool_basic
    primary_resource_id: basic_tool
    steps:
      - name: dialogflow_tool_basic
        resource_id_vars:
          tool_key: "basic_tool_key"
  - name: dialogflow_tool_connector
    primary_resource_id: connector_tool
    steps:
      - name: dialogflow_tool_connector
        resource_id_vars:
          tool_key: "connector_tool_key"
          connection_name: "df-tool-connection"
          dataset_id: "df_tool_dataset"
          table_id: "df_tool_table"
  - name: dialogflow_tool_function
    primary_resource_id: function_tool
    steps:
      - name: dialogflow_tool_function
        resource_id_vars:
          tool_key: "function_tool_key"
  - name: dialogflow_tool_auth
    primary_resource_id: auth_tool
    steps:
      - name: dialogflow_tool_auth
        resource_id_vars:
          tool_key: "auth_tool_key"
  - name: dialogflow_tool_bearer
    primary_resource_id: bearer_tool
    steps:
      - name: dialogflow_tool_bearer
        resource_id_vars:
          tool_key: "bearer_token_tool_key"
  - name: dialogflow_tool_oauth
    primary_resource_id: oauth_tool
    steps:
      - name: dialogflow_tool_oauth
        resource_id_vars:
          tool_key: "oauth_tool_key"
  - name: dialogflow_tool_service_agent
    primary_resource_id: service_agent_tool
    steps:
      - name: dialogflow_tool_service_agent
        resource_id_vars:
          tool_key: "service_agent_tool_key"
parameters:
  - name: location
    type: String
    required: true
    immutable: true
    url_param_only: true
    description: |
      The location of the tool.
  - name: toolId
    type: String
    default_from_api: true
    immutable: true
    custom_flatten: templates/terraform/custom_flatten/id_from_name.tmpl
    description: |
      Optional. The ID to use for the tool, which will become the final component of the tool's resource name.
      The tool ID must be compliant with the regression formula `[a-zA-Z][a-zA-Z0-9_-]*` with the characters length in range of [3,64].
      If the field is not provided, an Id will be auto-generated.
properties:
  - name: name
    type: String
    description: |
      The resource name of the tool. Format: `projects/<Project ID>/locations/<Location ID>/tools/<Tool ID>`.
    output: true
  - name: toolKey
    type: String
    description: |
      Required. A human readable short name of the tool, which should be unique within the project. It should only contain letters, numbers, and underscores, and it will be used by LLM to identify the tool.
    required: true
  - name: displayName
    type: String
    description: |
      Optional. The human-readable name of the tool, unique within the project and location.
  - name: description
    type: String
    description: |
      Optional. Human readable description of the tool.
  - name: createTime
    type: String
    description: |
      Output only. Creation time of this tool.
    output: true
  - name: updateTime
    type: String
    description: |
      Output only. Update time of this tool.
    output: true
  - name: satisfiesPzs
    type: Boolean
    description: |
      Output only. A read only boolean field reflecting Zone Separation status of the tool.
    output: true
  - name: satisfiesPzi
    type: Boolean
    description: |
      Output only. A read only boolean field reflecting Zone Isolation status of the tool.
    output: true
  - name: actionConfirmationRequirement
    type: KeyValuePairs
    default_from_api: true
    immutable: true
    description: |
      Optional. Confirmation requirement for the actions. Each key is an action name in the `action_schemas`.
      If an action's confirmation requirement is not specified (either the key is not present, or its value is `CONFIRMATION_REQUIREMENT_UNSPECIFIED`), a default value will be populated depending on the action's method type: GET actions default to `NOT_REQUIRED`, and other actions default to `REQUIRED`.
      Valid values are `REQUIRED` and `NOT_REQUIRED`.
  - name: openApiSpec
    type: NestedObject
    description: |
      OpenAPI specification of the Tool.
      This field is part of a union field `specification`: Only one of `openApiSpec`, `functionSpec`, or `connectorSpec` may be set.
    exactly_one_of:
      - open_api_spec
      - function_spec
      - connector_spec
    properties:
      - name: authentication
        type: NestedObject
        description: |
          Optional. Authentication information required by the API.
        properties:
          - name: apiKeyConfig
            type: NestedObject
            description: |
              Config for API key auth.
              This field is part of a union field `auth_config`: Only one of `apiKeyConfig`, `oauthConfig`, `serviceAgentAuthConfig`, or `bearerTokenConfig` may be set.
            properties:
              - name: keyName
                type: String
                description: |
                  The parameter name or the header name of the API key.
                  E.g., If the API request is "https://example.com/act?X-Api-Key=", "X-Api-Key" would be the parameter name.
                required: true
              - name: apiKey
                type: String
                description: |
                  Optional. The API key. If the `secretVersionForApiKey` field is set, this field will be ignored.
                sensitive: true
              - name: secretVersionForApiKey
                type: String
                description: |
                  Optional. The name of the SecretManager secret version resource storing the API key.
                  If this field is set, the `apiKey` field will be ignored.
                  Format: `projects/{project}/secrets/{secret}/versions/{version}`
              - name: requestLocation
                type: Enum
                description: |
                  Key location in the request.
                required: true
                enum_values:
                  - HEADER
                  - QUERY_STRING
          - name: oauthConfig
            type: NestedObject
            description: |
              Config for OAuth.
              This field is part of a union field `auth_config`: Only one of `apiKeyConfig`, `oauthConfig`, `serviceAgentAuthConfig`, or `bearerTokenConfig` may be set.
            properties:
              - name: oauthGrantType
                type: Enum
                description: |
                  OAuth grant types.
                required: true
                enum_values:
                  - CLIENT_CREDENTIAL
              - name: clientId
                type: String
                description: |
                  The client ID from the OAuth provider.
                required: true
              - name: clientSecret
                type: String
                description: |
                  Optional. The client secret from the OAuth provider. If the `secretVersionForClientSecret` field is set, this field will be ignored.
                sensitive: true
              - name: secretVersionForClientSecret
                type: String
                description: |
                  Optional. The name of the SecretManager secret version resource storing the client secret.
                  If this field is set, the `clientSecret` field will be ignored.
                  Format: `projects/{project}/secrets/{secret}/versions/{version}`
              - name: tokenEndpoint
                type: String
                description: |
                  The token endpoint in the OAuth provider to exchange for an access token.
                required: true
              - name: scopes
                type: Array
                description: |
                  Optional. The OAuth scopes to grant.
                item_type:
                  type: String
          - name: serviceAgentAuthConfig
            type: NestedObject
            description: |
              Config for [Dialogflow service agent](https://cloud.google.com/iam/docs/service-agents#dialogflow-service-agent) auth.
              This field is part of a union field `auth_config`: Only one of `apiKeyConfig`, `oauthConfig`, `serviceAgentAuthConfig`, or `bearerTokenConfig` may be set.
            properties:
              - name: serviceAgentAuth
                type: Enum
                description: |
                  Optional. Indicate the auth token type generated from the Dialogflow service agent.
                  The generated token is sent in the Authorization header.
                enum_values:
                  - ID_TOKEN
                  - ACCESS_TOKEN
          - name: bearerTokenConfig
            type: NestedObject
            description: |
              Config for bearer token auth.
              This field is part of a union field `auth_config`: Only one of `apiKeyConfig`, `oauthConfig`, `serviceAgentAuthConfig`, or `bearerTokenConfig` may be set.
            properties:
              - name: token
                type: String
                description: |
                  Optional. The text token appended to the text `Bearer` to the request Authorization header.
                sensitive: true
              - name: secretVersionForToken
                type: String
                description: |
                  Optional. The name of the SecretManager secret version resource storing the Bearer token.
                  If this field is set, the `token` field will be ignored.
                  Format: `projects/{project}/secrets/{secret}/versions/{version}`
      - name: tlsConfig
        type: NestedObject
        description: |
          Optional. TLS configuration for the HTTPS verification.
        properties:
          - name: caCerts
            type: Array
            description: |
              Specifies a list of allowed custom CA certificates for HTTPS verification.
            required: true
            item_type:
              type: NestedObject
              properties:
                - name: displayName
                  type: String
                  description: |
                    The name of the allowed custom CA certificates. This can be used to disambiguate the custom CA certificates.
                  required: true
                - name: cert
                  type: String
                  description: |
                    The allowed custom CA certificates (in DER format) for HTTPS verification. This overrides the default SSL trust store.
                    If this is empty or unspecified, Dialogflow will use Google's default trust store to verify certificates.
                    N.B. Make sure the HTTPS server certificates are signed with "subject alt name".
                    A base64-encoded string.
                  required: true
      - name: serviceDirectoryConfig
        type: NestedObject
        description: |
          Optional. Service Directory configuration.
        properties:
          - name: service
            type: String
            description: |
              The name of [Service Directory](https://cloud.google.com/service-directory/docs) service.
              Format: `projects/<ProjectID>/locations/<LocationID>/namespaces/<NamespaceID>/services/<ServiceID>`.
              `LocationID` of the service directory must be the same as the location of the tool.
            required: true
      - name: textSchema
        type: String
        description: |
          Required. The OpenAPI schema specified as a text.
          Note: Plays a role in linking the OpenAPI spec with the tool. The `info.title` field in the OpenAPI schema must match the `toolKey` of the tool, otherwise the API will overwrite `info.title` with `toolKey`.
        required: true
  - name: functionSpec
    type: NestedObject
    description: |
      Client side executed function specification.
      This field is part of a union field `specification`: Only one of `openApiSpec`, `functionSpec`, or `connectorSpec` may be set.
    exactly_one_of:
      - open_api_spec
      - function_spec
      - connector_spec
    properties:
      - name: inputSchema
        type: String
        description: |
          Optional. The JSON schema is encapsulated in a [google.protobuf.Struct](https://protobuf.dev/reference/protobuf/google.protobuf/#struct) to describe the input of the function.
          This input is a JSON object that contains the function's parameters as properties of the object.
        state_func: func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }
        custom_flatten: templates/terraform/custom_flatten/json_schema.tmpl
        custom_expand: templates/terraform/custom_expand/json_schema.tmpl
        validation:
          function: validation.StringIsJSON
      - name: outputSchema
        type: String
        description: |
          Optional. The JSON schema is encapsulated in a [google.protobuf.Struct](https://protobuf.dev/reference/protobuf/google.protobuf/#struct) to describe the output of the function.
          This output is a JSON object that contains the function's parameters as properties of the object.
        state_func: func(v interface{}) string { s, _ := structure.NormalizeJsonString(v); return s }
        custom_flatten: templates/terraform/custom_flatten/json_schema.tmpl
        custom_expand: templates/terraform/custom_expand/json_schema.tmpl
        validation:
          function: validation.StringIsJSON
      - name: methodType
        type: Enum
        description: |
          Optional. The method type of the function. If not specified, the default value is GET.
        enum_values:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
  - name: connectorSpec
    type: NestedObject
    immutable: true
    description: |
      Integration connectors tool specification.
      This field is part of a union field `specification`: Only one of `openApiSpec`, `functionSpec`, or `connectorSpec` may be set.
    exactly_one_of:
      - open_api_spec
      - function_spec
      - connector_spec
    properties:
      - name: name
        type: String
        required: true
        description: |
          The full resource name of the referenced Integration Connectors Connection.
          Format: `projects/*/locations/*/connections/*`
      - name: actions
        type: Array
        required: true
        description: |
          Actions for the tool to use.
        item_type:
          type: NestedObject
          properties:
            - name: inputFields
              type: Array
              description: |
                Entity fields to use as inputs for the operation.
                If no fields are specified, all fields of the Entity will be used.
              item_type:
                type: String
            - name: outputFields
              type: Array
              description: |
                Entity fields to return from the operation.
                If no fields are specified, all fields of the Entity will be returned.
              item_type:
                type: String
            - name: connectionActionId
              type: String
              description: |
                ID of a Connection action for the tool to use. This field is part of a required union field `action_spec`.
            - name: entityOperation
              type: NestedObject
              description: |
                Entity operation configuration for the tool to use. This field is part of a required union field `action_spec`.
              properties:
                - name: entityId
                  type: String
                  description: |
                    ID of the entity.
                  required: true
                - name: operation
                  type: Enum
                  description: |
                    The operation to perform on the entity.
                  required: true
                  enum_values:
                    - LIST
                    - GET
                    - CREATE
                    - UPDATE
                    - DELETE
