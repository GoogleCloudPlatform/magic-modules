---
name: Config
description: Configuration for Firebase AI Logic.
references:
  guides:
    Official Documentation: https://firebase.google.com/docs/ai-logic
  api: https://firebase.google.com/docs/reference/ai-logic/rest
base_url: projects/{{project}}/locations/{{location}}/config
min_version: beta
self_link: projects/{{project}}/locations/{{location}}/config
create_url: projects/{{project}}/locations/{{location}}/config?update_mask=*
delete_url: projects/{{project}}/locations/{{location}}/config?update_mask=*
update_mask: true
create_verb: PATCH
update_verb: PATCH
delete_verb: PATCH
id_format: projects/{{project}}/locations/{{location}}/config
import_format:
  - projects/{{project}}/locations/{{location}}/config
  - '{{project}}/{{location}}'
# Singleton, can't be deleted
exclude_sweeper: true
autogen_status: Q29uZmln
custom_code:
  test_check_destroy: templates/terraform/custom_check_destroy/skip_delete_during_test.go.tmpl
samples:
  - name: firebaseailogic_config_basic
    min_version: beta
    primary_resource_id: default
    # Need the time_sleep resource
    external_providers: [time]
    steps:
      - name: firebaseailogic_config_basic
        min_version: beta
        resource_id_vars:
          project_id: basic
        test_vars_overrides:
          # for backward compatible
          project_id: '"basic" + randomSuffix'
        test_env_vars:
          org_id: ORG_ID
          billing_account: BILLING_ACCT
  - name: firebaseailogic_config_full
    min_version: beta
    primary_resource_id: default
    # Need the time_sleep resource
    external_providers: [time]
    steps:
      - name: firebaseailogic_config_full
        min_version: beta
        resource_id_vars:
          project_id: full
        test_vars_overrides:
          # for backward compatible
          project_id: '"full" + randomSuffix'
        test_env_vars:
          org_id: ORG_ID
          billing_account: BILLING_ACCT
parameters:
  - name: location
    type: String
    description: Resource ID segment making up resource `name`. It identifies the resource within its parent collection as described in https://google.aip.dev/122.
    immutable: true
    url_param_only: true
    default_value: global
properties:
  - name: generativeLanguageConfig
    type: NestedObject
    deprecation_message: '`generative_language_config` is deprecated and will be removed in a future major release. Firebase AI Logic now uses a Google-managed service account to authenticate requests to the Gemini Developer API and no longer requires an API key.'
    description: |-
      Configuration for using the Gemini Developer API via Firebase AI Logic.

      Firebase AI Logic now uses a Google-managed service account to authenticate
      requests to the Gemini Developer API and no longer requires an API key.
      Values provided here may be silently ignored on input, and may be omitted in
      responses.
    properties:
      - name: apiKey
        type: String
        ignore_read: true
        write_only: true
        deprecation_message: '`generative_language_config.api_key` is deprecated and will be removed in a future major release. Firebase AI Logic now uses a Google-managed service account to authenticate requests to the Gemini Developer API and no longer requires an API key.'
        description: |-
          The value of the API key. Firebase AI Logic no longer requires API key
          material; values provided here may be silently ignored on input.
  - name: name
    type: String
    description: |-
      Identifier. The resource name of the config.
      Format: projects/{project}/locations/{location}/config
    output: true
  - name: telemetryConfig
    type: NestedObject
    description: |-
      Configuration for telemetry.

      Telemetry is the collection of metrics, logs, and traces recorded by the
      Firebase AI Logic backend.
    properties:
      - name: mode
        type: String
        default_value: NONE
        description: |-
          The current monitoring mode used for this project.
          Possible values:
          NONE
          ALL
      - name: samplingRate
        type: Double
        default_value: 1.0
        description: |-
          The percentage of requests to be sampled, expressed as a fraction
          in the range (0,1]. Note that the actual sampling rate may be lower than
          the specified value if the system is overloaded. Default is 1.0.
  - name: trafficFilter
    type: NestedObject
    description: Configuration for traffic filtering.
    default_from_api: true
    properties:
      - name: templateOnly
        type: Boolean
        default_from_api: true
        send_empty_value: true
        description: |-
          Only allows users to use AI Logic via prompt templates for this project.
          If true, only calls using server templates are permitted.
