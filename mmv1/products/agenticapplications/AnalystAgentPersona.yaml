---
name: AnalystAgentPersona
description: Represents a persona configuration for an analyst agent in Agentic Applications.
base_url: projects/{{project}}/locations/{{location}}/analystAgentPersonas
self_link: projects/{{project}}/locations/{{location}}/analystAgentPersonas/{{analyst_agent_persona_id}}
create_url: projects/{{project}}/locations/{{location}}/analystAgentPersonas?analystAgentPersonaId={{analyst_agent_persona_id}}
update_mask: true
update_verb: PATCH
import_format:
  - projects/{{project}}/locations/{{location}}/analystAgentPersonas/{{analyst_agent_persona_id}}
async:
  operation:
    base_url: '{{op_id}}'
  actions:
    - create
    - update
    - delete
  result:
    resource_inside_response: true
autogen_status: QW5hbHlzdEFnZW50UGVyc29uYUF1dG9nZW5WMkFnZW50
autogen_async: true
custom_code:
  encoder: templates/terraform/encoder/agenticapplications_analyst_agent_persona.go.tmpl

samples:
  - name: analyst_agent_persona_basic
    primary_resource_id: example
    steps:
      - name: analyst_agent_persona_basic
        resource_id_vars:
          persona_id: basic
        vars:
          display_name: "Test Analyst Persona"
          customer_context: "Sample customer context for testing"
          additional_context: "Initial additional context"
          file_title: "financial_summary.txt"
          skill_description: "Skill for finance analysis"
      - name: analyst_agent_persona_basic
        resource_id_vars:
          persona_id: basic
        vars:
          display_name: "Updated Test Analyst Persona"
          customer_context: "Updated customer context for testing"
          additional_context: "Updated additional context"
          file_title: "financial_summary_updated.txt"
          skill_description: "Updated skill description for finance analysis"
  - name: analyst_agent_persona_full
    primary_resource_id: example
    steps:
      - name: analyst_agent_persona_full
        resource_id_vars:
          persona_id: full
          dataset_id: dataset_id
          table_id: table
          bucket_name: bucket
      - name: analyst_agent_persona_full_update
        resource_id_vars:
          persona_id: full
          dataset_id: dataset_id
          table_id: table
          bucket_name: bucket

