---
name: UserLicense
description: |
  Represents a user license assignment record in a Discovery Engine UserStore.
  User licenses are created, updated, and unassigned through the parent
  UserStore's batchUpdateUserLicenses endpoint.
references:
  guides:
    'Manage user licenses': 'https://cloud.google.com/gemini/enterprise/docs/register-and-license-users'
  api: https://cloud.google.com/gemini/enterprise/docs/reference/rest/v1/projects.locations.userStores.userLicenses
base_url: projects/{{project}}/locations/{{location}}/userStores/{{user_store_id}}/userLicenses
self_link: projects/{{project}}/locations/{{location}}/userStores/{{user_store_id}}/userLicenses
create_url: projects/{{project}}/locations/{{location}}/userStores/{{user_store_id}}:batchUpdateUserLicenses
create_verb: POST
update_url: projects/{{project}}/locations/{{location}}/userStores/{{user_store_id}}:batchUpdateUserLicenses
update_verb: POST
delete_url: projects/{{project}}/locations/{{location}}/userStores/{{user_store_id}}:batchUpdateUserLicenses
delete_verb: POST
id_format: projects/{{project}}/locations/{{location}}/userStores/{{user_store_id}}/userLicenses/{{user_principal}}
import_format:
  - projects/{{project}}/locations/{{location}}/userStores/{{user_store_id}}/userLicenses/{{%user_principal}}
  - '{{project}}/{{location}}/{{user_store_id}}/{{user_principal}}'
  - '{{location}}/{{user_store_id}}/{{user_principal}}'
mutex: projects/{{project}}/locations/{{location}}/userStores/{{user_store_id}}
timeouts:
  insert_minutes: 5
  update_minutes: 5
  delete_minutes: 5
autogen_async: true
async:
  actions: ['create', 'delete', 'update']
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  result:
    resource_inside_response: false
exclude_sweeper: true
identity:
  - userPrincipal
nested_query:
  keys:
    - userLicenses
  is_list_of_ids: false
  modify_by_patch: false
custom_code:
  encoder: templates/terraform/encoders/discoveryengine_user_license.go.tmpl
  pre_read: templates/terraform/pre_read/discoveryengine_user_license.go.tmpl
  post_read: templates/terraform/post_read/discoveryengine_user_license.go.tmpl
  pre_delete: templates/terraform/pre_delete/discoveryengine_user_license.go.tmpl
  test_check_destroy: templates/terraform/custom_check_destroy/discoveryengine_user_license.go.tmpl
samples:
  - name: discoveryengine_user_license_basic
    primary_resource_id: primary
    steps:
      - name: discoveryengine_user_license_basic
        resource_id_vars:
          license_config_id: lc-id
          user_principal_id: user
      - name: discoveryengine_user_license_update
        resource_id_vars:
          license_config_id: lc-id
          license_config_id_2: lc-id2
          user_principal_id: user
        # delete_unassigned_user_licenses is a client-side request option on
        # BatchUpdateUserLicensesRequest that is not persisted or returned by
        # ListUserLicenses, so import initializes it to its default value (true).
        ignore_read_extra:
          - delete_unassigned_user_licenses
      - name: discoveryengine_user_license_unassign
        resource_id_vars:
          license_config_id: lc-id
          license_config_id_2: lc-id2
          user_principal_id: user
virtual_fields:
  - name: delete_unassigned_user_licenses
    type: Boolean
    default_value: true
    description: |
      If true, destroying this resource unassigns the license and deletes the
      unassigned user license record from the UserStore. If false, destroying
      this resource unassigns the license while retaining the unassigned user
      license record in `NO_LICENSE` state.
parameters:
  - name: location
    type: String
    description: |
      The geographic location where the user store resides. The value can only
      be one of "global", "us" and "eu".
    url_param_only: true
    required: true
    immutable: true
  - name: user_store_id
    type: String
    description: |
      The ID of the user store. Currently only accepts "default_user_store".
    url_param_only: true
    immutable: true
    default_value: default_user_store
properties:
  - name: userPrincipal
    type: String
    description: |
      The user principal of the User, which may be an email address or a
      Workforce Identity principal identifier.
    required: true
    immutable: true
  - name: licenseConfig
    type: String
    description: |
      The full resource name of the LicenseConfig assigned to the user.
      Format: `projects/{project}/locations/{location}/licenseConfigs/{license_config}`.
      Omitting or clearing this field leaves the user record unassigned in the UserStore.
    diff_suppress_func: tpgresource.ProjectNumberDiffSuppress
  - name: userProfile
    type: String
    description: |
      The user profile display name (for example, full name).
  - name: licenseAssignmentState
    type: String
    description: |
      License assignment state of the user. Possible values include
      `LICENSE_ASSIGNMENT_STATE_UNSPECIFIED`, `ASSIGNED`, `UNASSIGNED`,
      `NO_LICENSE`, `NO_LICENSE_ATTEMPTED_LOGIN`, and `BLOCKED`.
    output: true
  - name: createTime
    type: Time
    description: |
      Timestamp when the user license was created.
    output: true
  - name: updateTime
    type: Time
    description: |
      Timestamp when the user license was last updated.
    output: true
  - name: lastLoginTime
    type: Time
    description: |
      Timestamp when the user last logged in. Empty if the user has never logged in.
    output: true
