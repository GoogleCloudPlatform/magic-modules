---
name: 'AgentAnomalyDetectionScope'
min_version: 'beta'
exclude_tgc: true
description: |-
  An Agent Anomaly Detection (AAD) scope defines the Cloud Logging and
  Observability buckets that AAD monitors for anomalous agent behavior within
  a location. Creating a scope provisions a dedicated tenant project for
  detection. Only one scope may exist per location.
references:
  guides:
    'Agent Anomaly Detection': 'https://cloud.google.com/vertex-ai/generative-ai/docs/agent-engine/'
  api: 'https://cloud.google.com/vertex-ai/docs/reference/rest/v1beta1/projects.locations.agentAnomalyDetectionScopes'
base_url: 'projects/{{project}}/locations/{{region}}/agentAnomalyDetectionScopes'
self_link: 'projects/{{project}}/locations/{{region}}/agentAnomalyDetectionScopes/{{agent_anomaly_detection_scope_id}}'
id_format: 'projects/{{project}}/locations/{{region}}/agentAnomalyDetectionScopes/{{agent_anomaly_detection_scope_id}}'
import_format:
  - 'projects/{{project}}/locations/{{region}}/agentAnomalyDetectionScopes/{{agent_anomaly_detection_scope_id}}'
create_url: 'projects/{{project}}/locations/{{region}}/agentAnomalyDetectionScopes?agentAnomalyDetectionScopeId={{agent_anomaly_detection_scope_id}}'
# The scope has no public update method, so all configurable fields are
# immutable; changing them requires recreating the scope.
immutable: true
timeouts:
  insert_minutes: 40
  delete_minutes: 20
sweeper:
  url_substitutions:
    - region: us
async:
  actions: ['create', 'delete']
  type: 'PollAsync'
  check_response_func_existence: 'PollCheckForScopeActive'
  check_response_func_absence: 'PollCheckForScopeDeleted'
  suppress_error: false
  target_occurrences: 1
# Exercise all configurable fields in a single sample because only one scope may
# exist per location ("us") per project, and generated samples run in parallel.
samples:
  - name: 'vertex_ai_agent_anomaly_detection_scope_basic'
    primary_resource_id: 'scope'
    min_version: 'beta'
    # Pre-grant project-level IAM to the Vertex AI service agent before
    # Terraform runs to avoid IAM propagation races and teardown conflicts across
    # parallel CI tests.
    bootstrap_iam:
      # Required to create Cloud Logging / Observability links on attached buckets.
      - member: "serviceAccount:service-{project_number}@gcp-sa-aiplatform.iam.gserviceaccount.com"
        role: "roles/logging.configWriter"
      # Required for CMEK key validation at create time and BigQuery KMS grant delegation.
      - member: "serviceAccount:service-{project_number}@gcp-sa-aiplatform.iam.gserviceaccount.com"
        role: "roles/cloudkms.cryptoKeyEncrypterDecrypter"
    steps:
      - name: 'vertex_ai_agent_anomaly_detection_scope_basic'
        resource_id_vars:
          scope_id: 'agent-anomaly-detection-scope'
          log_bucket_id: 'aad-log-bucket'
          # Rendered verbatim in public registry docs to show the expected
          # multi-region ("us") KMS key format; overridden in acceptance tests below.
          kms_key_name: 'projects/keys-project/locations/us/keyRings/key-ring/cryptoKeys/crypto-key'
        test_vars_overrides:
          # Cloud KMS key rings cannot be deleted, so reuse the shared "us"
          # multi-region key in the test project instead of creating one per run.
          kms_key_name: 'kms.BootstrapKMSKeyInLocation(t, "us").CryptoKey.Name'
parameters:
  - name: 'region'
    type: String
    description: The region of the AgentAnomalyDetectionScope, e.g. us-central1.
    url_param_only: true
    required: true
    immutable: true
  - name: 'agentAnomalyDetectionScopeId'
    type: String
    description: |-
      The ID to use for the AgentAnomalyDetectionScope, which will become the
      final component of the scope's resource name. This value should be 1-63
      characters and valid characters are /[a-z][0-9]-/.
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: 'name'
    type: String
    description: |-
      The resource name of the AgentAnomalyDetectionScope, in the format
      projects/{{project}}/locations/{{location}}/agentAnomalyDetectionScopes/{{agent_anomaly_detection_scope}}
    output: true
  - name: 'displayName'
    type: String
    description: User provided display name of the AgentAnomalyDetectionScope.
    immutable: true
  - name: 'logBuckets'
    type: Array
    item_type:
      type: String
    description: |-
      Customer owned Cloud Logging bucket resource names attached to this scope.
      Format: projects/{{project}}/locations/{{location}}/buckets/{{bucket}}.
    required: true
    immutable: true
  - name: 'observabilityBuckets'
    type: Array
    item_type:
      type: String
    description: |-
      Customer owned Cloud Observability bucket resource names attached to this
      scope.
      Format: projects/{{project}}/locations/{{location}}/buckets/{{bucket}}/datasets/{{dataset}}.
    required: true
    immutable: true
  - name: 'state'
    type: Enum
    description: |-
      The lifecycle state of the scope.
    output: true
    enum_values:
      - 'CREATING'
      - 'ACTIVE'
      - 'DELETING'
      - 'FAILED'
      - 'UPDATING'
  - name: 'autoEnroll'
    type: Boolean
    description: |-
      When true, agents created in Agent Engine that share log and observability
      buckets with this scope are automatically enrolled as monitored agents.
      When false, agents must be enrolled explicitly.
    immutable: true
  - name: 'encryptionSpec'
    type: NestedObject
    description: |-
      Customer-managed encryption key spec for the scope. If set, this scope
      and all sub-resources are secured by this key. The key must be a
      multi-region (`us` or `eu`) Cloud KMS key in the same region as the scope.
    immutable: true
    properties:
      - name: 'kmsKeyName'
        type: String
        description: |-
          Resource name of the Cloud KMS key used to protect the resource.
          Format: projects/{{project}}/locations/{{location}}/keyRings/{{key_ring}}/cryptoKeys/{{crypto_key}}.
        required: true
        immutable: true
