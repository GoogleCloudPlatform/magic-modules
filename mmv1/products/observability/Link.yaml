---
name: Link
description: Describes a link for an Observability Bucket Dataset.
base_url: projects/{{project}}/locations/{{location}}/buckets/{{bucket}}/datasets/{{dataset}}/links
min_version: beta
self_link: projects/{{project}}/locations/{{location}}/buckets/{{bucket}}/datasets/{{dataset}}/links/{{link_id}}
create_url: projects/{{project}}/locations/{{location}}/buckets/{{bucket}}/datasets/{{dataset}}/links?linkId={{link_id}}
update_mask: true
update_verb: PATCH
id_format: projects/{{project}}/locations/{{location}}/buckets/{{bucket}}/datasets/{{dataset}}/links/{{link_id}}
import_format:
  - 'projects/{{project}}/locations/{{location}}/buckets/{{bucket}}/datasets/{{dataset}}/links/{{link_id}}'
  - '{{project}}/{{location}}/{{bucket}}/{{dataset}}/{{link_id}}'
  - '{{location}}/{{bucket}}/{{dataset}}/{{link_id}}'
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
async:
  actions: [create, delete, update]
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
  result:
    resource_inside_response: true
autogen_async: true
samples:
  - name: "observability_link_basic"
    primary_resource_id: "primary"
    external_providers: [time]
    steps:
      - name: "observability_link_basic"
        resource_id_vars:
          link_id: "my_link"
        vars:
          display_name: "Initial Display Name"
          description: "Initial description"
      - name: "observability_link_basic"
        resource_id_vars:
          link_id: "my_link"
        vars:
          display_name: "Updated Display Name"
          description: "Updated description"
parameters:
  - name: location
    type: String
    description: The location of the link.
    immutable: true
    url_param_only: true
    required: true
  - name: bucket
    type: String
    description: The bucket of the link.
    immutable: true
    url_param_only: true
    required: true
  - name: dataset
    type: String
    description: The dataset of the link.
    immutable: true
    url_param_only: true
    required: true
  - name: linkId
    type: String
    description: A client-assigned identifier for the link.
    immutable: true
    url_param_only: true
    required: true
properties:
  - name: createTime
    type: String
    description: Output only. The creation timestamp of the link.
    output: true
  - name: description
    type: String
    description: Describes this link.
    default_from_api: true
  - name: displayName
    type: String
    description: User-assigned name of the link.
    default_from_api: true
  - name: name
    type: String
    description: |-
      Identifier. The resource name of the link. The format is: projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]/links/[LINK_ID]
    output: true
