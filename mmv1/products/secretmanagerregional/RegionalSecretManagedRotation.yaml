---
name: RegionalSecretManagedRotation
api_resource_type_kind: Secret
description: |
  Enables managed rotation of Cloud SQL single-user credentials for a regional secret of type
  `CLOUD_SQL_DB_CREDENTIALS`. When managed rotation is enabled, Secret Manager adds a new secret
  version containing the credentials and updates the password of the Cloud SQL database user.
references:
  guides:
    Create a regional secret: https://cloud.google.com/secret-manager/regional-secrets/create-regional-secret
  api: https://cloud.google.com/secret-manager/docs/reference/rest/v1/projects.locations.secrets
docs:
  note: |
    Managed rotation can only be enabled once for a given regional secret, and it cannot be disabled.
    Deleting this resource only removes it from the Terraform state; it does not disable managed rotation.
    To change the Cloud SQL instance or user that a secret rotates, the regional secret must be recreated.
  warning: |
    The regional secret's principal (`policy_member[0].iam_policy_uid_principal` on
    `google_secret_manager_regional_secret`) must be granted the Cloud SQL permissions required to
    update the database user's password before managed rotation is enabled.
base_url: projects/{{project}}/locations/{{location}}/secrets
self_link: projects/{{project}}/locations/{{location}}/secrets/{{secret_id}}
create_url: projects/{{project}}/locations/{{location}}/secrets/{{secret_id}}:enableManagedRotation
id_format: projects/{{project}}/locations/{{location}}/secrets/{{secret_id}}
import_format:
  - projects/{{project}}/locations/{{location}}/secrets/{{secret_id}}
immutable: true
exclude_delete: true
exclude_sweeper: true
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
custom_code:
  decoder: templates/terraform/decoders/secret_manager_regional_secret_managed_rotation.go.tmpl
samples:
  - name: regional_secret_managed_rotation_basic
    primary_resource_id: rotation
    steps:
      - name: regional_secret_managed_rotation_basic
        resource_id_vars:
          secret_id: tf-reg-secret
          instance_name: tf-sql-instance
          user_name: tf-sql-user
  - name: regional_secret_managed_rotation_write_only
    primary_resource_id: rotation
    steps:
      - name: regional_secret_managed_rotation_write_only
        resource_id_vars:
          secret_id: tf-reg-secret
          instance_name: tf-sql-instance
          user_name: tf-sql-user
parameters:
  - name: location
    type: String
    description: |
      The location of the regional secret. eg us-central1
    url_param_only: true
    required: true
    immutable: true
  - name: secretId
    type: String
    description: |
      The ID of the regional secret of type `CLOUD_SQL_DB_CREDENTIALS` to enable managed rotation for.
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: cloudSqlSingleUserCredentials
    type: NestedObject
    description: |
      The Cloud SQL single-user credentials to manage.
    required: true
    ignore_read: true
    properties:
      - name: instanceId
        type: String
        description: |
          The name of the Cloud SQL instance. The instance must be in the same project as the regional secret.
        required: true
      - name: username
        type: String
        description: |
          The username of the Cloud SQL database user.
        required: true
      - name: password
        type: String
        description: |
          The initial password to set for the database user. If not provided, a random password will be generated.
        write_only: true
  - name: rotation
    type: NestedObject
    description: |
      The rotation configuration of the regional secret.
    output: true
    properties:
      - name: managedRotationStatus
        type: NestedObject
        description: |
          The current status of the managed rotation.
        output: true
        properties:
          - name: state
            type: String
            description: |
              Indicates whether the managed rotation is `ACTIVE` or `INACTIVE`.
            output: true
          - name: error
            type: NestedObject
            description: |
              Customer-facing issues that occurred during an asynchronous managed rotation, for example
              permission errors.
            output: true
            properties:
              - name: code
                type: Integer
                description: |
                  The status code, which should be an enum value of `google.rpc.Code`.
                output: true
              - name: message
                type: String
                description: |
                  A developer-facing error message.
                output: true
