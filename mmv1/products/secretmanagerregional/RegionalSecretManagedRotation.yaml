---
name: RegionalSecretManagedRotation
api_resource_type_kind: Secret
description: |
  Enables managed rotation for a regional secret of type `CLOUD_SQL_DB_CREDENTIALS`. Secret Manager
  rotates the password of the given Cloud SQL database user and stores the new credentials as secret versions.

  ~> **Note:** Before this resource is created, the secret's own principal
  (`google_secret_manager_regional_secret.policy_member[0].iam_policy_uid_principal`) must be granted
  a project role containing `cloudsql.users.get`, `cloudsql.users.list` and `cloudsql.users.update`,
  for example `roles/cloudsql.admin`.
  Rotation failures are reported asynchronously in `rotation[0].managed_rotation_status`.

  ~> **Note:** The API has no method to disable managed rotation. Deleting this resource only removes it
  from the Terraform state; rotation stops when the secret itself is deleted.
references:
  guides:
    Set up automatic rotation for Cloud SQL secrets: https://cloud.google.com/secret-manager/regional-secrets/set-up-automatic-rotation-for-cloudsql-secrets-rs
  api: https://cloud.google.com/secret-manager/docs/reference/rest/v1/projects.locations.secrets
docs:
base_url: projects/{{project}}/locations/{{location}}/secrets
self_link: projects/{{project}}/locations/{{location}}/secrets/{{secret_id}}
create_url: projects/{{project}}/locations/{{location}}/secrets/{{secret_id}}:enableManagedRotation
immutable: true
# cloud_sql_single_user_credentials is never returned by the API, so an imported resource could not be
# reconciled with its configuration.
exclude_import: true
# There is no disableManagedRotation method.
exclude_delete: true
exclude_sweeper: true
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
samples:
  - name: regional_secret_managed_rotation_cloud_sql
    primary_resource_id: managed-rotation
    steps:
      - name: regional_secret_managed_rotation_cloud_sql
        # The resource does not support import, see exclude_import above.
        exclude_import_test: true
        resource_id_vars:
          secret_id: tf-reg-secret
          instance_name: tf-rotation-instance
          user_name: tf-rotation-user
parameters:
  - name: location
    type: String
    description: |
      The location of the regional secret, for example `us-central1`.
    url_param_only: true
    required: true
    immutable: true
  - name: secretId
    type: String
    description: |
      The ID of the regional secret. The secret must have `secret_type` set to `CLOUD_SQL_DB_CREDENTIALS`.
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: cloudSqlSingleUserCredentials
    type: NestedObject
    description: |
      The Cloud SQL database user whose password Secret Manager rotates.
    required: true
    # Only accepted by :enableManagedRotation; the Secret returned by GET does not contain it.
    ignore_read: true
    properties:
      - name: instanceId
        type: String
        description: |
          The bare Cloud SQL instance ID, for example `my-instance`. The instance must be in the same
          project as the secret.
        required: true
      - name: username
        type: String
        description: |
          The name of an existing database user on the instance.
        required: true
  - name: rotation
    type: NestedObject
    description: |
      Rotation state reported by the API.
    output: true
    properties:
      - name: managedRotationStatus
        type: NestedObject
        description: |
          Status of managed rotation. Contains an error when rotation fails, for example when the secret's
          principal is missing Cloud SQL permissions or the instance or user doesn't exist.
        output: true
        properties:
          - name: error
            type: NestedObject
            description: |
              The error from the most recent rotation attempt, if any.
            output: true
            properties:
              - name: code
                type: Integer
                description: |
                  The status code, a value of `google.rpc.Code`.
                output: true
              - name: message
                type: String
                description: |
                  A developer-facing error message.
                output: true
