---
name: ClusterTokenAuthUser
description: Represents a Token Auth User for a Google Cloud Redis Cluster.
references:
  guides:
    Official Documentation: https://cloud.google.com/memorystore/docs/cluster/
  api: https://cloud.google.com/memorystore/docs/cluster/reference/rest/v1/projects.locations.clusters
docs:
  note: |
    Removing a `google_redis_cluster_token_auth_user` resource from the Terraform configuration deletes the user and revokes all of its tokens.

    The `default` user is automatically created when token-based authentication (`AUTH_MODE_TOKEN_AUTH`) is enabled on a cluster and is lifecycle-bound to the cluster; it cannot be created or deleted via `google_redis_cluster_token_auth_user`. To view the `default` user's metadata, use the `google_redis_cluster_token_auth_user` data source.
supports_indirect_user_project_override: true
immutable: true
base_url: projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers
self_link: projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}
create_url: projects/{{project}}/locations/{{region}}/clusters/{{cluster}}:addTokenAuthUser
id_format: projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}
import_format:
  - projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
custom_code:
  encoder: templates/terraform/encoders/redis_token_auth_user.go.tmpl
samples:
  - name: redis_cluster_token_auth_user_basic
    primary_resource_id: user-basic
    steps:
      - name: redis_cluster_token_auth_user_basic
        resource_id_vars:
          cluster_name: user-basic-cluster
          user_id: user-basic-user
parameters:
  - name: region
    type: String
    description: The name of the region of the Redis cluster.
    immutable: true
    url_param_only: true
    ignore_read: true
    default_from_api: true
  - name: cluster
    type: ResourceRef
    resource: Cluster
    imports: name
    description: The name or resource ID of the Redis cluster.
    required: true
    immutable: true
    url_param_only: true
    diff_suppress_func: tpgresource.CompareSelfLinkOrResourceName
  - name: userId
    type: String
    description: |
      The unique ID (username) of the Token Auth User.
      The `default` user cannot be managed with this resource.
    required: true
    immutable: true
    url_param_only: true
    validation:
      function: 'verify.StringNotInSlice([]string{"default"}, false)'
properties:
  - name: name
    type: String
    description: The full resource name of the Token Auth User.
    output: true
  - name: state
    type: String
    description: The current state of the Token Auth User.
    output: true
