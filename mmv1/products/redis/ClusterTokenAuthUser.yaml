---
name: "ClusterTokenAuthUser"
description: "Represents a Token Auth User for a Google Cloud Redis Cluster."
immutable: true
base_url: "projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers"
self_link: "projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}"
create_url: "projects/{{project}}/locations/{{region}}/clusters/{{cluster}}:addTokenAuthUser"
id_format: "projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}"
import_format:
  - "projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}"
async:
  type: OpAsync
custom_code:
  encoder: templates/terraform/encoders/redis_token_auth_user.go.tmpl
properties:
  - name: "cluster"
    type: "ResourceRef"
    resource: "Cluster"
    imports: "name"
    description: "The full name of the Redis cluster."
    required: true
    url_param_only: true
  - name: "region"
    type: "String"
    description: "The name of the region of the Redis cluster."
    url_param_only: true
    immutable: true
  - name: "user_id"
    type: "String"
    description: "The unique ID (username) of the Token Auth User."
    required: true
    url_param_only: true
  - name: "name"
    type: "String"
    description: "The full resource name of the Token Auth User."
    output: true
  - name: "state"
    type: "String"
    description: "The current state of the Token Auth User."
    output: true
