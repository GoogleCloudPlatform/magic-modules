---
name: ClusterAuthToken
description: |
  Represents an Auth Token for a Token Auth User within a Google Cloud Redis Cluster.

  When token-based authentication (`AUTH_MODE_TOKEN_AUTH`) is enabled on a cluster (for the `default` user) or when a `google_redis_cluster_token_auth_user` is created, an initial token (`version-1`) is automatically created by the API. Setting `token_id` on create (for example, `token_id = "version-1"`) acquires and manages that existing token in Terraform state instead of creating a new one, returning an error if no token with that ID exists. Omitting `token_id` creates a new server-assigned token version (`version-N`).

  Each user can have at most 2 active tokens at a time and must retain at least 1 active token. To perform zero-downtime token rotation, declare two `google_redis_cluster_auth_token` resources (acquiring `version-1` with `token_id = "version-1"` on the first resource and creating `version-2` by omitting `token_id` on the second), update client applications to use the new token, and then remove the old token resource from the Terraform configuration.
references:
  guides:
    Official Documentation: https://cloud.google.com/memorystore/docs/cluster/
  api: https://cloud.google.com/memorystore/docs/cluster/reference/rest/v1/projects.locations.clusters
docs:
  note: |
    Deleting the sole remaining token for a user is rejected by the API. Set `deletion_policy = "ABANDON"` to remove a user's last remaining token from Terraform state without calling the delete API (for example, before destroying the parent user or cluster).
supports_indirect_user_project_override: true
immutable: true
# A per-user mutex lock is required because :addAuthToken and DELETE transition the parent
# TokenAuthUser into UPDATING state on the backend, which rejects concurrent token operations
# for the same user with FAILED_PRECONDITION: token auth user is not in active state.
mutex: projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}
base_url: projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}/authTokens
self_link: projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}/authTokens/{{token_id}}
create_url: projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}:addAuthToken
delete_url: projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}/authTokens/{{token_id}}
id_format: projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}/authTokens/{{token_id}}
import_format:
  - projects/{{project}}/locations/{{region}}/clusters/{{cluster}}/tokenAuthUsers/{{user_id}}/authTokens/{{token_id}}
async:
  type: OpAsync
  operation:
    base_url: '{{op_id}}'
custom_code:
  constants: templates/terraform/constants/redis_auth_token.go.tmpl
  custom_create: templates/terraform/custom_create/redis_auth_token.go.tmpl
  encoder: templates/terraform/encoders/redis_auth_token.go.tmpl
samples:
  - name: redis_cluster_auth_token_basic
    primary_resource_id: token-basic
    steps:
      - name: redis_cluster_auth_token_basic
        resource_id_vars:
          cluster_name: token-basic-cluster
          user_id: token-basic-user
parameters:
  - name: region
    type: String
    description: The name of the region of the Redis cluster.
    immutable: true
    url_param_only: true
    ignore_read: true
    default_from_api: true
  - name: cluster
    type: ResourceRef
    resource: Cluster
    imports: name
    description: The name or resource ID of the Redis cluster.
    required: true
    immutable: true
    url_param_only: true
    diff_suppress_func: tpgresource.CompareSelfLinkOrResourceName
  - name: userId
    type: String
    description: The unique ID (username) of the Token Auth User.
    required: true
    immutable: true
    url_param_only: true
    diff_suppress_func: tpgresource.CompareSelfLinkOrResourceName
properties:
  # tokenId cannot be required: true or url_param_only: true because the Redis Cluster API's
  # :addAuthToken endpoint generates sequential version-N IDs server-side and does not accept
  # a client-specified ID at create time. Keeping default_from_api: true allows users to either
  # omit token_id (so the server generates the next version) or specify an existing token ID
  # (such as the initial "version-1" token auto-created with the cluster or user) to acquire it.
  - name: tokenId
    type: String
    api_name: name
    description: |
      The ID of the auth token (for example, `version-1`), or its full resource name.
      If specified, Terraform acquires and manages the existing active token with this ID (such as the initial `version-1` token automatically created with the cluster or user) and returns an error if it does not exist.
      If omitted, a new token version will be created on the server.
    default_from_api: true
    immutable: true
    diff_suppress_func: tpgresource.CompareSelfLinkOrResourceName
    custom_flatten: templates/terraform/custom_flatten/name_from_self_link.tmpl
  - name: name
    type: String
    description: The full resource name of the Auth Token.
    output: true
  - name: token
    type: String
    description: The generated auth token string.
    output: true
    sensitive: true
  - name: createTime
    type: Time
    description: The creation time of the auth token.
    output: true
  - name: state
    type: String
    description: The current state of the Auth Token.
    output: true
