---
name: "ClusterAuthToken"
description: "Represents an Auth Token for a Token Auth User within a Google Cloud Redis Cluster."
references:
  guides:
    Official Documentation: https://cloud.google.com/memorystore/docs/cluster/
  api: https://cloud.google.com/memorystore/docs/cluster/reference/rest/v1/projects.locations.clusters
docs:
  note: |
    When token-based authentication (`AUTH_MODE_TOKEN_AUTH`) is enabled on a cluster (for the `default` user) or when a `google_redis_cluster_token_auth_user` is created, an initial token (`version-1`) is automatically created by the API.

    Each user can have at most 2 active tokens at a time and must have at least 1 active token (deleting the sole remaining token for a user is rejected by the API; to abandon the last remaining token from Terraform state without calling the delete API—for example before destroying the parent user or cluster—set `deletion_policy = "ABANDON"`).

    To perform zero-downtime token rotation (CUJ 6): declare two `google_redis_cluster_auth_token` resources (acquiring the existing `version-1` token with `token_id = "version-1"` on the first resource and creating `version-2` with the second resource), update client applications to use the new token, and then remove the old token resource from the Terraform configuration.
supports_indirect_user_project_override: true
immutable: true
mutex: '{{token_auth_user}}'
base_url: "{{token_auth_user}}/authTokens"
self_link: "{{token_auth_user}}/authTokens/{{token_id}}"
create_url: "{{token_auth_user}}:addAuthToken"
delete_url: "{{token_auth_user}}/authTokens/{{token_id}}"
id_format: "{{token_auth_user}}/authTokens/{{token_id}}"
import_format:
  - "{{token_auth_user}}/authTokens/{{token_id}}"
async:
  type: OpAsync
  include_project: true
  operation:
    base_url: '{{op_id}}'
custom_code:
  custom_create: templates/terraform/custom_create/redis_auth_token.go.tmpl
  custom_import: templates/terraform/custom_import/redis_auth_token.go.tmpl
  encoder: templates/terraform/encoders/redis_auth_token.go.tmpl
samples:
  - name: redis_cluster_auth_token_basic
    primary_resource_id: token-basic
    steps:
      - name: redis_cluster_auth_token_basic
        resource_id_vars:
          cluster_name: token-basic-cluster
properties:
  - name: "token_auth_user"
    type: "String"
    description: "The full name of the parent Token Auth User."
    required: true
    url_param_only: true
    diff_suppress_func: 'tpgresource.CompareSelfLinkOrResourceName'
  - name: "token_id"
    type: String
    api_name: name
    description: |
      The ID of the auth token (for example, `version-1`), or its full resource name.
      If specified and an active token with this ID already exists for the user (such as the initial `version-1` token automatically created with the cluster or user), Terraform will acquire and manage the existing token instead of creating a new one.
      If omitted, a new token version will be created on the server.
    default_from_api: true
    immutable: true
    diff_suppress_func: 'tpgresource.CompareSelfLinkOrResourceName'
    custom_flatten: 'templates/terraform/custom_flatten/name_from_self_link.tmpl'
  - name: "name"
    type: "String"
    description: "The full resource name of the Auth Token."
    output: true
  - name: "token"
    type: "String"
    description: "The generated auth token string."
    output: true
    sensitive: true
  - name: "createTime"
    type: "Time"
    description: "The creation time of the auth token."
    output: true
  - name: "state"
    type: "String"
    description: "The current state of the Auth Token."
    output: true
